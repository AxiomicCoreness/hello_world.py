apiVersion: batch/v1
kind: CronJob
metadata:
  name: simd-batch-step
  namespace: sovereign-garden
  labels:
    app: simd-batch-step
    layer: "314"
    sovereignty: active
  annotations:
    garden.axiomic/ledger: "8793"
    garden.axiomic/image: "axiomic/sovereign-engine:latest"
    garden.axiomic/base: "ccc59bf7"
    garden.axiomic/seal: "IMAGE_RESET_8793"
    garden.axiomic/coherence: "1.0"
    garden.axiomic/phase_deg: "202.6"
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: simd-batch-step
            layer: "314"
        spec:
          restartPolicy: OnFailure
          containers:
          - name: simd-step
            image: axiomic/sovereign-engine:latest
            imagePullPolicy: Always
            command:
              - /bin/sh
              - -c
              - |
                exec python -m orchestrator.simd_step \
                  --no-http \
                  --branch "${BRANCH}" \
                  --coherence "${COHERENCE}" \
                  --phase "${PHASE}" \
                  --nodes "${MESH_NODES}"
            env:
            - name: PYTHONPATH
              value: "/app"
            - name: BRANCH
              value: "B"
            - name: COHERENCE
              value: "1.0"
            - name: PHASE
              value: "202.6"
            - name: MESH_NODES
              value: "7"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oidc-venomsuite
                  key: deepseek-api-key
                  optional: true
            - name: GARDEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-venomsuite
                  key: secret
                  optional: true
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
