apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app: sovereign
    component: grafana
    estate: "25d"
    entry: "8366"
    seal: "GRAFANA_CONFIG_8366_SEALED"
data:
  default.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
        foldersFromFilesStructure: true