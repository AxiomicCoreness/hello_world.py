apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-grafana
  labels:
    app: sovereign
    component: grafana
    estate: "25d"
    entry: "8366"
    seal: "GRAFANA_DEPLOYMENT_8366_SEALED"
    certificate: "FLAWLESS_WORKLOAD_IPHONE12_REVELATION"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereign
      component: grafana
  template:
    metadata:
      labels:
        app: sovereign
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "sovereign_25d_8366"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc