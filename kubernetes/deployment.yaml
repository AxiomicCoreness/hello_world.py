apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-api
  labels:
    app: sovereign-garden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereign-garden
  template:
    metadata:
      labels:
        app: sovereign-garden
    spec:
      containers:
      - name: api
        image: axiomic/sovereign-engine:latest
        imagePullPolicy: IfNotPresent
        # app:app_main resolves via app/__init__.py, which re-exports app_main
        # from the repo-root app.py (the app/ package shadows app.py).
        # The image must contain app/, app.py and garden_surgery/.
        # --host 0.0.0.0 is normal inside a container (pod network only);
        # local runs use 127.0.0.1 (scripts/uvicorn_restart.py).
        command: ["uvicorn"]
        args: ["app:app_main", "--host", "0.0.0.0", "--port", "8024"]
        ports:
        - name: http
          containerPort: 8024
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
