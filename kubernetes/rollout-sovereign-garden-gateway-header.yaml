apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sovereign-garden
  namespace: sovereign-garden
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 3
  selector:
    matchLabels: { app: sovereign-garden }
  template:
    metadata:
      labels: { app: sovereign-garden }
    spec:
      containers:
        - name: engine
          image: axiomic/sovereign-engine:latest
          ports:
            - { containerPort: 8000 }
  strategy:
    canary:
      steps:
        - setHeaderRoute:
            name: qa-canary
            match:
              - headerName: X-Canary
                headerValue:
                  exact: "true"
        - pause: { duration: 30s }
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
        - setWeight: 100
        - setHeaderRoute:
            name: qa-canary
            match: []
