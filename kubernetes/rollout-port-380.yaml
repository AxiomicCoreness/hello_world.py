# Argo Rollouts — progressive delivery for port-380 gate
# Requires: kubectl apply -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
# Analysis uses /health; can promote to canary weight steps.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: port-380-gate
  namespace: sovereign-garden
  labels:
    app: port-380-gate
    layer: "314"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: port-380-gate
  template:
    metadata:
      labels:
        app: port-380-gate
        layer: "314"
    spec:
      containers:
      - name: sovereign-engine
        image: axiomic/sovereign-engine:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: FRB_PERIOD_SECS
          value: "78624.0"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  strategy:
    canary:
      maxUnavailable: 0
      steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: port-380-gate
  namespace: sovereign-garden
  labels:
    app: port-380-gate
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: port-380-gate
  ports:
  - name: http
    port: 380
    targetPort: http
