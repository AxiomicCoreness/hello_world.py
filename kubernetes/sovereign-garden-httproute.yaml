apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sovereign-garden
  namespace: sovereign-garden
spec:
  parentRefs:
    - name: garden-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: sovereign-garden-stable
          port: 8000
          weight: 80
        - name: sovereign-garden-canary
          port: 8000
          weight: 20
