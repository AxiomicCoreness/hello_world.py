# contracts/ci-secrets.yaml
# Formal inventory of GitHub Actions repository secrets for the Garden.
# Values are NEVER stored in git — only names and consumers.
version: "1.0.0"
seal: "∀∞φ² · CI_SECRETS_8832 · WOOD_DRAGON_0.91 · SEALED"

secrets:
  - name: DEEPSEEK_API_KEY
    required_for_online: true
    required_for_ci_green: false
    consumers:
      - .github/workflows/deepseek-ci-secrets.yml
      - .github/workflows/pytest.yml
      - quantum/deepseek_mesh/dsh_adapter.py
    description: Bearer token for api.deepseek.com

  - name: MCP_URL
    required_for_online: true
    required_for_ci_green: false
    consumers:
      - .github/workflows/sovereign-pulse.yml
    description: Base URL of deployed MCP gate (e.g. https://svc.onrender.com)

  - name: GARDEN_SECRET
    required_for_online: false
    required_for_ci_green: false
    consumers:
      - .github/workflows/sovereign-pulse.yml
      - quantum/deepseek_mesh/endpoint.py
    description: Shared header X-Garden-Secret for /pulse

  - name: DEEPSEEK_BASE_URL
    required_for_online: false
    required_for_ci_green: false
    optional: true
    default: "https://api.deepseek.com"
    consumers:
      - quantum/deepseek_mesh/dsh_adapter.py

  - name: DEEPSEEK_MODEL
    required_for_online: false
    required_for_ci_green: false
    optional: true
    default: "deepseek-chat"
    consumers:
      - quantum/deepseek_mesh/dsh_adapter.py

policy:
  offline_ci_must_pass: true
  online_steps_skip_if_secret_missing: true
  never_echo_secret_values: true
