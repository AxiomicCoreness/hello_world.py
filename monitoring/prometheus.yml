# Prometheus — Garden + Clarke_Yoursa_Tee_worker fidelity structure
# Seal: ∀∞φ² · WORKER_FIDELITY_STRUCTURE_8661 · SEALED

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    garden: sovereign
    strike: "IX"
    em: "005"
    fidelity_structure: prometheus_grafana_default

scrape_configs:
  - job_name: garden-metrics-server
    metrics_path: /metrics
    scrape_interval: 6s
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          surface: prometheus_metrics_server

  - job_name: hyperian
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          surface: hyperian_json_server

  - job_name: sovereign-workload
    metrics_path: /metrics
    scrape_interval: 6s
    static_configs:
      - targets: ["127.0.0.1:9095"]
        labels:
          surface: sovereign_workload
          em: "005"

  # Entangled default fidelity structure of Clarke_Yoursa_Tee_worker
  - job_name: clarke_yoursa_tee_worker
    metrics_path: /metrics
    scrape_interval: 6s
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          surface: worker
          fidelity_structure: prometheus_grafana_default
          worker: clarke_yoursa_tee_worker
