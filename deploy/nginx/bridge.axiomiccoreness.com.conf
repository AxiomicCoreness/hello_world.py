# deploy/nginx/bridge.axiomiccoreness.com.conf
#
# Requires the following in the http {} block of nginx.conf:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
# limit_req_zone $binary_remote_addr zone=qwen_abliterated:10m rate=6r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name bridge.axiomiccoreness.com;

    # Replace with actual certbot paths on the host server
    ssl_certificate /etc/letsencrypt/live/bridge.axiomiccoreness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.axiomiccoreness.com/privkey.pem;

    # Route the IRC CLI WebSocket to the local bridge
    location /cli {
        proxy_pass http://127.0.0.1:6680;

        # WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep the IRC WebSocket open (default is 60s, this is 1 hour)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WARNING: this exposes an uncensored (abliterated) model to the public
    # internet with NO authentication. Anyone who finds the URL can use it.
    # Optional hardening, recommended: start llama-server with --api-key so it
    # checks its own bearer token (keep the key on the host, never in this repo),
    # or add auth_basic here with an htpasswd file kept off the repo.
    # llama-server itself stays bound to 127.0.0.1:8083 (Cosmic Alignment).
    #
    # The trailing slash on proxy_pass strips the prefix:
    # /qwen-abliterated/v1/chat/completions -> /v1/chat/completions
    location /qwen-abliterated/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;

        # Only the methods the API needs (GET also admits HEAD)
        limit_except GET POST {
            deny all;
        }

        # Basic per-IP rate limit (zone defined in the http {} block)
        limit_req zone=qwen_abliterated burst=5 nodelay;
        limit_req_status 429;

        client_max_body_size 1m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass streamed (SSE) responses through as they are generated
        proxy_buffering off;

        # Slow CPU generation
        proxy_read_timeout 300s;
    }

    # NOTE: /llm is intentionally omitted. It is a chat command sent over the /cli socket.
    # NOTE: /proxy/ is intentionally omitted. Exposing cors-anywhere publicly is a security risk.
}
