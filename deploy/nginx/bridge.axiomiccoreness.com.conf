# deploy/nginx/bridge.axiomiccoreness.com.conf
#
# Requires the following in the http {} block of nginx.conf:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 443 ssl;
    http2 on;
    server_name bridge.axiomiccoreness.com;

    # Replace with actual certbot paths on the host server
    ssl_certificate /etc/letsencrypt/live/bridge.axiomiccoreness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.axiomiccoreness.com/privkey.pem;

    # Route the IRC CLI WebSocket to the local bridge
    location /cli {
        proxy_pass http://127.0.0.1:6680;

        # WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep the IRC WebSocket open (default is 60s, this is 1 hour)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # NOTE: /llm is intentionally omitted. It is a chat command sent over the /cli socket.
    # NOTE: /proxy/ is intentionally omitted. Exposing cors-anywhere publicly is a security risk.
}
