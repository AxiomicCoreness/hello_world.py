# Port 380 gate Deployment — dependency for Ingress path /380
# Selector app: port-380-gate matches k8s/service-port-380.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-380-gate
  labels:
    app: port-380-gate
    entry: "314"
    layer: "314"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-380-gate
  template:
    metadata:
      labels:
        app: port-380-gate
        layer: "314"
    spec:
      containers:
        - name: gate
          image: python:3.11-slim
          workingDir: /app
          command: ["python", "-m", "quantum.port_380_http"]
          ports:
            - name: gate
              containerPort: 380
          env:
            - name: PORT380_HOST
              value: "0.0.0.0"
            - name: PORT380_PORT
              value: "380"
            - name: PYTHONPATH
              value: "/app"
          readinessProbe:
            httpGet:
              path: /health
              port: 380
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 380
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: src
              mountPath: /app
      volumes:
        - name: src
          emptyDir: {}
      # Production: replace emptyDir with image that CONTAINS the repo
      # (axiomiccoreness/sovereign-engine or build from Dockerfile).
