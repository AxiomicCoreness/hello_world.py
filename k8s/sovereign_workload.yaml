apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-workload-exporter
  namespace: sovereign-garden
  labels:
    app: sovereign-workload
    em: "005"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereign-workload
  template:
    metadata:
      labels:
        app: sovereign-workload
        em: "005"
    spec:
      containers:
      - name: exporter
        image: python:3.11-slim
        workingDir: /app
        command: ["python", "/app/sovereign_workload_exporter.py", "--port", "9095"]
        ports:
        - containerPort: 9095
          name: metrics
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: script
          mountPath: /app
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: sovereign-workload-script
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-workload
  namespace: sovereign-garden
  labels:
    app: sovereign-workload
    em: "005"
spec:
  selector:
    app: sovereign-workload
  ports:
  - port: 9095
    targetPort: 9095
    name: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-workload-script
  namespace: sovereign-garden
data:
  # Prefer mounting repo file in real deploys; stub points operators to monitoring/
  README: |
    Mount monitoring/sovereign_workload_exporter.py as /app/sovereign_workload_exporter.py
    or bake image from repo. Stdlib only — no secrets in metrics.
