# k8s/service.yaml – Sovereign FastAPI surface
apiVersion: v1
kind: Service
metadata:
  name: fastapi-sovereign-service
  labels:
    app: fastapi-sovereign
spec:
  type: LoadBalancer
  selector:
    app: fastapi-sovereign
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
