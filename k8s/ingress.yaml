# k8s/ingress.yaml – Gold Standard Ingress + TLS (Entry 623)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-sovereign
  labels:
    app: fastapi-sovereign
    entry: "623"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.sovereign.garden
      secretName: sovereign-tls
  rules:
    - host: api.sovereign.garden
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-sovereign-service
                port:
                  number: 80
