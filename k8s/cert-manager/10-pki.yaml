---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: garden-ca-secondary
  namespace: sovereign-garden
  labels:
    garden.sovereign/component: mtls
    garden.sovereign/role: ca-secondary
  annotations:
    garden.sovereign/purpose: |
      Secondary root CA, independently issued by garden-selfsigned.
      Not a mirror of garden-root-ca (which lives in the cert-manager
      namespace). Reserved for future cross-cluster trust; not consumed
      by any current leaf certificate.
spec:
  isCA: true
  commonName: SovereignGarden-CA-Secondary
  secretName: garden-ca-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  subject:
    organizations:
      - SovereignGarden
  issuerRef:
    name: garden-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
