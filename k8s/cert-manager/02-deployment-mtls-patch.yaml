#
# Port-380 gate: mTLS mount + env.
#
# PATCH FRAGMENT — this is not a complete Deployment. It carries
# `spec.template.spec.containers[0]` env + mounts only. The base
# Deployment (name: port-380-gate, namespace: sovereign-garden) must
# supply spec.selector, spec.replicas, and image.
#
# Apply via kustomize `patches:` or a manual strategic-merge — do NOT
# `kubectl apply` alone.
#
# Deterministic path: k8s/cert-manager/02-deployment-mtls-patch.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-380-gate
  namespace: sovereign-garden
spec:
  template:
    metadata:
      annotations:
        garden.sovereign/mtls: cert-manager
    spec:
      containers:
        - name: sovereign-engine
          env:
            - name: SERVER_CERT
              value: /certs/tls.crt
            - name: SERVER_KEY
              value: /certs/tls.key
            - name: CA_CERT
              value: /certs/ca.crt
            - name: MTLS_SOFT
              value: "0"
          volumeMounts:
            - name: port380-server-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: port380-server-tls
          secret:
            secretName: port380-server-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
            defaultMode: 0400
