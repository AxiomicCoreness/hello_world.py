apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: garden-metrics-server
  namespace: sovereign-garden
  labels:
    app: prometheus-metrics
    strike: "IX"
    release: prometheus
  annotations:
    garden.seal: "∀∞φ² · PROMETHEUS_POINT_STRIKE_IX_8648 · SEALED"
    garden.cannon_gauges: |
      soul_cannon_charge_joules,
      soul_cannon_azimuth_degrees,
      cannon_ring_resonance_thz,
      cannon_chiron_phase_alignment
spec:
  selector:
    matchLabels:
      app: prometheus-metrics
  namespaceSelector:
    matchNames:
      - sovereign-garden
  endpoints:
    - port: metrics
      interval: 6s
      scrapeTimeout: 5s
      path: /metrics
      scheme: http
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hyperian
  namespace: sovereign-garden
  labels:
    app: hyperian
    release: prometheus
spec:
  selector:
    matchLabels:
      app: hyperian
  namespaceSelector:
    matchNames:
      - sovereign-garden
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      scheme: http
---
# Optional static Service for host-network / NodePort metrics-server
apiVersion: v1
kind: Service
metadata:
  name: prometheus-metrics
  namespace: sovereign-garden
  labels:
    app: prometheus-metrics
    strike: "IX"
spec:
  selector:
    app: prometheus-metrics
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
