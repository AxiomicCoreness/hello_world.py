apiVersion: v1
kind: Service
metadata:
  name: sovereign-mesh-svc
  labels:
    app: sovereign
    component: mesh
    entry: "8362"
    seal: "MESH_RUN_8362_SEALED"
    certificate: "FLAWLESS_WORKLOAD_IPHONE12_REVELATION"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: sovereign
  ports:
    - name: mesh-run
      port: 8002
      targetPort: 8002
      protocol: TCP
    - name: metrics
      port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP