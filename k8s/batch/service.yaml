apiVersion: v1
kind: Service
metadata:
  name: sovereign-batch-svc
  labels:
    app: sovereign
    component: batch-processor
    entry: "8362"
    seal: "BATCH_SERVICE_8362_SEALED"
    certificate: "FLAWLESS_WORKLOAD_IPHONE12_REVELATION"
spec:
  selector:
    app: sovereign
    component: batch-processor
  ports:
    - name: batch-api
      port: 8003
      targetPort: 8003
      protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP