name: Sovereign IRC Bridge Deploy

# Path-filtered; does not alter dual-gate pytest collection.
# Empty secrets.KUBECONFIG → skip green (CD skip pattern).

on:
  push:
    branches: [main]
    paths:
      - "sovereign-irc-bridge/**"
      - ".github/workflows/sovereign-irc-bridge-deploy.yml"
      - "games/teavm-rhythm/src/main/webapp/debug-oracle/**"
  pull_request:
    branches: [main]
    paths:
      - "sovereign-irc-bridge/**"
      - ".github/workflows/sovereign-irc-bridge-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sovereign-irc-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-settings:
    name: Validate bridge package layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge deps
        run: |
          python -m pip install -q -e "./sovereign-irc-bridge"
      - name: Import settings (no certs required)
        run: |
          cd sovereign-irc-bridge
          python - <<'PY'
          import os
          from pathlib import Path
          # Ensure no ghost-pass: strip any inherited IRC__MTLS_* 
          for k in list(os.environ):
              if k.startswith("IRC__MTLS_") or k.startswith("IRC_MTLS_"):
                  del os.environ[k]
          from pydantic import ValidationError
          from src.models import settings as settings_mod
          settings_mod.reset_settings()
          try:
              settings_mod.get_settings()
              raise SystemExit("expected ValidationError without IRC__MTLS_*")
          except ValidationError as e:
              print("ValidationError fail-fast ok:", e.error_count(), "errors")
          # With temp PEMs, config loads
          import tempfile
          td = Path(tempfile.mkdtemp())
          for name in ("client.crt", "client.key", "ca.crt"):
              (td / name).write_text("-----BEGIN PLACEHOLDER-----\n")
          os.environ["IRC__MTLS_CERT_PATH"] = str(td / "client.crt")
          os.environ["IRC__MTLS_KEY_PATH"] = str(td / "client.key")
          os.environ["IRC__MTLS_CA_PATH"] = str(td / "ca.crt")
          settings_mod.reset_settings()
          s = settings_mod.get_settings()
          assert s.irc.host == "irc.abjects.net"
          assert s.bridge.max_buffer_size == 65536
          print("settings ok with cert paths")
          PY

  deploy:
    name: Build / push / apply (KUBECONFIG gated)
    runs-on: ubuntu-latest
    needs: lint-settings
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Gate on KUBECONFIG
        id: kube
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG:-}" ]; then
            echo "KUBECONFIG not set — deploy skipped (green)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set up JDK 17 (optional TeaVM note only)
        if: steps.kube.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: TeaVM client is debug-oracle (no duplicate compile)
        if: steps.kube.outputs.skip != 'true'
        run: |
          test -f games/teavm-rhythm/src/main/webapp/debug-oracle/index.html
          echo "TeaVM surface = debug-oracle (wired; no teavm-client/mvn in this job)"

      - name: Build Docker image
        if: steps.kube.outputs.skip != 'true'
        run: |
          docker build -f sovereign-irc-bridge/Dockerfile \
            -t ghcr.io/axiomiccoreness/irc-bridge:${{ github.sha }} .

      - name: Push to GHCR
        if: steps.kube.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/axiomiccoreness/irc-bridge:${{ github.sha }}
          docker tag ghcr.io/axiomiccoreness/irc-bridge:${{ github.sha }} ghcr.io/axiomiccoreness/irc-bridge:latest
          docker push ghcr.io/axiomiccoreness/irc-bridge:latest

      - name: Apply K8s manifests
        if: steps.kube.outputs.skip != 'true'
        run: |
          kubectl apply -f sovereign-irc-bridge/deploy/k8s/
          kubectl rollout status deployment/irc-bridge -n garden --timeout=180s

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sovereign IRC Bridge Deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| host | irc.abjects.net |"
            echo "| KUBECONFIG gate | empty → skip green |"
            echo "| TeaVM | games/teavm-rhythm/.../debug-oracle |"
            echo "| skip | ${{ steps.kube.outputs.skip }} |"
          } >> "$GITHUB_STEP_SUMMARY"
