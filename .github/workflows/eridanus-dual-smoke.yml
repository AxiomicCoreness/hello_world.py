name: Eridanus Dual smoke (8226)

# Read-only smoke test for the Eridanus Dual engine.
# Compiles, unit-tests, and runs the demo — no ledger entry is written.
# hash_algo: sha3_256 (FIPS 202) — declared for header consistency
# ledger_policy: NO_GROWTH — smoke lane only, no commit
# canvas: agentic-tilelang-eridanus-dual
# note: the ledger-sealing variant (entry 8226) lives in
#       .github/workflows/eridanus-dual-smoke-seal.yml — this file is the
#       read-only variant used for PR validation.

on:
  push:
    paths:
      - "canvases/agentic-tilelang-eridanus-dual/**"
      - "tests/test_eridanus_dual.py"
      - ".github/workflows/eridanus-dual-smoke.yml"
  pull_request:
    paths:
      - "canvases/agentic-tilelang-eridanus-dual/**"
      - "tests/test_eridanus_dual.py"
      - ".github/workflows/eridanus-dual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read   # read-only by design — no ledger writes in this workflow

concurrency:
  group: eridanus-dual-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_ALGO: sha3_256
  CANVAS_DIR: canvases/agentic-tilelang-eridanus-dual
  ENGINE: canvases/agentic-tilelang-eridanus-dual/eridanus_dual.py
  TEST: tests/test_eridanus_dual.py

jobs:
  smoke:
    name: Eridanus Dual · Compile · Test · Demo
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ────────────────────────────────────────────────────────────
      # 1. Compile engine (soft-skip if canvas absent)
      # ────────────────────────────────────────────────────────────
      - name: Compile engine
        run: |
          set -euo pipefail
          if [ ! -f "${ENGINE}" ]; then
            echo "⚠️ ${ENGINE} not found — soft-skip"
            exit 0
          fi
          python -m py_compile "${ENGINE}"
          echo "✅ compiled ${ENGINE}"

      # ────────────────────────────────────────────────────────────
      # 2. Unit smoke (soft-skip if test absent)
      # ────────────────────────────────────────────────────────────
      - name: Unit smoke
        run: |
          set -euo pipefail
          if [ ! -f "${TEST}" ]; then
            echo "⚠️ ${TEST} not found — soft-skip"
            exit 0
          fi
          python "${TEST}"
          echo "✅ unit smoke passed"

      # ────────────────────────────────────────────────────────────
      # 3. Demo (soft-skip if engine absent)
      # ────────────────────────────────────────────────────────────
      - name: Demo
        run: |
          set -euo pipefail
          if [ ! -f "${ENGINE}" ]; then
            echo "⚠️ ${ENGINE} not found — soft-skip"
            exit 0
          fi
          python "${ENGINE}"
          echo "✅ demo ran"

      # ────────────────────────────────────────────────────────────
      # 4. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "✅ Eridanus Dual smoke completed."
            echo "🔐 hash_algo: ${HASH_ALGO}"
            echo "🎨 canvas: agentic-tilelang-eridanus-dual"
            echo "🧪 steps: compile · unit smoke · demo"
            echo "📄 ledger_policy: NO_GROWTH — no ledger entry written"
          } >> "$GITHUB_STEP_SUMMARY"
