name: Symplectic Status Generation

on:
  push:
    paths:
      - "symplectic_status.py"
      - "schemas/symplectic-status.json"
      - "lattice/**"
      - "celestial/**"
      - "frb_bridge*"
      - "monitoring/sovereign_workload_exporter.py"
      - "quantum/port_380_*.py"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  generate-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Check if symplectic_status.py exists
        id: check_script
        run: |
          if [ -f symplectic_status.py ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ symplectic_status.py not found – skipping generation"
          fi

      - name: Run symplectic status generator
        if: steps.check_script.outputs.exists == 'true'
        run: python symplectic_status.py

      - name: Validate aggregate JSON (non‑blocking)
        if: steps.check_script.outputs.exists == 'true'
        run: |
          if [ -f symplectic_status.json ] && [ -f schemas/symplectic-status.json ]; then
            python -m jsonschema -i symplectic_status.json schemas/symplectic-status.json || \
              echo "⚠️ Validation failed – schema may be incomplete; continuing"
          else
            echo "⚠️ symplectic_status.json or schema missing – skipping validation"
          fi

      - name: Show agent JSONL head (if exists)
        if: steps.check_script.outputs.exists == 'true'
        run: |
          if [ -f symplectic_status.agent.jsonl ]; then
            head -n 5 symplectic_status.agent.jsonl
          else
            echo "⚠️ symplectic_status.agent.jsonl not found"
          fi

      - name: Deploy Port 380 Scaling Gate to Kubernetes (if script exists)
        if: steps.check_script.outputs.exists == 'true' && success()
        run: |
          if [ -f quantum/install_k8s.sh ]; then
            chmod +x quantum/install_k8s.sh
            ./quantum/install_k8s.sh
          else
            echo "⚠️ quantum/install_k8s.sh not found – skipping deployment"
          fi

      - name: Commit artifacts if changed
        if: steps.check_script.outputs.exists == 'true' && success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update symplectic status and Merkle leaves"
          file_pattern: |
            symplectic_status.json
            symplectic_status.agent.jsonl
            credit_ledger.json
            HASH_MANIFEST.json
            ledger/*.yaml
          skip_check: true  # Prevents failure when no changes are present
