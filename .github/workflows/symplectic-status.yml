name: Symplectic Status Generation

on:
  push:
    paths:
      - "symplectic_status.py"
      - "schemas/symplectic-status.json"
      - "lattice/**"
      - "celestial/**"
      - "frb_bridge*"
      - "monitoring/sovereign_workload_exporter.py"
      - "quantum/port_380_*.py"
      - "scripts/hash_artifact.py"
      - "scripts/seal_symplectic_8984.py"
      - ".github/workflows/symplectic-status-generation.yml"   # FIX 5: match file name
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: symplectic-status-generation
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  STATUS_ENTRY: "8984"

jobs:
  generate-status:
    name: Symplectic · generate · validate · seal (Entry 8984)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # FIX 3
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet jsonschema pyyaml

      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" "${entries[@]}"
          else
            echo "no verify_ledger.py — soft skip"
          fi

      - name: Check if symplectic_status.py exists
        id: check_script
        run: |
          set -euo pipefail
          if [ -f symplectic_status.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ symplectic_status.py present"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "symplectic_status.py not found — soft skip generation"
          fi

      - name: Run symplectic status generator
        id: generate
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          python symplectic_status.py

          if [ ! -f scripts/hash_artifact.py ]; then
            echo "⚠️ scripts/hash_artifact.py absent — soft skip hashing"   # FIX 4
            exit 0
          fi

          for artifact in symplectic_status.json symplectic_status.agent.jsonl; do
            if [ -f "$artifact" ]; then
              H=$(python scripts/hash_artifact.py "$artifact")
              KEY=$(echo "$artifact" | tr '.' '_')
              echo "${KEY}_sha3_256=${H}" >> "$GITHUB_OUTPUT"
              echo "   $artifact sha3_256=${H:0:16}..."
            fi
          done

      - name: Validate aggregate JSON against schema (non-blocking)
        id: schema
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          VAL=$(python - <<'PY'
          import json, sys
          from pathlib import Path
          try:
              import jsonschema
          except ImportError as e:
              print("⚠️ jsonschema not installed — soft skip", file=sys.stderr)
              print("false")
              sys.exit(0)

          inst = Path("symplectic_status.json")
          schema = Path("schemas/symplectic-status.json")
          if not inst.exists() or not schema.exists():
              print("⚠️ instance or schema missing — soft skip", file=sys.stderr)
              print("false")
              sys.exit(0)

          try:
              jsonschema.validate(
                  json.loads(inst.read_text()),
                  json.loads(schema.read_text()),
              )
              print("true")
          except jsonschema.ValidationError as e:
              print(f"⚠️ validation failed: {e.message} — non-blocking", file=sys.stderr)
              print("false")
          except jsonschema.SchemaError as e:
              print(f"⚠️ schema itself invalid: {e.message} — non-blocking", file=sys.stderr)
              print("false")
          PY
          )
          echo "validated=${VAL:-false}" >> "$GITHUB_OUTPUT"
          if [ "$VAL" = "true" ]; then
            echo "✅ symplectic_status.json validated against schema"
          fi

      - name: Show agent JSONL head
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          if [ -f symplectic_status.agent.jsonl ]; then
            echo "── symplectic_status.agent.jsonl (head) ──"
            head -n 5 symplectic_status.agent.jsonl
          else
            echo "symplectic_status.agent.jsonl not found — soft skip"
          fi

      - name: Seal ledger entry 8984 (SHA3-256)
        if: steps.check_script.outputs.exists == 'true' && hashFiles('scripts/seal_symplectic_8984.py') != ''   # FIX 4
        env:
          STATUS_JSON_SHA: ${{ steps.generate.outputs.symplectic_status_json_sha3_256 }}
          AGENT_JSONL_SHA: ${{ steps.generate.outputs.symplectic_status_agent_jsonl_sha3_256 }}
          SCHEMA_VALIDATED: ${{ steps.schema.outputs.validated }}
          # FIX 8: also export the alternate spellings the script may read
          SYMPLECTIC_STATUS_JSON_SHA3_256: ${{ steps.generate.outputs.symplectic_status_json_sha3_256 }}
          SYMPLECTIC_STATUS_AGENT_JSONL_SHA3_256: ${{ steps.generate.outputs.symplectic_status_agent_jsonl_sha3_256 }}
          SYMPLECTIC_STATUS_SCHEMA_VALIDATED: ${{ steps.schema.outputs.validated }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python scripts/seal_symplectic_8984.py

      - name: Verify ledger entry 8984 (SHA3-256)
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8984.yaml
          else
            echo "no verify_ledger.py — soft skip"
          fi

      - name: Deploy Port-380 Scaling Gate (if script exists)   # FIX 7: after seal
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          if [ ! -f quantum/install_k8s.sh ]; then
            echo "quantum/install_k8s.sh not found — soft skip deployment"
            exit 0
          fi
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "⚠️ kubectl absent — soft skip Port-380 deployment"
            exit 0
          fi
          timeout 120 bash quantum/install_k8s.sh \
            || echo "install_k8s.sh returned non-zero or timed out (soft)"

      - name: Commit artifacts if changed
        if: steps.check_script.outputs.exists == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update symplectic status + Merkle leaves + seal 8984"
          file_pattern: |
            symplectic_status.json
            symplectic_status.agent.jsonl
            ledger/8984.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_options: '--no-verify'

      - name: Summary
        if: always()
        env:
          EXISTS: ${{ steps.check_script.outputs.exists }}
          SCHEMA_VALIDATED: ${{ steps.schema.outputs.validated }}
        run: |
          EXISTS="${EXISTS:-false}"
          SCHEMA_VALIDATED="${SCHEMA_VALIDATED:-false}"
          {
            echo "### Symplectic Status Generation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry | ${STATUS_ENTRY} |"
            echo "| generator present | ${EXISTS} |"
            echo "| schema validated | ${SCHEMA_VALIDATED} (non-blocking) |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| witness | 8983 → 8984 — UNBROKEN |"
            echo ""
            if [ "$EXISTS" = "true" ]; then
              echo "**Quantum/cybernetic frame:**"
              echo "- Symplectic form ω preserved across the sampling channel"
              echo "- Merkle leaves are the observation basis; aggregate JSON is the collapse"
              echo "- \`Φ_abs\` collapse recorded at entry 8984"
            else
              echo "**Generator absent — no observation, no collapse.**"
              echo "- \`symplectic_status.py\` not present; entry 8984 was not written."
              echo "- Chain remains at 8983 — UNBROKEN."
            fi
            echo ""
            echo "🜁∀ — Seal: ∀∞φ² · SYMPLECTIC_STATUS_8984 · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
