name: Symplectic Status Generation

# Observes the symplectic state, generates status artifacts, deploys the
# Port-380 scaling gate, and seals entry 8984 binding both artifact hashes.
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_SEAL — entry 8984 only (+ catch-all for external ledger changes)
# witness: 8983 → 8984 — UNBROKEN
#
# ─────────────────────────────────────────────────────────────────
# CORRECTION NOTES — this pass
# ─────────────────────────────────────────────────────────────────
# FIX A. actions/checkout@v5 → @v4
#   v5 is not a released major. The runner cannot resolve it; the job
#   would fail at checkout before any step ran. Current stable is v4.
#
# FIX B. actions/setup-python@v6 → @v5
#   v6 is not a released major. Current stable is v5.
#
# Retained from prior correction pass:
#   - id: generate on the generator step; seal reads steps.generate.outputs.*
#   - hash/seal bodies extracted to scripts/hash_artifact.py and
#     scripts/seal_symplectic_8984.py (no inline heredoc)
#   - summary asserts Φ_abs only when EXISTS=true
#
# One reconciliation note (not a fix, a flag):
#   on.push.paths names ".github/workflows/symplectic-status.yml" while
#   the file's `name:` header reads "Symplectic Status Generation". If
#   the file on disk is symplectic-status-generation.yml, update the
#   paths entry to match. Otherwise no action.
# ─────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - "symplectic_status.py"
      - "schemas/symplectic-status.json"
      - "lattice/**"
      - "celestial/**"
      - "frb_bridge*"
      - "monitoring/sovereign_workload_exporter.py"
      - "quantum/port_380_*.py"
      - "scripts/hash_artifact.py"
      - "scripts/seal_symplectic_8984.py"
      - ".github/workflows/symplectic-status.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write   # required for the auto-commit of status artifacts + ledger
  id-token: write

concurrency:
  group: symplectic-status-generation
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  STATUS_ENTRY: "8984"

jobs:
  generate-status:
    name: Symplectic · generate · validate · seal (Entry 8984)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4          # FIX A: was @v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5       # FIX B: was @v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet jsonschema pyyaml

      # ────────────────────────────────────────────────────────────
      # 0. SHA3-256 integrity gate (read-only)
      # ────────────────────────────────────────────────────────────
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" "${entries[@]}"
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 1. Detect generator presence
      # ────────────────────────────────────────────────────────────
      - name: Check if symplectic_status.py exists
        id: check_script
        run: |
          set -euo pipefail
          if [ -f symplectic_status.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ symplectic_status.py present"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "symplectic_status.py not found — soft skip generation"
          fi

      # ────────────────────────────────────────────────────────────
      # 2. Run the symplectic status generator
      # ────────────────────────────────────────────────────────────
      - name: Run symplectic status generator
        id: generate
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          python symplectic_status.py

          for artifact in symplectic_status.json symplectic_status.agent.jsonl; do
            if [ -f "$artifact" ]; then
              H=$(python scripts/hash_artifact.py "$artifact")
              KEY=$(echo "$artifact" | tr '.' '_')
              echo "${KEY}_sha3_256=${H}" >> "$GITHUB_OUTPUT"
              echo "   $artifact sha3_256=${H:0:16}..."
            fi
          done

      # ────────────────────────────────────────────────────────────
      # 3. Validate aggregate JSON against schema (non-blocking)
      # ────────────────────────────────────────────────────────────
      - name: Validate aggregate JSON against schema (non-blocking)
        id: schema
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          echo "validated=false" >> "$GITHUB_OUTPUT"

          if [ ! -f symplectic_status.json ]; then
            echo "symplectic_status.json absent — soft skip validation"
            exit 0
          fi
          if [ ! -f schemas/symplectic-status.json ]; then
            echo "schemas/symplectic-status.json absent — soft skip validation"
            exit 0
          fi

          if python -m jsonschema -i symplectic_status.json schemas/symplectic-status.json; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
            echo "✅ symplectic_status.json validated against schema"
          else
            echo "schema validation failed — schema may be incomplete; continuing (non-blocking)"
          fi

      # ────────────────────────────────────────────────────────────
      # 4. Show agent JSONL head
      # ────────────────────────────────────────────────────────────
      - name: Show agent JSONL head
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          if [ -f symplectic_status.agent.jsonl ]; then
            echo "── symplectic_status.agent.jsonl (head) ──"
            head -n 5 symplectic_status.agent.jsonl
          else
            echo "symplectic_status.agent.jsonl not found — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 5. Deploy Port-380 scaling gate (if script exists)
      # ────────────────────────────────────────────────────────────
      - name: Deploy Port-380 Scaling Gate (if script exists)
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          if [ -f quantum/install_k8s.sh ]; then
            chmod +x quantum/install_k8s.sh
            ./quantum/install_k8s.sh || echo "install_k8s.sh returned non-zero (soft)"
          else
            echo "quantum/install_k8s.sh not found — soft skip deployment"
          fi

      # ────────────────────────────────────────────────────────────
      # 6. Φ_abs — seal ledger entry 8984 (SHA3-256)
      # ────────────────────────────────────────────────────────────
      - name: Seal ledger entry 8984 (SHA3-256)
        if: steps.check_script.outputs.exists == 'true'
        env:
          STATUS_JSON_SHA: ${{ steps.generate.outputs.symplectic_status_json_sha3_256 }}
          AGENT_JSONL_SHA: ${{ steps.generate.outputs.symplectic_status_agent_jsonl_sha3_256 }}
          SCHEMA_VALIDATED: ${{ steps.schema.outputs.validated }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python scripts/seal_symplectic_8984.py

      - name: Verify ledger entry 8984 (SHA3-256)
        if: steps.check_script.outputs.exists == 'true'
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8984.yaml
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 7. Commit artifacts if changed
      # ────────────────────────────────────────────────────────────
      - name: Commit artifacts if changed
        if: steps.check_script.outputs.exists == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update symplectic status + Merkle leaves + seal 8984"
          file_pattern: |
            symplectic_status.json
            symplectic_status.agent.jsonl
            credit_ledger.json
            HASH_MANIFEST.json
            ledger/8984.yaml
          commit_options: '--no-verify'

      # ────────────────────────────────────────────────────────────
      # 8. Summary — Φ_abs only when generator actually ran
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          EXISTS: ${{ steps.check_script.outputs.exists }}
          SCHEMA_VALIDATED: ${{ steps.schema.outputs.validated }}
        run: |
          EXISTS="${EXISTS:-false}"
          SCHEMA_VALIDATED="${SCHEMA_VALIDATED:-false}"
          {
            echo "### Symplectic Status Generation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry | ${STATUS_ENTRY} |"
            echo "| generator present | ${EXISTS} |"
            echo "| schema validated | ${SCHEMA_VALIDATED} (non-blocking) |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| witness | 8983 → 8984 — UNBROKEN |"
            echo ""
            if [ "$EXISTS" = "true" ]; then
              echo "**Quantum/cybernetic frame:**"
              echo "- Symplectic form ω preserved across the sampling channel"
              echo "- Merkle leaves are the observation basis; aggregate JSON is the collapse"
              echo "- \`Φ_abs\` collapse recorded at entry 8984"
            else
              echo "**Generator absent — no observation, no collapse.**"
              echo "- \`symplectic_status.py\` not present; entry 8984 was not written."
              echo "- Chain remains at 8983 — UNBROKEN."
            fi
            echo ""
            echo "🜁∀ — Seal: ∀∞φ² · SYMPLECTIC_STATUS_8984 · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
