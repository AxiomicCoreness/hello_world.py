name: Self Improvement Relay (Octonian CDP + QCH)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: self-improvement-relay
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  RELAY_ENTRY: "8777"
  PREDECESSOR_ENTRY: "8776"
  # MCP_URL and GARDEN_SECRET must NOT be here — secrets context
  # is unavailable at workflow-level env.

jobs:
  relay:
    name: Relay · QCH · CDP · Octonian · heartbeat tick (slot 8777)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Export secrets to GITHUB_ENV
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
        run: |
          {
            echo "MCP_URL=$MCP_URL"
            echo "GARDEN_SECRET=$GARDEN_SECRET"
          } >> "$GITHUB_ENV"

      - name: Install runtime deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet scipy numpy sympy mpmath cryptography pyyaml requests
          if [ -f requirements.txt ]; then
            python -m pip install --quiet -r requirements.txt \
              || echo "⚠️ requirements.txt install returned non-zero — continuing"
          fi

      # ... steps 0-6 unchanged except where noted ...

      - name: Verify Ed25519 signatures on sealed entries
        # continue-on-error removed
        run: |
          python - <<'PY'
          # ... real verification, or exit 0 with NOT_CHECKED ...
          PY

      - name: Append heartbeat tick to presence stream (SHA3-256 body_hash)
        if: success()
        env:
          QCH_PASSED: ${{ steps.qch.outputs.qch_passed }}
          CDP_PASSED: ${{ steps.cdp.outputs.cdp_passed }}
        run: |
          set -euo pipefail
          mkdir -p heartbeats
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          stream = Path("heartbeats/self_improvement_relay.jsonl")

          qch = os.environ.get("QCH_PASSED", "unknown")
          cdp = os.environ.get("CDP_PASSED", "unknown")
          status = "SUCCESS" if qch == "true" and cdp == "true" else "DEGRADED"

          hb_index = 0
          if stream.exists():
              hb_index = sum(1 for line in stream.read_text().splitlines() if line.strip())

          body = {
              "hb_index": hb_index,
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "agent_id": "self-improvement-relay",
              "slot": 8777,
              "hash_algo": HASH_ALGO,
              "qch_passed": qch,
              "cdp_passed": cdp,
              "status": status,
              "octonian": "PASSED",
              "fal_probe": "PASSED",
              "security_headers_source": "VERIFIED",
              "security_headers_live": "VERIFIED" if os.environ.get("MCP_URL") else "SKIPPED",
              "ed25519_signatures": "VERIFIED_OR_NOT_CHECKED",
          }
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          tick = dict(body)
          tick["body_hash"] = h
          with stream.open("a") as fh:
              fh.write(json.dumps(tick, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n")
          print(f"📋 heartbeat tick {hb_index} appended to presence stream.")
          print(f"✅ body_hash {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Commit heartbeat stream (no ledger commit per run)
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: append self-improvement-relay heartbeat tick to presence stream (compaction pilot)"
          file_pattern: heartbeats/self_improvement_relay.jsonl
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
