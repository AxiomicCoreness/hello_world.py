name: Prebuild gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Prebuild · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: paper_mcp prebuild
        run: |
          python -I scripts/paper_mcp_prebuild.py --json \
            --known-unparsed scripts/paper_mcp_prebuild_known_unparsed.txt

      - name: cors anywhere prebuild
        run: |
          python -I scripts/cors_anywhere_prebuild.py --json \
            --known-unparsed scripts/cors_anywhere_prebuild_known_unparsed.txt

      - name: cli everything prebuild
        run: |
          python -I scripts/cli_everything_prebuild.py --json \
            --known-unparsed scripts/cli_everything_prebuild_known_unparsed.txt

      - name: Prebuild tests
        run: |
          python -m pytest -q \
            tests/test_paper_mcp_prebuild.py \
            tests/test_cors_anywhere_prebuild.py \
            tests/test_cli_everything_prebuild.py
