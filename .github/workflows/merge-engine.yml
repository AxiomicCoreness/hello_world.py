name: Merge Engine

# Reads merge/manifest.yaml via scripts/merge_engine.py
# Emits .merge/merged_manifest.yaml, merged_report.json, merkle_root.json
# .merge/ is gitignored (per-run scratch). Artifact upload only — not committed.
# ledger_policy: NO_SEALED_REWRITE

on:
  push:
    branches: [main, master]
    paths:
      - "merge/**"
      - "scripts/merge_engine.py"
      - ".github/workflows/merge-engine.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "merge/**"
      - "scripts/merge_engine.py"
      - ".github/workflows/merge-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256

jobs:
  merge:
    name: Merge · emit merged manifest + report
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml

      - name: Probe scripts/merge_engine.py
        id: probe
        run: |
          set -euo pipefail
          if [ -f scripts/merge_engine.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::scripts/merge_engine.py absent — soft-skip merge"
          fi

      - name: Run merge engine
        if: steps.probe.outputs.present == 'true'
        id: engine
        run: |
          set +e
          python scripts/merge_engine.py 2>&1 | tee merge.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "engine_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload .merge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-engine-report
          path: |
            .merge/
            merge.log
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### Merge Engine"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| script present | ${{ steps.probe.outputs.present }} |"
            echo "| engine_rc | ${{ steps.engine.outputs.engine_rc }} |"
            echo "| .merge/ | gitignored — artifact upload only |"
            echo "| policy | NO_SEALED_REWRITE |"
            echo ""
            if [ -f .merge/merkle_root.json ]; then
              echo "```"
              cat .merge/merkle_root.json
              echo "```"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
