name: Ledger Unison

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml pytest
      - name: Rebuild index + chain and fail if committed copies are stale or the chain breaks
        run: |
          set -euo pipefail
          python -I tools/ledger_index.py --root . --check
      - name: Tests (offline, isolated)
        run: |
          set -euo pipefail
          python -I -m pytest -q tests/test_ledger_unison.py -p no:cacheprovider
