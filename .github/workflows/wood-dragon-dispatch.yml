name: wood-dragon-dispatch

on:
  workflow_dispatch:
    inputs:
      event:
        description: "ledger event path"
        required: false
        default: "/workflow_dispatch_wood_dragon_mistral"
      i_of_144:
        description: "i in i/144 (record only; does not fire Gravastar)"
        required: false
        default: "1"

permissions:
  contents: write
  id-token: write

concurrency:
  group: wood-dragon-dispatch
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  DISPATCH_ENTRY: "9007"
  TERMINAL_CI: "1"
  WOOD_DRAGON_CI: "1"
  OAUTH_OFFLINE: "1"
  # ── STACK-CI FIX ──────────────────────────────────────────────
  # MCP_PORT / MCP_BIND_HOST / MCP_NAMESPACE / MCP_LEGACY_404_HARD
  # are declared here so the MCP pulse step and any dispatcher that
  # shells out to mcp/port380_mcp.py see the same contract that
  # sovereign-stack-ci.yml asserts. Without these, the dispatcher
  # falls back to module defaults and the terminal hash diverges
  # from the stack CI's recorded value.
  MCP_PORT: "13800"
  MCP_BIND_HOST: "127.0.0.1"
  MCP_NAMESPACE: "wood-dragon-dispatch"
  MCP_LEGACY_404_HARD: "0"

jobs:
  hash-and-dispatch:
    name: Wood Dragon dispatch · hash · terminals · seal (Entry 9007)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Export dispatch context
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          I_OF_144: ${{ inputs.i_of_144 }}
        run: |
          set -euo pipefail
          {
            echo "MCP_CONNECTOR_URL=$MCP_URL"
            echo "GARDEN_SECRET=$GARDEN_SECRET"
            echo "MISTRAL_API_KEY=$MISTRAL_API_KEY"
            echo "GRAVASTAR_I_OF_144=${I_OF_144:-1}"
          } >> "$GITHUB_ENV"

      - name: Install hash/yaml deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography
          # ── STACK-CI FIX ────────────────────────────────────────
          # The stack CI installs fastapi/uvicorn/pydantic for the
          # app and mcp smoke jobs. The dispatcher imports the MCP
          # module indirectly when MCP_CONNECTOR_URL is set, so those
          # pins must match. Keep the same versions the stack CI uses
          # to avoid "works in stack CI, fails in dispatch" drift.
          python -m pip install --quiet \
            fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2

      # ── PRIOR FIX ──────────────────────────────────────────────
      # Multi-file verify_ledger.py invocation replaced with a
      # per-file loop. The previous form passed every ledger/*.yaml
      # as a positional argument to a script that only accepts one
      # path, producing an argparse error on any repo with more than
      # one ledger entry. The loop also tolerates per-file failures
      # without aborting the whole step, matching the "soft" intent.
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            for f in "${entries[@]}"; do
              python "$VERIFIER" "$f" || echo "⚠️ soft: $f"
            done
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ── PRIOR FIX ──────────────────────────────────────────────
      # `sort` without LC_ALL=C is locale-dependent; the resulting
      # branch list — and therefore terminals_sha3_256 — differed
      # between runners. Pin the collation so the terminal hash is
      # reproducible across ubuntu-latest images.
      - name: Enumerate branch terminals
        id: terminals
        run: |
          set -euo pipefail

          if git ls-remote --heads origin >/dev/null 2>&1; then
            BRANCHES=$(git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#^refs/heads/##' \
              | LC_ALL=C sort)
          else
            BRANCHES=$(git branch -a --format='%(refname:short)' \
              | sed 's#^origin/##' \
              | LC_ALL=C sort -u)
          fi

          COUNT=$(printf '%s\n' "$BRANCHES" | grep -c . || echo 0)

          printf '%s\n' "$BRANCHES" | python -c "
          import json, sys
          branches = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps(branches))
          " > /tmp/terminals.json

          echo "terminal_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "last_observed_count=26" >> "$GITHUB_OUTPUT"

          echo "── branch terminals (count=${COUNT}) ──"
          printf '%s\n' "$BRANCHES" | head -50
          echo "──────────────────────────────────────"

      # ── STACK-CI FIX ───────────────────────────────────────────
      # Sanity check that the MCP contract is readable from this
      # workflow's environment. The stack CI's mcp job asserts the
      # same 7-key contract; reproducing the assertion here means
      # a drift in either direction (this file loosening the env,
      # or mcp/port380_mcp.py changing its key names) fails fast
      # rather than silently producing a different pulse body.
      - name: MCP check-config contract (parity with stack CI)
        id: mcp_contract
        run: |
          set -euo pipefail
          if [ ! -f mcp/port380_mcp.py ]; then
            echo "mcp/port380_mcp.py absent — soft skip contract check"
            echo "contract_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plan=$(python mcp/port380_mcp.py --check-config)
          echo "$plan" | tee mcp_plan.json
          echo "$plan" | python - <<'PY'
          import json, sys, os
          d = json.load(sys.stdin)
          for k in ("MCP_BIND_HOST", "MCP_PORT", "MCP_NAMESPACE"):
              assert k in os.environ, "{} not set in dispatch env".format(k)
          required = {
              "host", "bind_host", "port", "namespace",
              "surface", "legacy_out_of_surface", "url",
          }
          missing = required - d.keys()
          assert not missing, "missing keys: {}".format(missing)
          assert d["host"] == os.environ["MCP_BIND_HOST"], d["host"]
          assert d["port"] == int(os.environ["MCP_PORT"]), d["port"]
          assert d["namespace"] == os.environ["MCP_NAMESPACE"], d["namespace"]
          assert d["bind_host"] == d["host"], "bind_host/host drift"
          assert d["surface"] == ["/healthz"], d["surface"]
          assert set(d["legacy_out_of_surface"]) == {"/health", "/pulse"}
          expected_url = "http://{}:{}{}".format(
              d["host"], d["port"], d["surface"][0]
          )
          assert d["url"] == expected_url, d["url"]
          assert isinstance(d["port"], int)
          print("check-config contract OK")
          PY
          echo "contract_ok=true" >> "$GITHUB_OUTPUT"

      - name: Event hash 9007
        env:
          EVENT_PATH: ${{ inputs.event }}
        run: |
          set -euo pipefail
          if [ ! -f ledger/event_hash.py ]; then
            echo "⚠️ ledger/event_hash.py not present — soft skip"
            exit 0
          fi
          [ -f ledger/__init__.py ] || touch ledger/__init__.py
          python -m ledger.event_hash 9007 "${EVENT_PATH}"

      - name: Wood Dragon dispatch_main
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ ! -d quantum/wood_dragon_dispatch ]; then
            echo "quantum/wood_dragon_dispatch absent — soft skip dispatcher"
            exit 0
          fi
          python -m quantum.wood_dragon_dispatch \
            --terminals /tmp/terminals.json \
            --event "${{ inputs.event }}" \
            || echo "wood_dragon_dispatch returned non-zero (soft)"

      - name: MCP pulse (if MCP_URL set)
        if: ${{ secrets.MCP_URL != '' }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi

          HDR_ARGS=(-H "Content-Type: application/json")
          if [ -n "${GARDEN_SECRET:-}" ]; then
            HDR_ARGS+=(-H "X-Garden-Secret: ${GARDEN_SECRET}")
          fi

          # ── STACK-CI FIX ──────────────────────────────────────
          # Include the MCP contract fields in the pulse body so
          # the receiving endpoint can correlate the dispatch with
          # the stack CI's recorded contract. Without this, the
          # pulse has no way to detect that the dispatcher ran under
          # a different MCP_* environment than the one it tested.
          BODY=$(jq -n \
            --arg src "wood-dragon-dispatch" \
            --argjson entry 9007 \
            --arg evt "${{ inputs.event }}" \
            --argjson n "${{ steps.terminals.outputs.terminal_count }}" \
            --arg mcp_host "${MCP_BIND_HOST}" \
            --argjson mcp_port "${MCP_PORT}" \
            --arg mcp_ns "${MCP_NAMESPACE}" \
            '{
              source: $src,
              entry: $entry,
              event: $evt,
              terminal_count: $n,
              mcp: {
                host: $mcp_host,
                port: $mcp_port,
                namespace: $mcp_ns
              },
              note: "each branch is a terminal"
            }')

          curl -sS --max-time 20 -X POST "${HDR_ARGS[@]}" -d "$BODY" \
            "${MCP_CONNECTOR_URL%/}/pulse" \
            || echo "MCP pulse failed (non-fatal)"

      - name: Seal ledger entry 9007 (SHA3-256)
        if: success()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
          MCP_CONTRACT_OK: ${{ steps.mcp_contract.outputs.contract_ok }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"

          TERMINALS_JSON=$(cat /tmp/terminals.json 2>/dev/null || echo "[]")
          export TERMINALS_JSON
          export TERMINAL_COUNT LAST_OBSERVED EVENT_PATH I_OF_144 MCP_CONTRACT_OK

          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          n = int(os.environ.get("DISPATCH_ENTRY", "9007"))
          path = Path(f"ledger/{n}.yaml")

          terminals_raw = os.environ.get("TERMINALS_JSON", "[]")
          try:
              terminals = json.loads(terminals_raw)
          except json.JSONDecodeError:
              terminals = []
          if not isinstance(terminals, list):
              terminals = []

          terminals_canon = json.dumps(terminals, sort_keys=True,
                                       separators=(",", ":"))
          terminals_sha = hashlib.new(
              HASH_ALGO, terminals_canon.encode("utf-8")
          ).hexdigest()

          prev_path = Path("ledger/9006.yaml")
          prev_hash = ""
          if prev_path.exists():
              try:
                  prev = yaml.safe_load(prev_path.read_text(encoding="utf-8")) or {}
                  seal = prev.get("seal", "") or ""
                  if "·" in seal:
                      prev_hash = seal.rsplit("·", 1)[-1].strip()
              except Exception as e:
                  print(f"⚠️ could not read predecessor: {e}")

          mcp_set = bool(os.environ.get("MCP_CONNECTOR_URL"))
          mcp_ok = os.environ.get("MCP_CONTRACT_OK", "false") == "true"

          # ── STACK-CI FIX ──────────────────────────────────────
          # Record the MCP contract details in the ledger entry.
          # This makes the dispatch entry auditable against the
          # stack CI's mcp job: if the two ever diverge, the
          # ledger shows which environment produced the seal.
          entry = {
              "entry_index": n,
              "event": os.environ.get("EVENT_PATH", "/workflow_dispatch_wood_dragon_mistral"),
              "status": "SUCCESS" if mcp_ok or not mcp_set else "DEGRADED",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "observation_channel": "wood_dragon_dispatch",
              "dispatcher": "quantum.wood_dragon_dispatch",
              "terminal_count": int(os.environ.get("TERMINAL_COUNT", "0")),
              "last_observed_count": int(os.environ.get("LAST_OBSERVED", "26")),
              "terminals_sha3_256": terminals_sha,
              "i_of_144": os.environ.get("I_OF_144", "1"),
              "grava_star_fired": False,
              "mcp_pulse": "sent" if mcp_set else "skipped",
              "mcp_contract_ok": mcp_ok,
              "mcp_port": os.environ.get("MCP_PORT", "13800"),
              "mcp_namespace": os.environ.get("MCP_NAMESPACE", "wood-dragon-dispatch"),
              "prev_hash": prev_hash,
              "witness": "9006 → 9007 — UNBROKEN",
              "seal": "∀∞φ² · WOOD_DRAGON_DISPATCH_9007 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print(f"📋 Ledger entry {n} written.")
          print(f"✅ Sealed {n} · {HASH_ALGO}:{h[:16]}...")
          print(f"   terminal_count         = {entry['terminal_count']}")
          print(f"   last_observed_count    = {entry['last_observed_count']}")
          print(f"   terminals_sha3_256     = {terminals_sha[:16]}...")
          print(f"   prev_hash              = {prev_hash[:16] or '(none)'}")
          print(f"   i_of_144               = {entry['i_of_144']} (record only)")
          print(f"   grava_star_fired       = False")
          print(f"   mcp_contract_ok        = {mcp_ok}")
          PY

      - name: Verify ledger entry 9007 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/9007.yaml
          else
            echo "no verify_ledger.py — soft skip"
          fi

      - name: Upload dispatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wood-dragon-dispatch-artifacts
          path: |
            /tmp/terminals.json
            mcp_plan.json
            ledger/9007.yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Commit ledger entry 9007
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal wood-dragon-dispatch entry 9007 (sha3_256)"
          file_pattern: ledger/9007.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_options: '--no-verify'

      - name: Summary
        if: always()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
          MCP_CONTRACT_OK: ${{ steps.mcp_contract.outputs.contract_ok }}
        run: |
          {
            echo "### Wood Dragon Dispatch"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry | ${DISPATCH_ENTRY} |"
            echo "| event | ${EVENT_PATH} |"
            echo "| terminal_count | ${TERMINAL_COUNT:-0} |"
            echo "| last_observed_count | ${LAST_OBSERVED:-26} |"
            echo "| i_of_144 | ${I_OF_144:-1} (record only) |"
            echo "| grava_star_fired | False |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| mcp_contract_ok | ${MCP_CONTRACT_OK:-false} |"
            echo "| mcp_port | ${MCP_PORT} |"
            echo "| mcp_namespace | ${MCP_NAMESPACE} |"
            echo "| witness | 9006 → 9007 — UNBROKEN |"
            echo ""
            echo "**Quantum/cybernetic frame:**"
            echo "- Each branch is a terminal T_k in the dispatch mesh"
            echo "- \`U_dispatch\` routes one event per dispatch"
            echo "- \`Φ_abs(ρ)\` — collapse recorded at entry 9007"
            echo "- \`𝒜_n ⊆ 𝒜_{n+1}\` — entry 9007 extends the 90xx region"
            echo ""
            echo "**Stack-CI parity:**"
            echo "- MCP_* env matches \`sovereign-stack-ci.yml\` mcp job"
            echo "- 7-key check-config contract asserted in this workflow"
            echo "- ledger records \`mcp_contract_ok\` for audit"
            echo ""
            echo "🜁∀ — Seal: ∀∞φ² · WOOD_DRAGON_DISPATCH_9007 · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
