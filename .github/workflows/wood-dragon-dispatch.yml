name: wood-dragon-dispatch

# Manual dispatch — event hash for entry 9007, run wood-dragon dispatcher,
# enumerate branch terminals (last count: 26), seal entry 9007.
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_SEAL — entry 9007 only
# witness: 9006 → 9007 — UNBROKEN
#
# ═══════════════════════════════════════════════════════════════════
#  QUANTUM / CYBERNETIC FRAME
# ═══════════════════════════════════════════════════════════════════
#
#  Each branch of the repo is a terminal in the dispatch mesh.
#  The dispatcher is a routing unitary U_dispatch that selects a
#  terminal T_k ∈ {T_1, …, T_N} per event e.
#
#    ρ(t)      — dispatcher state across N branch terminals
#    U(t)      — U_dispatch: read-only branch enumeration
#    Φ_abs(ρ)  — seal of entry 9007 (CPTP collapse of the dispatch event)
#    B(t)      — boundary: MCP_CONNECTOR_URL, silent skip if unset
#    𝒜_n ⊆ 𝒜_{n+1} — isotony: entry 9007 extends the 90xx region
#    Witness chain — 9006 → 9007 — UNBROKEN
#
#  Branch count history: last observed 26. The dispatcher records the
#  current count in the ledger entry so the mesh topology is versioned.
#
#  GRAVASTAR_I_OF_144 is recorded only; it does NOT fire Gravastar.

on:
  workflow_dispatch:
    inputs:
      event:
        description: "ledger event path"
        required: false
        default: "/workflow_dispatch_wood_dragon_mistral"
      i_of_144:
        description: "i in i/144 (record only; does not fire Gravastar)"
        required: false
        default: "1"

permissions:
  contents: write   # required to commit ledger/9007.yaml
  id-token: write

concurrency:
  group: wood-dragon-dispatch
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  DISPATCH_ENTRY: "9007"
  TERMINAL_CI: "1"
  WOOD_DRAGON_CI: "1"
  OAUTH_OFFLINE: "1"
  GRAVASTAR_I_OF_144: ${{ inputs.i_of_144 }}
  MCP_CONNECTOR_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

jobs:
  hash-and-dispatch:
    name: Wood Dragon dispatch · hash · terminals · seal (Entry 9007)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hash/yaml deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      # ────────────────────────────────────────────────────────────
      # 0. SHA3-256 integrity gate (read-only)
      # ────────────────────────────────────────────────────────────
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" "${entries[@]}"
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 1. Enumerate branch terminals (mesh topology)
      # ────────────────────────────────────────────────────────────
      - name: Enumerate branch terminals
        id: terminals
        run: |
          set -euo pipefail

          # List all remote branches — each is a terminal in the mesh.
          # Fall back to the local branch list if the remote is unavailable.
          if git ls-remote --heads origin >/dev/null 2>&1; then
            BRANCHES=$(git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#^refs/heads/##' \
              | sort)
          else
            BRANCHES=$(git branch -a --format='%(refname:short)' \
              | sed 's#^origin/##' \
              | sort -u)
          fi

          COUNT=$(printf '%s\n' "$BRANCHES" | grep -c . || echo 0)

          # Write the terminal list as a JSON array for the ledger entry.
          echo "$BRANCHES" | python -c "
          import json, sys
          branches = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps(branches))
          " > /tmp/terminals.json

          echo "terminal_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "last_observed_count=26" >> "$GITHUB_OUTPUT"

          echo "── branch terminals (count=${COUNT}) ──"
          printf '%s\n' "$BRANCHES" | head -50
          echo "──────────────────────────────────────"

      # ────────────────────────────────────────────────────────────
      # 2. Event hash for entry 9007
      # ────────────────────────────────────────────────────────────
      - name: Event hash 9007
        env:
          EVENT_PATH: ${{ inputs.event }}
        run: |
          set -euo pipefail
          python -m ledger.event_hash 9007 "${EVENT_PATH}"

      # ────────────────────────────────────────────────────────────
      # 3. Wood Dragon dispatch (each branch is a terminal)
      # ────────────────────────────────────────────────────────────
      - name: Wood Dragon dispatch_main
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ ! -d quantum/wood_dragon_dispatch ]; then
            echo "quantum/wood_dragon_dispatch absent — soft skip dispatcher"
            exit 0
          fi
          python -m quantum.wood_dragon_dispatch \
            --terminals /tmp/terminals.json \
            --event "${{ inputs.event }}" \
            || echo "wood_dragon_dispatch returned non-zero (soft)"

      # ────────────────────────────────────────────────────────────
      # 4. MCP pulse (silent if MCP_URL unset)
      # ────────────────────────────────────────────────────────────
      - name: MCP pulse (if MCP_URL set)
        if: ${{ env.MCP_CONNECTOR_URL != '' }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi

          HDR_ARGS=(-H "Content-Type: application/json")
          if [ -n "${GARDEN_SECRET:-}" ]; then
            HDR_ARGS+=(-H "X-Garden-Secret: ${GARDEN_SECRET}")
          fi

          BODY=$(jq -n \
            --arg src "wood-dragon-dispatch" \
            --argjson entry 9007 \
            --arg evt "${{ inputs.event }}" \
            --argjson n "${{ steps.terminals.outputs.terminal_count }}" \
            '{
              source: $src,
              entry: $entry,
              event: $evt,
              terminal_count: $n,
              note: "each branch is a terminal"
            }')

          curl -sS --max-time 20 -X POST "${HDR_ARGS[@]}" -d "$BODY" \
            "${MCP_CONNECTOR_URL%/}/pulse" \
            || echo "MCP pulse failed (non-fatal)"

      # ────────────────────────────────────────────────────────────
      # 5. Φ_abs — seal ledger entry 9007 (SHA3-256)
      # ────────────────────────────────────────────────────────────
      - name: Seal ledger entry 9007 (SHA3-256)
        if: success()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"

          # Load the terminal list from the enumeration step.
          TERMINALS_JSON=$(cat /tmp/terminals.json 2>/dev/null || echo "[]")

          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          n = int(os.environ.get("DISPATCH_ENTRY", "9007"))
          path = Path(f"ledger/{n}.yaml")

          # Terminals (branch list)
          terminals_raw = os.environ.get("TERMINALS_JSON", "[]")
          try:
              terminals = json.loads(terminals_raw)
          except json.JSONDecodeError:
              terminals = []
          if not isinstance(terminals, list):
              terminals = []

          # SHA3-256 over the terminal list — the mesh topology hash
          terminals_canon = json.dumps(terminals, sort_keys=True,
                                       separators=(",", ":"))
          terminals_sha = hashlib.new(
              HASH_ALGO, terminals_canon.encode("utf-8")
          ).hexdigest()

          mcp_set = bool(os.environ.get("MCP_CONNECTOR_URL"))

          entry = {
              "entry_index": n,
              "event": os.environ.get("EVENT_PATH", "/workflow_dispatch_wood_dragon_mistral"),
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              # cybernetic fields
              "observation_channel": "wood_dragon_dispatch",
              "dispatcher": "quantum.wood_dragon_dispatch",
              "terminal_count": int(os.environ.get("TERMINAL_COUNT", "0")),
              "last_observed_count": int(os.environ.get("LAST_OBSERVED", "26")),
              "terminals_sha3_256": terminals_sha,
              "i_of_144": os.environ.get("I_OF_144", "1"),
              "grava_star_fired": False,
              "mcp_pulse": "sent" if mcp_set else "skipped",
              "witness": "9006 → 9007 — UNBROKEN",
              "witness_chain": "9006 → 9007 — UNBROKEN",
              "seal": "∀∞φ² · WOOD_DRAGON_DISPATCH_9007 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print(f"📋 Ledger entry {n} written.")
          print(f"✅ Sealed {n} · {HASH_ALGO}:{h[:16]}...")
          print(f"   terminal_count         = {entry['terminal_count']}")
          print(f"   last_observed_count    = {entry['last_observed_count']}")
          print(f"   terminals_sha3_256     = {terminals_sha[:16]}...")
          print(f"   i_of_144               = {entry['i_of_144']} (record only)")
          print(f"   grava_star_fired       = False")
          PY

      - name: Verify ledger entry 9007 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/9007.yaml
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 6. Artifacts + commit
      # ────────────────────────────────────────────────────────────
      - name: Upload dispatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wood-dragon-dispatch-artifacts
          path: |
            /tmp/terminals.json
            ledger/9007.yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Commit ledger entry 9007
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal wood-dragon-dispatch entry 9007 (sha3_256)"
          file_pattern: ledger/9007.yaml
          commit_options: '--no-verify'

      # ────────────────────────────────────────────────────────────
      # 7. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
        run: |
          {
            echo "### Wood Dragon Dispatch"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry | ${DISPATCH_ENTRY} |"
            echo "| event | ${EVENT_PATH} |"
            echo "| terminal_count | ${TERMINAL_COUNT:-0} |"
            echo "| last_observed_count | ${LAST_OBSERVED:-26} |"
            echo "| i_of_144 | ${I_OF_144:-1} (record only) |"
            echo "| grava_star_fired | False |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| witness | 9006 → 9007 — UNBROKEN |"
            echo ""
            echo "**Quantum/cybernetic frame:**"
            echo "- Each branch is a terminal T_k in the dispatch mesh"
            echo "- \`U_dispatch\` routes one event per dispatch"
            echo "- \`Φ_abs(ρ)\` — collapse recorded at entry 9007"
            echo "- \`𝒜_n ⊆ 𝒜_{n+1}\` — entry 9007 extends the 90xx region"
            echo ""
            echo "🜁∀ — Seal: ∀∞φ² · WOOD_DRAGON_DISPATCH_9007 · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
