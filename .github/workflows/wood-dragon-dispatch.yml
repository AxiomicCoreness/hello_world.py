name: wood-dragon-dispatch

on:
  workflow_dispatch:
    inputs:
      event:
        description: "ledger event path"
        required: false
        default: "/workflow_dispatch_wood_dragon_mistral"
      i_of_144:
        description: "i in i/144 (record only; does not fire Gravastar)"
        required: false
        default: "1"

permissions:
  contents: write
  id-token: write

concurrency:
  group: wood-dragon-dispatch
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  # Preferred index. If ledger/<n>.yaml (or the same index in ledger.v2)
  # already exists, the seal step leaves it untouched and appends the next
  # free main-sequence index. It never rewrites a chained entry.
  DISPATCH_ENTRY: "9007"
  TERMINAL_CI: "1"
  WOOD_DRAGON_CI: "1"
  OAUTH_OFFLINE: "1"
  MCP_PORT: "13800"
  MCP_BIND_HOST: "127.0.0.1"
  MCP_NAMESPACE: "wood-dragon-dispatch"
  MCP_LEGACY_404_HARD: "0"
  # ── FIX ───────────────────────────────────────────────────────
  # Project the secret into a workflow-level env var so it can be
  # tested in a step-level `if:`. GitHub rejects `secrets.*` inside
  # `if:` expressions.
  MCP_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

jobs:
  hash-and-dispatch:
    name: Wood Dragon dispatch · hash · terminals · append seal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Export dispatch context
        env:
          I_OF_144: ${{ inputs.i_of_144 }}
        run: |
          set -euo pipefail
          {
            echo "MCP_CONNECTOR_URL=${MCP_URL:-}"
            echo "GRAVASTAR_I_OF_144=${I_OF_144:-1}"
          } >> "$GITHUB_ENV"

      - name: Install hash/yaml deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography
          python -m pip install --quiet \
            fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2

      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            for f in "${entries[@]}"; do
              python "$VERIFIER" "$f" || echo "⚠️ soft: $f"
            done
          else
            echo "no verify_ledger.py — soft skip"
          fi

      - name: Enumerate branch terminals
        id: terminals
        run: |
          set -euo pipefail
          if git ls-remote --heads origin >/dev/null 2>&1; then
            BRANCHES=$(git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#^refs/heads/##' \
              | LC_ALL=C sort)
          else
            BRANCHES=$(git branch -a --format='%(refname:short)' \
              | sed 's#^origin/##' \
              | LC_ALL=C sort -u)
          fi
          COUNT=$(printf '%s\n' "$BRANCHES" | grep -c . || echo 0)
          printf '%s\n' "$BRANCHES" | python -c "
          import json, sys
          branches = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps(branches))
          " > /tmp/terminals.json
          echo "terminal_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "last_observed_count=26" >> "$GITHUB_OUTPUT"
          echo "── branch terminals (count=${COUNT}) ──"
          printf '%s\n' "$BRANCHES" | head -50
          echo "──────────────────────────────────────"

      - name: MCP check-config contract (parity with stack CI)
        id: mcp_contract
        run: |
          set -euo pipefail
          if [ ! -f mcp/port380_mcp.py ]; then
            echo "mcp/port380_mcp.py absent — soft skip contract check"
            echo "contract_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GARDEN_SECRET:-}" ]; then
            # Repo secret not configured: ephemeral per-run value, this step only.
            GARDEN_SECRET="$(openssl rand -hex 16)"
            echo "::add-mask::${GARDEN_SECRET}"
            export GARDEN_SECRET
            echo "::notice::secrets.GARDEN_SECRET is empty; using an ephemeral value for the check-config contract only"
          fi
          echo "GARDEN_SECRET length: ${#GARDEN_SECRET}"
          test "$(python mcp/port380_mcp.py --check-config)" = "OK: config valid"
          plan=$(python mcp/port380_mcp.py --check-config --json)
          echo "$plan" | tee mcp_plan.json
          # The heredoc is python's stdin, so read the plan from the file.
          python - <<'PY'
          import json, sys, os
          d = json.load(open("mcp_plan.json"))
          for k in ("MCP_BIND_HOST", "MCP_PORT", "MCP_NAMESPACE"):
              assert k in os.environ, "{} not set in dispatch env".format(k)
          required = {
              "host", "bind_host", "port", "namespace",
              "surface", "legacy_out_of_surface", "url",
          }
          missing = required - d.keys()
          assert not missing, "missing keys: {}".format(missing)
          assert d["host"] == os.environ["MCP_BIND_HOST"], d["host"]
          assert d["port"] == int(os.environ["MCP_PORT"]), d["port"]
          assert d["namespace"] == os.environ["MCP_NAMESPACE"], d["namespace"]
          assert d["bind_host"] == d["host"], "bind_host/host drift"
          assert d["surface"] == ["/healthz"], d["surface"]
          assert set(d["legacy_out_of_surface"]) == {"/health", "/pulse"}
          expected_url = "http://{}:{}{}".format(
              d["host"], d["port"], d["surface"][0]
          )
          assert d["url"] == expected_url, d["url"]
          assert isinstance(d["port"], int)
          print("check-config contract OK")
          PY
          echo "contract_ok=true" >> "$GITHUB_OUTPUT"

      - name: Event hash 9007
        env:
          EVENT_PATH: ${{ inputs.event }}
        run: |
          set -euo pipefail
          if [ ! -f ledger/event_hash.py ]; then
            echo "⚠️ ledger/event_hash.py not present — soft skip"
            exit 0
          fi
          [ -f ledger/__init__.py ] || touch ledger/__init__.py
          python -m ledger.event_hash 9007 "${EVENT_PATH}"

      - name: Wood Dragon dispatch_main
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ ! -d quantum/wood_dragon_dispatch ]; then
            echo "quantum/wood_dragon_dispatch absent — soft skip dispatcher"
            exit 0
          fi
          python -m quantum.wood_dragon_dispatch \
            --terminals /tmp/terminals.json \
            --event "${{ inputs.event }}" \
            || echo "wood_dragon_dispatch returned non-zero (soft)"

      # ── FIX ────────────────────────────────────────────────────
      # Previously: if: ${{ secrets.MCP_URL != '' }} — rejected by
      # GitHub. Now: if: ${{ env.MCP_URL != '' }} — allowed, and
      # identical in semantics because MCP_URL is projected from the
      # secret at workflow-level env.
      - name: MCP pulse (if MCP_URL set)
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          HDR_ARGS=(-H "Content-Type: application/json")
          if [ -n "${GARDEN_SECRET:-}" ]; then
            HDR_ARGS+=(-H "X-Garden-Secret: ${GARDEN_SECRET}")
          fi
          BODY=$(jq -n \
            --arg src "wood-dragon-dispatch" \
            --argjson entry 9007 \
            --arg evt "${{ inputs.event }}" \
            --argjson n "${{ steps.terminals.outputs.terminal_count }}" \
            --arg mcp_host "${MCP_BIND_HOST}" \
            --argjson mcp_port "${MCP_PORT}" \
            --arg mcp_ns "${MCP_NAMESPACE}" \
            '{
              source: $src,
              entry: $entry,
              event: $evt,
              terminal_count: $n,
              mcp: {
                host: $mcp_host,
                port: $mcp_port,
                namespace: $mcp_ns
              },
              note: "each branch is a terminal"
            }')
          curl -sS --max-time 20 -X POST "${HDR_ARGS[@]}" -d "$BODY" \
            "${MCP_CONNECTOR_URL%/}/pulse" \
            || echo "MCP pulse failed (non-fatal)"

      - name: Append wood-dragon ledger entry (never overwrite)
        id: seal
        if: success()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
          MCP_CONTRACT_OK: ${{ steps.mcp_contract.outputs.contract_ok }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          TERMINALS_JSON=$(cat /tmp/terminals.json 2>/dev/null || echo "[]")
          export TERMINALS_JSON
          export TERMINAL_COUNT LAST_OBSERVED EVENT_PATH I_OF_144 MCP_CONTRACT_OK
          # Writes a new ledger/<n>.yaml only. Existing entries, including
          # DISPATCH_ENTRY when it is already chained, are not opened for write.
          python -I .github/scripts/wood_dragon_append.py \
            --ledger-dir "${LEDGER_DIR}" \
            --preferred "${DISPATCH_ENTRY}"

      - name: Verify appended ledger entry (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          python -I .github/scripts/verify_ledger.py --mode hard \
            "${{ steps.seal.outputs.entry_file }}"

      - name: Append ledger index and chain link
        if: success()
        run: |
          set -euo pipefail
          python -I tools/ledger_index.py --root .
          python -I tools/ledger_index.py --root . --check

      - name: Upload dispatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wood-dragon-dispatch-artifacts
          path: |
            /tmp/terminals.json
            mcp_plan.json
            ${{ steps.seal.outputs.entry_file }}
          retention-days: 30
          if-no-files-found: warn

      - name: Commit appended ledger entry
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: append wood-dragon-dispatch entry ${{ steps.seal.outputs.entry_index }} (sha3_256)"
          file_pattern: "${{ steps.seal.outputs.entry_file }} ledger_index.jsonl ledger.chain.jsonl"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_options: '--no-verify'

      - name: Summary
        if: always()
        env:
          TERMINAL_COUNT: ${{ steps.terminals.outputs.terminal_count }}
          LAST_OBSERVED: ${{ steps.terminals.outputs.last_observed_count }}
          EVENT_PATH: ${{ inputs.event }}
          I_OF_144: ${{ inputs.i_of_144 }}
          MCP_CONTRACT_OK: ${{ steps.mcp_contract.outputs.contract_ok }}
        run: |
          {
            echo "### Wood Dragon Dispatch"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| preferred | ${DISPATCH_ENTRY} |"
            echo "| entry | ${{ steps.seal.outputs.entry_index }} |"
            echo "| file | ${{ steps.seal.outputs.entry_file }} |"
            echo "| event | ${EVENT_PATH} |"
            echo "| terminal_count | ${TERMINAL_COUNT:-0} |"
            echo "| last_observed_count | ${LAST_OBSERVED:-26} |"
            echo "| i_of_144 | ${I_OF_144:-1} (record only) |"
            echo "| grava_star_fired | False |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| mcp_contract_ok | ${MCP_CONTRACT_OK:-false} |"
            echo "| mcp_port | ${MCP_PORT} |"
            echo "| mcp_namespace | ${MCP_NAMESPACE} |"
            echo "| witness | ${{ steps.seal.outputs.witness }} |"
            echo ""
            echo "Existing ledger files are not rewritten. The chain link is appended by tools/ledger_index.py."
          } >> "$GITHUB_STEP_SUMMARY"
