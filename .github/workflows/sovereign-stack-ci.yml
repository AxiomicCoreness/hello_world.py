name: Sovereign Stack CI — app · mcp · k8s · kubernetes

on:
  push:
    branches: [main, master, deepseek, grok, mistral]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
      - "requirements.txt"
      - ".github/workflows/sovereign-stack-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  NORTH_STAR: H6VSH2
  PHASE_LOCK: "202.6"
  LIGHTNING_IMPACT_HZ: "6.49"
  LEDGER_HEAD: "9142"
  MCP_PORT: "13800"
  MCP_BIND_HOST: "127.0.0.1"
  MCP_NAMESPACE: "ci-smoke"
  MCP_LEGACY_404_HARD: "0"

jobs:
  app:
    name: app/ — FastAPI import + route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install --quiet -r requirements.txt
          fi
          python -m pip install --quiet \
            fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2
      - name: Import app
        run: |
          set -euo pipefail
          python -c "from app.main import app; print('app import ok', app.title, app.version)"
      - name: Route smoke (TestClient)
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          for path in ("/health", "/status", "/pulse", "/vision", "/systems"):
              assert c.get(path).status_code == 200, path
          r = c.post("/gate", json={"entry": 9300, "event": "/smoke"})
          assert r.status_code == 200
          assert r.json()["accepted"] is True
          print("route smoke ok")
          PY

  mcp:
    name: mcp/ — full check-config contract + /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile check
        run: |
          set -euo pipefail
          python -m py_compile mcp/port380_mcp.py

      - name: Full --check-config JSON contract (7 keys)
        run: |
          set -euo pipefail
          plan=$(python mcp/port380_mcp.py --check-config)
          echo "$plan" | tee mcp_plan.json
          echo "$plan" | python - <<'PY'
          import json, sys, os
          d = json.load(sys.stdin)
          for k in ("MCP_BIND_HOST", "MCP_PORT", "MCP_NAMESPACE"):
              assert k in os.environ, "{} not set in CI env".format(k)
          required = {
              "host", "bind_host", "port", "namespace",
              "surface", "legacy_out_of_surface", "url",
          }
          missing = required - d.keys()
          assert not missing, "missing keys: {}".format(missing)
          assert d["host"] == os.environ["MCP_BIND_HOST"], d["host"]
          assert d["port"] == int(os.environ["MCP_PORT"]), d["port"]
          assert d["namespace"] == os.environ["MCP_NAMESPACE"], d["namespace"]
          assert d["bind_host"] == d["host"], "bind_host/host drift"
          assert d["surface"] == ["/healthz"], d["surface"]
          assert set(d["legacy_out_of_surface"]) == {"/health", "/pulse"}
          expected_url = "http://{}:{}{}".format(d["host"], d["port"], d["surface"][0])
          assert d["url"] == expected_url, d["url"]
          assert isinstance(d["port"], int)
          print("check-config contract OK")
          PY

      - name: Live probe /healthz (same MCP_* env)
        run: |
          set -euo pipefail
          python mcp/port380_mcp.py &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          deadline=$((SECONDS + 30))
          code="000"
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -o /tmp/mcp_body -w "%{http_code}" \
              "http://127.0.0.1:${MCP_PORT}/healthz" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "healthz=200 after ${SECONDS}s"
              cat /tmp/mcp_body; echo
              exit 0
            fi
            sleep 1
          done
          echo "❌ /healthz never returned 200 within 30s"
          echo "last code=${code}"
          cat /tmp/mcp_body 2>/dev/null || true
          exit 1

  k8s:
    name: k8s/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Validate k8s/*.yaml
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(k8s/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no k8s/*.yaml files — soft skip"
            exit 0
          fi
          for f in "${files[@]}"; do
            python -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
          echo "✅ validated ${#files[@]} k8s manifests"

  kubernetes:
    name: kubernetes/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Validate kubernetes/*.yaml
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(kubernetes/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no kubernetes/*.yaml files — soft skip"
            exit 0
          fi
          for f in "${files[@]}"; do
            python -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
          echo "✅ validated ${#files[@]} kubernetes manifests"

  seal:
    name: seal — record run
    runs-on: ubuntu-latest
    needs: [app, mcp, k8s, kubernetes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          APP: ${{ needs.app.result }}
          MCP: ${{ needs.mcp.result }}
          K8S: ${{ needs.k8s.result }}
          KUBE: ${{ needs.kubernetes.result }}
        run: |
          {
            echo "## Sovereign Stack CI"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| app | ${APP} |"
            echo "| mcp | ${MCP} |"
            echo "| k8s | ${K8S} |"
            echo "| kubernetes | ${KUBE} |"
            echo ""
            echo "Seal: ∀∞φ² · STACK_CI · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"

          for r in "$APP" "$MCP" "$K8S" "$KUBE"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "❌ upstream job failed: $r"
              exit 1
            fi
          done
          echo "✅ all upstream jobs succeeded"
