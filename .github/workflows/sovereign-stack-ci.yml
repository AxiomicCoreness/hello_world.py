name: Sovereign Stack CI — app · mcp · k8s · kubernetes

on:
  push:
    branches: [main, deepseek, deepseek-ci, deepseek-cd]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
      - "requirements.txt"
      - ".github/workflows/sovereign-stack-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  NORTH_STAR: H6VSH2
  PHASE_LOCK: "202.6"
  LIGHTNING_IMPACT_HZ: "6.49"
  LEDGER_HEAD: "9142"

jobs:
  app:
    name: app/ — FastAPI import + route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2
      - name: Import app
        run: python -c "from app.main import app; print('app import ok', app.title)"
      - name: Route smoke (TestClient)
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/health").status_code == 200
          assert c.get("/status").status_code == 200
          assert c.get("/pulse").status_code == 200
          r = c.post("/gate", json={"entry": 9300, "event": "/smoke"})
          assert r.status_code == 200
          assert r.json()["accepted"] is True
          print("route smoke ok")
          PY

  mcp:
    name: mcp/ — Fast MCP import + bind smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile mcp/port380_mcp.py
      - name: Boot MCP on ephemeral port
        run: |
          PORT=13800 python - <<'PY' &
          import os, sys, runpy
          sys.argv = ["port380_mcp.py"]
          os.environ["PORT"] = "13800"
          runpy.run_path("mcp/port380_mcp.py", run_name="__main__")
          PY
          sleep 2
          curl -sS -o /dev/null -w "health=%{http_code}\n" http://127.0.0.1:13800/health
          curl -sS -o /dev/null -w "pulse=%{http_code}\n"  http://127.0.0.1:13800/pulse

  k8s:
    name: k8s/ — manifest validation (7 files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate k8s/*.yaml
        run: |
          for f in k8s/*.yaml; do
            echo "validating $f"
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
          echo "k8s manifests ok"

  kubernetes:
    name: kubernetes/ — manifest validation (Gateway + Rollouts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate kubernetes/*.yaml
        run: |
          for f in kubernetes/*.yaml; do
            echo "validating $f"
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
          echo "kubernetes manifests ok"

  seal:
    name: seal — record run
    runs-on: ubuntu-latest
    needs: [app, mcp, k8s, kubernetes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          {
            echo "## Sovereign Stack CI"
            echo "- app/ : ${{ needs.app.result }}"
            echo "- mcp/ : ${{ needs.mcp.result }}"
            echo "- k8s/ : ${{ needs.k8s.result }}"
            echo "- kubernetes/ : ${{ needs.kubernetes.result }}"
            echo "- north_star: ${NORTH_STAR}"
            echo "- phase_lock: ${PHASE_LOCK}"
            echo "- lightning_hz: ${LIGHTNING_IMPACT_HZ}"
            echo "Seal: ∀∞φ² · STACK_CI · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
