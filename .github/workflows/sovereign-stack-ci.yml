name: Sovereign Stack CI — app · mcp · k8s · kubernetes

on:
  push:
    branches: [main, master, deepseek, grok, mistral]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
      - "requirements.txt"
      - ".github/workflows/sovereign-stack-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  NORTH_STAR: H6VSH2
  PHASE_LOCK: "202.6"
  MCP_PORT: "13800"
  MCP_BIND_HOST: "127.0.0.1"
  MCP_NAMESPACE: "ci-smoke"
  MCP_LEGACY_404_HARD: "0"

jobs:
  app:
    name: app/ — FastAPI import + route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install --quiet -r requirements.txt || true
          fi
          python -m pip install --quiet \
            fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2 httpx
      - name: Import app
        id: import
        run: |
          set -euo pipefail
          if [ ! -f app/main.py ]; then
            echo "app/main.py absent — soft skip"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c "from app.main import app; print('app import ok', app.title, app.version)"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: Route smoke (TestClient)
        if: steps.import.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          for path in ("/health", "/status", "/pulse", "/vision", "/systems"):
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.text[:200])
          r = c.post("/gate", json={"entry": 9300, "event": "/smoke"})
          assert r.status_code == 200, r.text[:300]
          body = r.json()
          assert body.get("accepted") is True, body
          print("route smoke ok")
          PY

  mcp:
    name: mcp/ — full check-config contract + /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile check
        run: |
          set -euo pipefail
          if [ ! -f mcp/port380_mcp.py ]; then
            echo "mcp/port380_mcp.py absent — soft skip"
            exit 0
          fi
          python -m py_compile mcp/port380_mcp.py
      - name: Full --check-config JSON contract
        run: |
          set -euo pipefail
          if [ ! -f mcp/port380_mcp.py ]; then
            echo "soft skip check-config"
            exit 0
          fi
          plan=$(python mcp/port380_mcp.py --check-config)
          echo "$plan" | tee mcp_plan.json
          python - <<'PY'
          import json
          plan = json.load(open("mcp_plan.json"))
          required = {"bind", "port", "url", "surface", "namespace", "legacy_404_hard", "ok"}
          missing = required - set(plan)
          assert not missing, missing
          print("check-config contract ok", sorted(plan))
          PY
      - name: Live probe /healthz
        run: |
          set -euo pipefail
          if [ ! -f mcp/port380_mcp.py ]; then
            echo "soft skip healthz"
            exit 0
          fi
          python mcp/port380_mcp.py &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${MCP_PORT}/healthz" >/tmp/mcp_body; then
              cat /tmp/mcp_body
              echo
              exit 0
            fi
            sleep 0.5
          done
          echo "healthz did not become ready"
          exit 1

  k8s:
    name: k8s/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Validate k8s/**/*.yaml (multi-doc safe)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path("k8s").rglob("*.yaml")) + sorted(Path("k8s").rglob("*.yml"))
          if not files:
              print("no k8s yaml — soft skip")
              raise SystemExit(0)
          n = 0
          for f in files:
              text = f.read_text(encoding="utf-8", errors="replace")
              docs = list(yaml.safe_load_all(text))
              n += len([d for d in docs if d is not None])
              print(f"ok {f} ({len(docs)} doc(s))")
          print(f"✅ validated {len(files)} files, {n} documents")
          PY

  kubernetes:
    name: kubernetes/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Validate kubernetes/**/*.yaml (multi-doc safe)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("kubernetes")
          if not root.is_dir():
              print("kubernetes/ absent — soft skip")
              raise SystemExit(0)
          files = sorted(root.rglob("*.yaml")) + sorted(root.rglob("*.yml"))
          if not files:
              print("no kubernetes yaml — soft skip")
              raise SystemExit(0)
          for f in files:
              text = f.read_text(encoding="utf-8", errors="replace")
              list(yaml.safe_load_all(text))
              print(f"ok {f}")
          print(f"✅ validated {len(files)} kubernetes manifests")
          PY

  seal:
    name: seal — record run
    runs-on: ubuntu-latest
    needs: [app, mcp, k8s, kubernetes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          APP: ${{ needs.app.result }}
          MCP: ${{ needs.mcp.result }}
          K8S: ${{ needs.k8s.result }}
          KUBE: ${{ needs.kubernetes.result }}
        run: |
          set -euo pipefail
          {
            echo "## Sovereign Stack CI"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| app | ${APP} |"
            echo "| mcp | ${MCP} |"
            echo "| k8s | ${K8S} |"
            echo "| kubernetes | ${KUBE} |"
            echo ""
            echo "Seal label: ∀∞φ² · STACK_CI · WITNESSED (summary only; no ledger write)"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for r in "$APP" "$MCP" "$K8S" "$KUBE"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "upstream not green: $r"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "✅ all upstream jobs succeeded or skipped"
