name: Sovereign Stack CI — app · mcp · k8s · kubernetes

on:
  push:
    branches: [main, deepseek, deepseek-ci, deepseek-cd]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
      - "requirements.txt"
      - ".github/workflows/sovereign-stack-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  NORTH_STAR: H6VSH2
  PHASE_LOCK: "202.6"
  LIGHTNING_IMPACT_HZ: "6.49"
  LEDGER_HEAD: "9142"
  MCP_PORT: "13800"
  MCP_BIND_HOST: "127.0.0.1"
  MCP_NAMESPACE: "ci-smoke"
  MCP_LEGACY_404_HARD: "0"

jobs:
  app:
    name: app/ — FastAPI import + route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2
      - name: Import app
        run: python -c "from app.main import app; print('app import ok', app.title)"
      - name: Route smoke (TestClient)
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/health").status_code == 200
          assert c.get("/status").status_code == 200
          assert c.get("/pulse").status_code == 200
          r = c.post("/gate", json={"entry": 9300, "event": "/smoke"})
          assert r.status_code == 200
          assert r.json()["accepted"] is True
          print("route smoke ok")
          PY

  mcp:
    name: mcp/ — full check-config contract + /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m py_compile mcp/port380_mcp.py

      - name: Seven-key --check-config contract
        run: |
          set -euo pipefail
          plan=$(python mcp/port380_mcp.py --check-config)
          echo "$plan" | tee mcp_plan.json
          echo "$plan" | python -c '
          import json, sys, os

          d = json.load(sys.stdin)

          # 0. Env present (clean diagnostics vs bare KeyError)
          for k in ("MCP_BIND_HOST", "MCP_PORT", "MCP_NAMESPACE"):
              assert k in os.environ, f"{k} not set in CI env"

          # 1. Required keys present
          required = {
              "host", "bind_host", "port", "namespace",
              "surface", "legacy_out_of_surface", "url",
          }
          missing = required - d.keys()
          assert not missing, f"missing keys: {missing}"

          # 2. Env agreement
          assert d["host"] == os.environ["MCP_BIND_HOST"], d["host"]
          assert d["port"] == int(os.environ["MCP_PORT"]), d["port"]
          assert d["namespace"] == os.environ["MCP_NAMESPACE"], d["namespace"]

          # 3. Alias consistency
          assert d["bind_host"] == d["host"], "bind_host/host drift"

          # 4. Surface contract (scoped to /healthz only)
          assert d["surface"] == ["/healthz"], d["surface"]
          assert set(d["legacy_out_of_surface"]) == {"/health", "/pulse"}, d["legacy_out_of_surface"]

          # 5. URL consistency (catches hardcoded drift)
          expected_url = f"http://{d["host"]}:{d["port"]}{d["surface"][0]}"
          assert d["url"] == expected_url, d["url"]

          # 6. Types
          assert isinstance(d["port"], int), type(d["port"])
          assert isinstance(d["surface"], list), type(d["surface"])
          assert isinstance(d["legacy_out_of_surface"], list), type(d["legacy_out_of_surface"])

          print("check-config contract OK", d)
          '

      - name: Live probe /healthz (same MCP_* env)
        run: |
          set -euo pipefail
          python mcp/port380_mcp.py &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          code=$(curl -sS -o /tmp/mcp_body -w "%{http_code}" "http://127.0.0.1:${MCP_PORT}/healthz")
          echo "healthz=${code}"
          cat /tmp/mcp_body; echo
          test "${code}" = "200"

          code_h=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:${MCP_PORT}/health" || true)
          code_p=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:${MCP_PORT}/pulse" || true)
          echo "legacy /health=${code_h} /pulse=${code_p}"

          if [ "${MCP_LEGACY_404_HARD}" = "1" ]; then
            test "${code_h}" = "404"
            test "${code_p}" = "404"
          else
            if [ "${code_h}" != "404" ] || [ "${code_p}" != "404" ]; then
              echo "::warning::legacy routes not 404 (set MCP_LEGACY_404_HARD=1 to fail)"
            fi
          fi

  k8s:
    name: k8s/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate k8s/*.yaml
        run: |
          for f in k8s/*.yaml; do
            python -c "import yaml; yaml.safe_load(open('$f'))"
          done

  kubernetes:
    name: kubernetes/ — manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate kubernetes/*.yaml
        run: |
          for f in kubernetes/*.yaml; do
            python -c "import yaml; yaml.safe_load(open('$f'))"
          done

  seal:
    name: seal — record run
    runs-on: ubuntu-latest
    needs: [app, mcp, k8s, kubernetes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          {
            echo "## Sovereign Stack CI"
            echo "- mcp: seven-key check-config contract (invariant)"
            echo "- mcp result: ${{ needs.mcp.result }}"
            echo "- ASGI North Star: 127.0.0.1:8024 held"
            echo "Seal: ∀∞φ² · STACK_CI · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
