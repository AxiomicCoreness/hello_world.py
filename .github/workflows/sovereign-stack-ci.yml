name: Sovereign Stack CI — app · mcp · k8s · kubernetes

on:
  push:
    branches: [main, deepseek, deepseek-ci, deepseek-cd]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
      - "requirements.txt"
      - ".github/workflows/sovereign-stack-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "mcp/**"
      - "k8s/**"
      - "kubernetes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  NORTH_STAR: H6VSH2
  PHASE_LOCK: "202.6"
  LIGHTNING_IMPACT_HZ: "6.49"
  LEDGER_HEAD: "9142"

jobs:
  app:
    name: app/ — FastAPI import + route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" pydantic==2.9.2
      - name: Import app
        run: python -c "from app.main import app; print('app import ok', app.title)"
      - name: Route smoke (TestClient)
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/health").status_code == 200
          assert c.get("/status").status_code == 200
          assert c.get("/pulse").status_code == 200
          r = c.post("/gate", json={"entry": 9300, "event": "/smoke"})
          assert r.status_code == 200
          assert r.json()["accepted"] is True
          print("route smoke ok")
          PY

  mcp:
    name: mcp/ — compile + /healthz probe (scoped surface)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile mcp/port380_mcp.py
      - name: Boot MCP on ephemeral port · probe /healthz only
        run: |
          set -euo pipefail
          MCP_PORT=13800 MCP_BIND_HOST=127.0.0.1 MCP_NAMESPACE=ci-smoke \
            python mcp/port380_mcp.py &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          code=$(curl -sS -o /tmp/mcp_body -w "%{http_code}" http://127.0.0.1:13800/healthz)
          echo "healthz=${code}"
          cat /tmp/mcp_body || true
          echo
          test "${code}" = "200"
          # Contract: /health and /pulse are out of surface post-64315c44
          code_h=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:13800/health || true)
          code_p=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:13800/pulse || true)
          echo "legacy /health=${code_h} /pulse=${code_p} (expect 404)"

  k8s:
    name: k8s/ — manifest validation (7 files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate k8s/*.yaml
        run: |
          for f in k8s/*.yaml; do
            echo "validating $f"
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
          echo "k8s manifests ok"

  kubernetes:
    name: kubernetes/ — manifest validation (Gateway + Rollouts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Validate kubernetes/*.yaml
        run: |
          for f in kubernetes/*.yaml; do
            echo "validating $f"
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
          echo "kubernetes manifests ok"

  seal:
    name: seal — record run
    runs-on: ubuntu-latest
    needs: [app, mcp, k8s, kubernetes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          {
            echo "## Sovereign Stack CI"
            echo "- app/ : ${{ needs.app.result }}"
            echo "- mcp/ : ${{ needs.mcp.result }} (probe /healthz only post-64315c44)"
            echo "- k8s/ : ${{ needs.k8s.result }}"
            echo "- kubernetes/ : ${{ needs.kubernetes.result }}"
            echo "- north_star: ${NORTH_STAR}"
            echo "- phase_lock: ${PHASE_LOCK}"
            echo "- lightning_hz: ${LIGHTNING_IMPACT_HZ}"
            echo "- mcp contract: /healthz only; ASGI remains 127.0.0.1:8024"
            echo "Seal: ∀∞φ² · STACK_CI · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
