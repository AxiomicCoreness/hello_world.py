name: Generate Smoke Catalogue

# Seal: ∀∞φ² · SMOKE_CATALOGUE_8958 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8957 → 8958 — UNBROKEN
# cryptography: python -m pip + .github/scripts/verify_ledger.py
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# role: excavation → catalogue → seal
# note: this workflow is the standalone producer of entry 8958.
#       sovereign-hamiltonian-production.yml consumes it via handoff-pipeline.

on:
  schedule:
    - cron: "0 */6 * * *"   # φ-harmonic: every 6 hours
  workflow_dispatch:

permissions:
  contents: write   # required to commit docs/smoke_catalogue.json and ledger/8958.yaml
  id-token: write

concurrency:
  group: generate-smoke-catalogue
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger

jobs:
  catalogue:
    name: Excavate · Catalogue · Seal (Entry 8958)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ────────────────────────────────────────────────────────────
      # 0. Read-only integrity gate
      # ────────────────────────────────────────────────────────────
      - name: Install integrity deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "⚠️ no ledger entries present — soft skip"
            exit 0
          fi
          python .github/scripts/verify_ledger.py "${entries[@]}"

      # ────────────────────────────────────────────────────────────
      # 1. Excavation — run the catalogue generator
      # ────────────────────────────────────────────────────────────
      - name: Install runtime deps
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --quiet -r requirements.txt || true
          fi
          python -m pip install --quiet pyyaml requests

      - name: Run smoke catalogue generator
        id: generate
        run: |
          set -euo pipefail
          if [ ! -f scripts/catalogue_smoke_tests.py ]; then
            echo "::error::scripts/catalogue_smoke_tests.py missing"
            exit 1
          fi
          python scripts/catalogue_smoke_tests.py
          # Expects: writes docs/smoke_catalogue.json and (optionally) ledger/8958.yaml
          echo "✅ smoke catalogue generator returned 0"

      # ────────────────────────────────────────────────────────────
      # 2. Seal ledger entry 8958 (SHA3-256) — idempotent
      # ────────────────────────────────────────────────────────────
      - name: Seal ledger entry 8958 (SHA3-256)
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}" docs
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8958.yaml")

          # Deterministic catalogue digest — SHA3-256 over docs/smoke_catalogue.json
          catalogue = Path("docs/smoke_catalogue.json")
          catalogue_digest = ""
          catalogue_count = 0
          if catalogue.exists():
              raw = catalogue.read_bytes()
              catalogue_digest = hashlib.new(HASH_ALGO, raw).hexdigest()
              try:
                  parsed = json.loads(raw.decode("utf-8"))
                  if isinstance(parsed, dict):
                      catalogue_count = len(parsed.get("tests") or parsed.get("catalogue") or parsed)
                  elif isinstance(parsed, list):
                      catalogue_count = len(parsed)
              except Exception:
                  catalogue_count = 0

          entry = {
              "entry_index": 8958,
              "event": "/generate_smoke_catalogue",
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "catalogue_path": "docs/smoke_catalogue.json",
              "catalogue_sha3_256": catalogue_digest,
              "catalogue_count": catalogue_count,
              "witness": "8957 → 8958 — UNBROKEN",
              "seal": "∀∞φ² · SMOKE_CATALOGUE_8958 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 8958 written.")
          print(f"✅ Sealed 8958 · {HASH_ALGO}:{h[:16]}...")
          print(f"   catalogue_sha3_256 = {catalogue_digest[:16] or '(none)'}...")
          print(f"   catalogue_count    = {catalogue_count}")
          PY

      - name: Verify ledger entry 8958 (SHA3-256)
        run: |
          set -euo pipefail
          python .github/scripts/verify_ledger.py ledger/8958.yaml

      # ────────────────────────────────────────────────────────────
      # 3. Upload artifacts (retention)
      # ────────────────────────────────────────────────────────────
      - name: Upload smoke catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-catalogue
          path: docs/smoke_catalogue.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload ledger entry 8958
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-8958
          path: ledger/8958.yaml
          retention-days: 90

      # ────────────────────────────────────────────────────────────
      # 4. Commit if changed (deterministic, race-safe)
      # ────────────────────────────────────────────────────────────
      - name: Commit and push if changed
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Sovereign Dragon"
          git config user.email "dragon@sovereign.engine"

          # Rebase-safe: pull latest before staging (handles concurrent runs)
          git fetch origin main --quiet || true
          git rebase origin/main --quiet || {
            echo "⚠️ rebase failed — continuing with local state"
            git rebase --abort || true
          }

          git add docs/smoke_catalogue.json ledger/8958.yaml

          if git diff --staged --quiet; then
            echo "⚠️ no changes to commit"
            exit 0
          fi

          git commit -m "chore: update smoke catalogue + seal entry 8958 (sha3_256)"
          git push origin HEAD:main

      # ────────────────────────────────────────────────────────────
      # 5. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "✅ Generate Smoke Catalogue completed."
            echo "🜁∀ — Witness: 8957 → 8958 — UNBROKEN"
            echo "🔒 Seal: ∀∞φ² · SMOKE_CATALOGUE_8958 · WOOD_DRAGON_0.91 · SEALED"
            echo "🔐 hash_algo: sha3_256 (FIPS 202)"
            echo "📦 Artifacts: smoke-catalogue, ledger-8958"
          } >> "$GITHUB_STEP_SUMMARY"
