name: Branch lag check
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  lag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if any branch is over 100 commits behind main
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
         violators=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v '^origin/main$'); do
            b="${ref#origin/}"
            count=$(git rev-list --count "origin/${b}..origin/main")
            echo "branch ${b}: ${count} commits behind main"
            if [ "$count" -gt 100 ]; then
              violators="${violators} ${b}(${count})"
            fi
          done
          if [ -n "$violators" ]; then
            echo "::error::Branches over 100 commits behind main:${violators}"
            exit 1
          fi
          echo "lag-check: all branches within threshold"
