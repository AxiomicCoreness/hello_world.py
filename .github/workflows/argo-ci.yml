name: Argo CI

# Hard CI for argocd/ sources + pure manifest unit tests.
# No cluster required for green. Optional live checks skip without kubeconfig.
# Seal: ∀∞φ² · ARGO_CI_8924 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8923 → 8924 — UNBROKEN
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# Append-only: ledger/8924.yaml is never overwritten. If it exists, the
# seal job verifies it and writes nothing.
# Python steps run with `python -P`: the repo root holds local
# `cryptography/` and `kubernetes/` folders that would otherwise shadow
# the installed packages.

on:
  push:
    branches: [main, master, deepseek, grok, mistral]
    paths:
      - "argocd/**"
      - "tests/**"
      - "port380_mcp.py"
      - ".github/scripts/verify_ledger.py"
      - ".github/workflows/argo-ci.yml"
      # ledger/** is deliberately absent: the seal job's auto-commit touches
      # ledger/8924.yaml. GITHUB_TOKEN pushes do not trigger workflows today,
      # but a PAT/App token would, and ledger/ is closed (v1) anyway.
  pull_request:
    branches: [main]
    paths:
      - "argocd/**"
      - "tests/**"
      - "port380_mcp.py"
      - ".github/scripts/verify_ledger.py"
      - ".github/workflows/argo-ci.yml"
      # ledger/** is deliberately absent: the seal job's auto-commit touches
      # ledger/8924.yaml. GITHUB_TOKEN pushes do not trigger workflows today,
      # but a PAT/App token would, and ledger/ is closed (v1) anyway.
  workflow_dispatch:
    inputs:
      steps_note:
        description: "Optional note"
        required: false
        default: "manual-argo-ci"
      allow_seal:
        description: "Run the seal job on this manual dispatch"
        type: boolean
        required: false
        default: true

# Workflow-level: least privilege. The `seal` job widens this locally.
permissions:
  contents: read

concurrency:
  group: argo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WOOD_DRAGON_TAU: "0.91"
  PHASE_LOCK: "202.6"
  ARGO_APP: sovereign-garden
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    name: Verify Ledger Signatures & Security Headers
    timeout-minutes: 5
    steps:
      # No step reads git history (no git log/describe/diff/merge-base).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Debug environment
        run: |
          set -euo pipefail
          echo "::group::Debug environment"
          echo "runner.os         = ${{ runner.os }}"
          echo "github.ref        = ${{ github.ref }}"
          echo "github.ref_name   = ${{ github.ref_name }}"
          echo "github.sha        = ${{ github.sha }}"
          echo "github.event_name = ${{ github.event_name }}"

          echo "── workflow env ──"
          echo "  ARGO_APP          = ${ARGO_APP:-<unset>}"
          echo "  HASH_ALGO         = ${HASH_ALGO:-<unset>}"
          echo "  LEDGER_DIR        = ${LEDGER_DIR:-<unset>}"
          echo "  WOOD_DRAGON_TAU   = ${WOOD_DRAGON_TAU:-<unset>}"
          echo "  PHASE_LOCK        = ${PHASE_LOCK:-<unset>}"

          echo "── filesystem ──"
          for d in argocd ledger ledger.v2 tests; do
            if [ -d "$d" ]; then
              count=$(find "$d" -maxdepth 1 -type f | wc -l)
              echo "  $d/  (${count} files)"
            else
              echo "  $d/  not found"
            fi
          done

          echo "── tooling ──"
          python --version
          if command -v yq >/dev/null 2>&1; then yq --version; else echo "yq not on PATH"; fi
          if command -v kubectl >/dev/null 2>&1; then kubectl version --client; else echo "kubectl not on PATH"; fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────────────
      # Install + import-check: converts the install CLAIM into EVIDENCE.
      # If cryptography fails to install, this step fails HERE, with a
      # clear message, before any consumer step runs.
      # ────────────────────────────────────────────────────────────────
      - name: Install deps (with import check)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pyyaml>=6,<7"
          python -P - <<'PY'
          import cryptography, yaml
          print(f"✅ cryptography {cryptography.__version__}")
          print(f"✅ pyyaml {yaml.__version__}")
          PY

      # ────────────────────────────────────────────────────────────────
      # Ed25519 verify. Guarded import: if cryptography is missing, this
      # step fails with a single clear line — not a raw traceback.
      # ────────────────────────────────────────────────────────────────
      - name: Verify Ed25519 signatures on ledger entries
        run: |
          set -euo pipefail
          python -P - <<'PY'
          import base64, sys, yaml
          from pathlib import Path

          try:
              from cryptography.hazmat.primitives.asymmetric import ed25519
              from cryptography.exceptions import InvalidSignature
          except ModuleNotFoundError as e:
              print(f"::error::cryptography missing in this job: {e}", file=sys.stderr)
              sys.exit(1)

          targets = ["ledger/8923.yaml"]
          checked = 0
          for t in targets:
              p = Path(t)
              if not p.exists():
                  print(f"::warning::{t} not found — soft skip")
                  continue
              data = yaml.safe_load(p.read_text()) or {}
              sig_b64 = data.get("signature")
              msg     = data.get("signed_payload")
              pub_b64 = data.get("public_key")
              if not (sig_b64 and msg and pub_b64):
                  print(f"::warning::{p.stem}: no signature fields — NOT_CHECKED")
                  continue
              try:
                  pub = ed25519.Ed25519PublicKey.from_public_bytes(
                      base64.b64decode(pub_b64))
                  pub.verify(base64.b64decode(sig_b64), msg.encode("utf-8"))
                  print(f"✅ Ed25519 verified: {p.stem}")
                  checked += 1
              except InvalidSignature:
                  print(f"❌ Ed25519 INVALID: {p}", file=sys.stderr)
                  sys.exit(1)
          print(f"checked {checked} signed entr{'y' if checked == 1 else 'ies'}")
          PY

      - name: Verify SHA3-256 seals on all present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob

          # ledger/ (v1, closed) uses .yaml; ledger.v2/ (active) uses .yml.
          entries=(ledger/*.yaml ledger.v2/*.yml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::warning::no ledger entries present — soft skip"
            exit 0
          fi

          VERIFIER=".github/scripts/verify_ledger.py"
          if [ ! -f "$VERIFIER" ]; then
            echo "::error::$VERIFIER not found"
            exit 1
          fi
          # The verifier must have a CLI. A truncated copy (no main())
          # exits 0 without checking anything.
          # AST check: catches async def main, and a file cut off mid-function
          # (a parse error), which a grep for '^def main' cannot.
          if ! python -P - "$VERIFIER" <<'PY'
          import ast, sys
          try:
              tree = ast.parse(open(sys.argv[1], encoding="utf-8").read())
          except SyntaxError as e:
              print(f"::error::{sys.argv[1]} does not parse: {e}")
              sys.exit(1)
          names = {n.name for n in tree.body
                   if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          sys.exit(0 if "main" in names else 1)
          PY
          then
            echo "::error::$VERIFIER has no top-level main() — truncated verifier, refusing to report green"
            exit 1
          fi

          # Repo terminology:
          #   Regime A = SHA3-256 of canonical JSON (body hash)
          #   Regime B = event hash, terminal_hex, GARDEN.EVENT.v1(.LEDGER)
          # The verifier tries both regimes on every file, so no pre-split.
          regime_a=()
          regime_b=()
          for f in "${entries[@]}"; do
            if grep -qE '^(witness_prefix|terminal_hex):' "$f"; then
              regime_b+=("$f")
            else
              regime_a+=("$f")
            fi
          done
          echo "── Regime A (body-hash seals, by field heuristic): ${#regime_a[@]} file(s)"
          echo "── Regime B (event-hash seals, by field heuristic): ${#regime_b[@]} file(s)"

          # 1. Report pass over every entry (soft: never fails the job).
          python -P "$VERIFIER" --mode soft "${entries[@]}" > verify-report.txt 2>&1 || true
          pass=$(grep -c '^✅' verify-report.txt || true)
          fail=$(grep -c '^❌' verify-report.txt || true)
          echo "soft report: ${#entries[@]} file(s), ✅ ${pass} line(s), ❌ ${fail} line(s)"
          {
            echo "### Ledger seal report (soft)"
            echo "- files: ${#entries[@]}"
            echo "- ✅ verified: ${pass}"
            echo "- ❌ problems: ${fail}"
          } >> "$GITHUB_STEP_SUMMARY"

          # 2. Hard gate on the concrete range (entry_index >= 9286,
          #    SEALED_CONCRETE_FROM in the verifier). These must verify.
          #    A file that does not parse is gated too, so it fails hard.
          mapfile -t gate < <(python -P - ledger.v2/*.yml <<'PY'
          import sys, yaml
          for f in sys.argv[1:]:
              try:
                  d = yaml.safe_load(open(f, encoding="utf-8"))
              except yaml.YAMLError:
                  print(f)
                  continue
              i = d.get("entry_index") if isinstance(d, dict) else None
              if isinstance(i, int) and 9286 <= i < 100000:
                  print(f)
          PY
          )
          if [ ${#gate[@]} -eq 0 ]; then
            echo "::warning::no ledger.v2 entries >= 9286 — hard gate has nothing to check"
            exit 0
          fi
          echo "── hard gate: ${#gate[@]} file(s) >= 9286"
          python -P "$VERIFIER" --mode hard "${gate[@]}"

      - name: Upload seal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-seal-report
          path: verify-report.txt
          retention-days: 90
          if-no-files-found: ignore

      # AST check, not substring: the middleware must actually be registered
      # (app.add_middleware / FastAPI(middleware=[Middleware(...)]) /
      # @app.middleware("http")), and the 6 header names must be set inside
      # the registered middleware (docstrings ignored; module constants it
      # references are followed). Undefined UPPER_CASE names it relies on
      # are reported, since they raise NameError at import.
      - name: Verify security headers in FastAPI middleware
        run: |
          set -euo pipefail
          python -P - <<'PY'
          import ast, sys
          from pathlib import Path

          p = Path("port380_mcp.py")
          if not p.exists():
              print("::error::port380_mcp.py missing — header check cannot run", file=sys.stderr)
              sys.exit(1)
          src = p.read_text(encoding="utf-8")
          try:
              tree = ast.parse(src, filename=str(p))
          except SyntaxError as e:
              print(f"::error file={p},line={e.lineno}::syntax error: {e.msg}", file=sys.stderr)
              sys.exit(1)

          REQUIRED = [
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]

          # Module-level bindings: name -> value node (last assignment wins).
          module_defs = {}
          module_names = set()
          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for t in targets:
                      if isinstance(t, ast.Name) and node.value is not None:
                          module_defs[t.id] = node.value
                          module_names.add(t.id)
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  module_names.add(node.name)
              elif isinstance(node, (ast.Import, ast.ImportFrom)):
                  for a in node.names:
                      module_names.add((a.asname or a.name).split(".")[0])

          def is_fastapi_call(v):
              return (isinstance(v, ast.Call)
                      and ((isinstance(v.func, ast.Name) and v.func.id == "FastAPI")
                           or (isinstance(v.func, ast.Attribute) and v.func.attr == "FastAPI")))

          apps = {n for n, v in module_defs.items() if is_fastapi_call(v)}
          if not apps:
              print("::error::no `<app> = FastAPI(...)` at module level", file=sys.stderr)
              sys.exit(1)

          registered = {}   # middleware name -> how/where
          decorated = []    # functions registered via @app.middleware("http")
          for node in ast.walk(tree):
              if (isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "add_middleware"
                      and isinstance(node.func.value, ast.Name) and node.func.value.id in apps
                      and node.args and isinstance(node.args[0], ast.Name)):
                  registered[node.args[0].id] = f"{node.func.value.id}.add_middleware (line {node.lineno})"
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  for d in node.decorator_list:
                      if (isinstance(d, ast.Call) and isinstance(d.func, ast.Attribute)
                              and d.func.attr == "middleware"
                              and isinstance(d.func.value, ast.Name) and d.func.value.id in apps
                              and d.args and isinstance(d.args[0], ast.Constant) and d.args[0].value == "http"):
                          decorated.append(node)
          for name in apps:
              for kw in module_defs[name].keywords:
                  if kw.arg == "middleware" and isinstance(kw.value, (ast.List, ast.Tuple)):
                      for el in kw.value.elts:
                          if (isinstance(el, ast.Call) and isinstance(el.func, ast.Name)
                                  and el.func.id == "Middleware" and el.args
                                  and isinstance(el.args[0], ast.Name)):
                              registered[el.args[0].id] = f"FastAPI(middleware=[Middleware(...)]) (line {el.lineno})"

          errors = []
          if "CORSMiddleware" in registered:
              print(f"✅ CORSMiddleware registered via {registered['CORSMiddleware']}")
          else:
              errors.append("CORSMiddleware is not registered on the app")

          # Where the security headers must live.
          bodies = []
          classes = {n.name: n for n in tree.body if isinstance(n, ast.ClassDef)}
          if "SecurityHeadersMiddleware" in registered:
              print(f"✅ SecurityHeadersMiddleware registered via {registered['SecurityHeadersMiddleware']}")
              if "SecurityHeadersMiddleware" in classes:
                  bodies.append(("class SecurityHeadersMiddleware", classes["SecurityHeadersMiddleware"]))
              else:
                  errors.append("SecurityHeadersMiddleware registered but not defined in this file")
          for fn in decorated:
              print(f"✅ @app.middleware('http') function {fn.name} (line {fn.lineno})")
              bodies.append((f"def {fn.name}", fn))
          if not bodies:
              errors.append("SecurityHeadersMiddleware is not registered (no add_middleware, "
                            "Middleware(...) or @app.middleware('http'))")

          def strip_docstring(stmts):
              if (stmts and isinstance(stmts[0], ast.Expr)
                      and isinstance(stmts[0].value, ast.Constant) and isinstance(stmts[0].value.value, str)):
                  return stmts[1:]
              return stmts

          found = {}        # header -> provenance
          undefined = set()

          def collect(node, via, seen):
              """Collect string constants reachable from node, following module names."""
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Constant) and isinstance(sub.value, str):
                      for h in REQUIRED:
                          if sub.value.lower() == h.lower():
                              found.setdefault(h, f"{via} (line {sub.lineno})")
                  elif isinstance(sub, ast.Name) and isinstance(sub.ctx, ast.Load):
                      n = sub.id
                      if n in seen:
                          continue
                      if n in module_defs:
                          collect(module_defs[n], f"{via} → {n}", seen | {n})
                      elif n not in module_names and n not in dir(__builtins__) and n.isupper():
                          undefined.add((n, sub.lineno))

          for label, body in bodies:
              for stmt in strip_docstring(body.body):
                  if isinstance(stmt, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      for s in strip_docstring(stmt.body):
                          collect(s, f"{label}.{stmt.name}", set())
                  else:
                      collect(stmt, label, set())

          for h in REQUIRED:
              if h in found:
                  print(f"   ✅ {h}: {found[h]}")
              else:
                  errors.append(f"header {h} not set in the registered middleware (docstrings ignored)")
          for n, line in sorted(undefined):
              errors.append(f"{n} is used (line {line}) but never defined — module import raises NameError")

          if errors:
              for e in errors:
                  print(f"::error file=port380_mcp.py::{e}", file=sys.stderr)
              sys.exit(1)
          print("✅ security middleware registered and all 6 headers set in it")
          PY

  validate-manifests:
    name: Argo · Manifest hard validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: verify-integrity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6,<7"
          python -P -c "import yaml; print('✅ pyyaml', yaml.__version__)"

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Required files present
        run: |
          set -euo pipefail
          required=(
            argocd/application-sovereign-garden.yaml
            argocd/rollout-sovereign-garden.yaml
            argocd/sovereign-garden-stable.yaml
            argocd/sovereign-garden-canary.yaml
            argocd/sovereign-garden-httproute.yaml
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "OK $f"
          done

      - name: YAML parse all argocd/*.yaml (hard fail)
        run: |
          set -euo pipefail
          python3 -P - <<'PY'
          import pathlib, sys, yaml
          root = pathlib.Path("argocd")
          assert root.is_dir(), "argocd/ missing"
          errors = []
          for p in sorted(root.glob("*.yaml")):
              try:
                  docs = list(yaml.safe_load_all(p.read_text()))
                  if not docs or all(d is None for d in docs):
                      errors.append(f"{p}: empty document")
                      continue
                  print(f"OK {p.name} ({len([d for d in docs if d])} doc(s))")
              except Exception as e:
                  errors.append(f"{p}: {e}")
          if errors:
              for e in errors:
                  print(f"FAIL {e}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Application selfHeal + HTTPRoute ignoreDifferences
        run: |
          set -euo pipefail
          yq -e '.spec.syncPolicy.automated.selfHeal == true' \
            argocd/application-sovereign-garden.yaml
          yq -e '.spec.ignoreDifferences[] | select(.kind == "HTTPRoute")' \
            argocd/application-sovereign-garden.yaml
          echo "selfHeal + HTTPRoute ignoreDifferences OK"

      - name: Rollout canary weight sequence 20/40/60/80/100
        run: |
          set -euo pipefail
          python3 -P - <<'PY'
          import pathlib, re, sys
          paths = [
              pathlib.Path("argocd/rollout-sovereign-garden.yaml"),
              pathlib.Path("argocd/rollout-sovereign-garden-gateway-multistage.yaml"),
          ]
          expect = [20, 40, 60, 80, 100]
          checked = 0
          for p in paths:
              if not p.exists():
                  continue
              weights = [int(x) for x in re.findall(r"setWeight:\s*(\d+)", p.read_text())]
              if not weights:
                  print(f"FAIL {p}: no setWeight steps", file=sys.stderr)
                  sys.exit(1)
              if weights != expect:
                  print(f"FAIL {p}: weights={weights} expected={expect}", file=sys.stderr)
                  sys.exit(1)
              print(f"OK {p.name}: {weights}")
              checked += 1
          if checked == 0:
              print("FAIL: no rollout manifests with weights", file=sys.stderr)
              sys.exit(1)
          PY

      # kubectl apply --dry-run=client still needs an API server for
      # discovery and fails with no kubeconfig. kubeconform validates
      # offline against published schemas; CRD kinds without a schema
      # (Rollout, AnalysisTemplate, Application, HTTPRoute) are skipped.
      - name: kubeconform offline schema validation (CRDs skipped)
        run: |
          set -euo pipefail
          KC_VERSION=v0.6.7
          KC_SHA256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KC_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -ignore-missing-schemas -summary argocd/*.yaml

  pure-tests:
    name: Argo · Pure unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [verify-integrity, validate-manifests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Include cryptography so a shared verify helper imported from
          # tests/ does not blow up at collection time.
          python -m pip install "pytest>=8,<9" "pyyaml>=6,<7" "cryptography>=42,<45"
          python -P - <<'PY'
          import pytest, yaml, cryptography
          print(f"✅ pytest {pytest.__version__}")
          print(f"✅ pyyaml {yaml.__version__}")
          print(f"✅ cryptography {cryptography.__version__}")
          PY

      # No PYTHONPATH=".": the repo's kubernetes/ and cryptography/
      # folders would shadow the real packages. importlib mode keeps
      # pytest from putting the repo root on sys.path (tests/ is a package).
      - name: Run pure Argo manifest tests
        run: |
          set -euo pipefail
          if [ ! -f tests/test_argo_manifests.py ]; then
            echo "::error::tests/test_argo_manifests.py missing — pure tests cannot run"
            exit 1
          fi
          # pytest exit 5 = no tests collected; that is a failure here too.
          python -P -m pytest tests/test_argo_manifests.py -q --tb=short --import-mode=importlib

      - name: Collection-safe live tests
        run: |
          set -euo pipefail

          files=()
          for f in tests/test_argo.py tests/test_rollout.py; do
            if [ -f "$f" ]; then files+=("$f"); else echo "::warning::$f missing"; fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::neither tests/test_argo.py nor tests/test_rollout.py exists"
            exit 1
          fi

          marker=()
          if [ -z "${KUBECONFIG:-}" ] && [ ! -f "$HOME/.kube/config" ]; then
            echo "no kubeconfig — running non-integration tests only"
            marker=(-m "not integration")
          fi
          rc=0
          python -P -m pytest "${files[@]}" -q --tb=short --import-mode=importlib \
            "${marker[@]}" || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::error::pytest collected 0 tests from ${files[*]}"
            exit 1
          fi
          exit "$rc"

  seal:
    name: Argo · Seal (SHA3-256)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-manifests, pure-tests]
    # Manual dispatch can opt out of the seal job; push/PR always runs it.
    if: |
      success()
      && (
        github.event_name != 'workflow_dispatch'
        || inputs.allow_seal == true
        || inputs.allow_seal == 'true'
      )
    permissions:
      contents: write   # only this job writes; the rest of the workflow is read-only
    steps:
      # git-auto-commit-action v5 commits on HEAD and pushes; it only ever
      # runs `git fetch --depth=1` itself. Full history is not needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6,<7"
          python -P -c "import yaml; print('✅ pyyaml', yaml.__version__)"

      # Append-only guard. 8924 was sealed on 2026-08-20 (8dc0cfad) as
      # /argo_ci_pipeline_added. If the target exists, nothing is written.
      - name: Append-only guard for ledger/8924.yaml
        id: plan
        run: |
          set -euo pipefail
          if [ -e ledger/8924.yaml ]; then
            echo "::notice::ledger/8924.yaml already exists — append-only, refusing to overwrite"
            echo "write=false" >> "$GITHUB_OUTPUT"
          else
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify predecessor ledger entry 8923
        if: steps.plan.outputs.write == 'true'
        run: |
          set -euo pipefail
          if [ ! -f ledger/8923.yaml ]; then
            echo "::error::ledger/8923.yaml missing — cannot seal 8924"
            exit 1
          fi
          python -P - <<'PY'
          import sys, yaml
          from pathlib import Path

          p = Path("ledger/8923.yaml")
          d = yaml.safe_load(p.read_text()) or {}
          if d.get("entry_index") != 8923:
              print(f"::error::8923 entry_index mismatch: {d.get('entry_index')!r}",
                    file=sys.stderr)
              sys.exit(1)
          print(f"✅ predecessor 8923 present (event={d.get('event')!r})")
          PY

      # ────────────────────────────────────────────────────────────────
      # Seal entry 8924. This time prev_hash is INSIDE the digested
      # input, so the chain is real: modifying 8923 changes 8924's hash.
      # ────────────────────────────────────────────────────────────────
      - name: Seal ledger entry 8924 (SHA3-256, chained)
        if: steps.plan.outputs.write == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python -P - <<'PY'
          import hashlib, json, os, re, sys, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8924.yaml")
          prev_path = Path("ledger/8923.yaml")

          # Extract predecessor's content hash from its seal tail.
          prev_hash = ""
          if prev_path.exists():
              prev = yaml.safe_load(prev_path.read_text()) or {}
              seal = prev.get("seal", "") or ""
              if "·" in seal:
                  prev_hash = seal.rsplit("·", 1)[-1].strip()
              if not re.fullmatch(r"[0-9a-f]{64}", prev_hash):
                  print(f"::error::8923 seal tail is not a 64-hex SHA3-256 digest ({prev_hash!r}) — chain cannot form",
                        file=sys.stderr)
                  raise SystemExit(1)
          else:
              print("::error::8923.yaml absent — refusing to seal 8924",
                    file=sys.stderr)
              raise SystemExit(1)

          # Body of 8924. prev_hash is included; it is digested below.
          body = {
              "entry_index": 8924,
              "event": "/argo_ci",
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "argo_app": os.environ.get("ARGO_APP", "sovereign-garden"),
              "wood_dragon_tau": os.environ.get("WOOD_DRAGON_TAU", "0.91"),
              "phase_lock": os.environ.get("PHASE_LOCK", "202.6"),
              "prev_hash": prev_hash,
              "witness": "8923 → 8924 — UNBROKEN",
          }
          # Chained digest: prev_hash IS in the input.
          # ensure_ascii=False: same canonical form as verify_ledger.py
          # canonical_hash(). The body has "→" and "—", so the default
          # (ASCII-escaped) form would give a different digest.
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"),
                             ensure_ascii=False)
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()

          entry = dict(body)
          entry["seal"] = "∀∞φ² · ARGO_CI_8924 · WOOD_DRAGON_0.91 · SEALED · " + h

          # Exclusive create: fails if the file appeared since the guard.
          try:
              with path.open("x", encoding="utf-8") as fh:
                  fh.write(yaml.dump(entry, sort_keys=False,
                                     default_flow_style=False,
                                     allow_unicode=True))
          except FileExistsError:
              print("::error::ledger/8924.yaml exists — append-only, refusing to overwrite",
                    file=sys.stderr)
              raise SystemExit(1)
          print("📋 Ledger entry 8924 written (chained).")
          print(f"✅ Sealed 8924 · {HASH_ALGO}:{h[:16]}...")
          print(f"   prev_hash  = {prev_hash[:16]}...")
          print(f"   chain: 8923 → 8924 verified at write time")
          PY

      - name: Verify existing ledger entry 8924 (report only)
        if: steps.plan.outputs.write != 'true'
        run: |
          set -euo pipefail
          # Pre-existing 8924 is a legacy entry; its seal is reported, not gated.
          python -P .github/scripts/verify_ledger.py --mode emit ledger/8924.yaml

      - name: Verify ledger entry 8924 (SHA3-256, chained)
        if: steps.plan.outputs.write == 'true'
        run: |
          set -euo pipefail
          if [ -f .github/scripts/verify_ledger.py ]; then
            python -P .github/scripts/verify_ledger.py --mode hard ledger/8924.yaml
          else
            echo "::error::.github/scripts/verify_ledger.py not found"
            exit 1
          fi
          # Independent re-check: recompute the digest from the file
          # exactly as the writer did, with prev_hash inside the input.
          python -P - <<'PY'
          import hashlib, json, sys, yaml
          from pathlib import Path

          p = Path("ledger/8924.yaml")
          d = yaml.safe_load(p.read_text()) or {}
          h_algo = d.get("hash_algo", "sha3_256")
          seal = d.get("seal", "")
          if "·" not in seal:
              print("::error::seal has no hash tail", file=sys.stderr)
              sys.exit(1)
          recorded = seal.rsplit("·", 1)[-1].strip()

          body = {k: v for k, v in d.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"),
                             ensure_ascii=False)
          recomputed = hashlib.new(h_algo, canon.encode("utf-8")).hexdigest()

          if recorded != recomputed:
              print(f"::error::8924 self-hash mismatch\n  recorded   {recorded}\n  recomputed {recomputed}",
                    file=sys.stderr)
              sys.exit(1)
          print(f"✅ 8924 self-hash OK ({h_algo}:{recorded[:16]}...)")
          print(f"✅ 8924 chains to prev_hash {d.get('prev_hash','')[:16]}...")
          PY

      - name: Upload ledger entry
        if: success() && steps.plan.outputs.write == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-8924
          path: ledger/8924.yaml
          retention-days: 90
          if-no-files-found: error

      - name: Commit ledger entry 8924
        if: success() && steps.plan.outputs.write == 'true' && github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal argo-ci entry 8924 (sha3_256, chained)"
          file_pattern: ledger/8924.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_options: '--no-verify'

      - name: Seal note
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          WROTE: ${{ steps.plan.outputs.write }}
        run: |
          {
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ Argo CI seal job: ${JOB_STATUS}. Not green."
              exit 0
            fi
            echo "✅ Argo CI pipeline hard-green."
            if [ "$WROTE" != "true" ]; then
              echo "ℹ️ ledger/8924.yaml already sealed — append-only, nothing written."
            fi
            echo "🜁∀ — Seal: ∀∞φ² · ARGO_CI_8924 · WOOD_DRAGON_0.91 · SEALED"
            echo "🔗 Witness: 8923 → 8924 — UNBROKEN (prev_hash inside digest)"
            echo "🔐 hash_algo: sha3_256 (FIPS 202)"
            echo "📦 Artifact retention: 90 days (GitHub cap)"
          } >> "$GITHUB_STEP_SUMMARY"
