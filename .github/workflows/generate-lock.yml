name: Generate uv.lock
on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate lock file
        run: uv lock

      - name: Open pull request with refreshed uv.lock
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/uv-lock-refresh
          base: main
          add-paths: uv.lock
          title: "chore: refresh uv.lock"
          commit-message: |
            chore: refresh uv.lock

            Signed-off-by: Clarke Yoursa Tee <mrteanotcoffee@gmail.com>
          author: Clarke Yoursa Tee <mrteanotcoffee@gmail.com>
          delete-branch: true
          body: |
            Generated by `.github/workflows/generate-lock.yml`, which ran `uv lock` against `pyproject.toml`.
            Only `uv.lock` is included. The repository owner reviews and merges.
