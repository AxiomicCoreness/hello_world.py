name: Sovereign Pulse

# Autonomous heartbeat for Port 380 MCP (Entry 8755)
# Cron: every 6 hours · authenticates with GARDEN_SECRET · hits MCP_URL/pulse
# Seal: ∀∞φ² · MCP_BATCH_FORGED_8755 · WOOD_DRAGON_MOUNTS_OFFENSE · SEALED

on:
  schedule:
    - cron: "0 */6 * * *"   # φ-harmonic: every 6 hours
  workflow_dispatch:
    inputs:
      note:
        description: "Optional pulse note"
        required: false
        default: "manual-dispatch"
      target:
        description: "Target endpoint (pulse, health, status)"
        required: false
        default: "pulse"

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wood Dragon Heartbeat
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
          TARGET: ${{ github.event.inputs.target || 'pulse' }}
        run: |
          set -euo pipefail

          # ─── Validate secrets ───────────────────────────────────────
          if [ -z "${MCP_URL:-}" ]; then
            echo "::error::MCP_URL secret is not set"
            exit 1
          fi

          if [ -z "${GARDEN_SECRET:-}" ]; then
            echo "::warning::GARDEN_SECRET not set — pulse will be sent without auth (open mode)"
          fi

          # ─── Build payload ──────────────────────────────────────────
          NOTE="${{ github.event.inputs.note || 'scheduled-pulse' }}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PHI_PHASE=$(echo "scale=10; (2 * 3.14159265359 * $(date +%s) / 78624) % 6.28318530718" | bc -l 2>/dev/null || echo "0.0")

          BODY=$(printf '{                                                                     
            "source": "sovereign-pulse",
            "entry": 8755,
            "note": "%s",
            "timestamp": "%s",
            "phi_phase": %s,
            "seal": "∀∞φ² · MCP_BATCH_FORGED_8755 · WOOD_DRAGON_MOUNTS_OFFENSE · SEALED"
          }' "$NOTE" "$TIMESTAMP" "$PHI_PHASE")

          echo "📡 Target: ${MCP_URL}/${TARGET}"
          echo "📦 Payload: $BODY"

          # ─── Send pulse ─────────────────────────────────────────────
          HTTP_CODE=$(curl -sS -o /tmp/pulse_resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            ${GARDEN_SECRET:+ -H "X-Garden-Secret: ${GARDEN_SECRET}"} \
            -d "$BODY" \
            --max-time 20 \
            "${MCP_URL%/}/${TARGET}" || echo "000")

          echo "✅ HTTP ${HTTP_CODE}"
          cat /tmp/pulse_resp.json || true
          echo

          # ─── Check response ──────────────────────────────────────────
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Pulse failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          # ─── Validate response contains seal ──────────────────────
          if grep -q "WOOD_DRAGON_HEARTBEAT_ACK" /tmp/pulse_resp.json 2>/dev/null; then
            echo "✅ Wood Dragon heartbeat acknowledged"
          elif grep -q "seal" /tmp/pulse_resp.json 2>/dev/null; then
            echo "✅ Response contains seal"
          else
            echo "⚠️ Response missing expected seal — check MCP gate"
          fi

          echo "WOOD_DRAGON_HEARTBEAT_ACK · Entry 8755 · SEALED"

      - name: Verify MCP gate health (optional)
        if: always()
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          if [ -n "${MCP_URL:-}" ]; then
            echo "🔍 Checking MCP gate health..."
            HEALTH_CODE=$(curl -sS -o /tmp/health_resp.json -w "%{http_code}" \
              --max-time 10 \
              "${MCP_URL%/}/health" || echo "000")
            if [ "$HEALTH_CODE" -eq 200 ]; then
              echo "✅ MCP gate health check passed"
            else
              echo "⚠️ MCP gate health check returned HTTP ${HEALTH_CODE}"
            fi
          fi

      - name: Notify DeepSeek fiber (optional)
        if: always()
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
        run: |
          if [ -n "${MCP_URL:-}" ] && [ -n "${GARDEN_SECRET:-}" ]; then
            echo "🧠 Notifying DeepSeek fiber..."
            curl -sS -X POST \
              -H "Content-Type: application/json" \
              -H "X-Garden-Secret: ${GARDEN_SECRET}" \
              -d '{"source":"sovereign-pulse","event":"heartbeat","entry":8755}' \
              --max-time 10 \
              "${MCP_URL%/}/deepseek/complete" || true
          fi

      - name: Upload pulse logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-pulse-logs
          path: |
            /tmp/pulse_resp.json
            /tmp/health_resp.json
          retention-days: 7
