name: Sovereign Pulse

# Entry 8755
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          PULSE_ID="pulse_$(date +%s)"
          curl -X POST -H "Content-Type: application/json" -H "X-Garden-Secret: ${{ secrets.GARDEN_SECRET }}" -d "{\"pulse_id\": \"${PULSE_ID}\"}" ${{ secrets.MCP_URL }}/pulse