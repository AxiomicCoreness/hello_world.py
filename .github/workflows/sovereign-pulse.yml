name: Sovereign Pulse

# Entry 8755
# Emits a periodic heartbeat to the MCP gate. Read-only; writes no ledger.
# Seal label only (no terminal hex in this file).
# Policy: NO_LEDGER_WRITE · MCP FILLED=False · bind 127.0.0.1:8024

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-pulse-${{ github.ref }}
  cancel-in-progress: false

env:
  PULSE_SOURCE: sovereign-pulse

jobs:
  pulse:
    name: Pulse · MCP heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send pulse
        id: send
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
          PULSE_SOURCE: ${{ env.PULSE_SOURCE }}
        run: |
          set -euo pipefail

          if [ -z "${MCP_URL:-}" ]; then
            echo "MCP_URL not set — soft skip"
            echo "http_code=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GARDEN_SECRET:-}" ]; then
            echo "GARDEN_SECRET not set — soft skip"
            echo "http_code=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PULSE_ID="pulse_$(date -u +%s)"
          BODY=$(printf '{"pulse_id":"%s","source":"%s"}' "$PULSE_ID" "$PULSE_SOURCE")

          HTTP_CODE=$(curl -sS --max-time 20 \
            -o /tmp/pulse_resp.json -w "%{http_code}" \
            -X POST "${MCP_URL%/}/pulse" \
            -H "Content-Type: application/json" \
            -H "X-Garden-Secret: ${GARDEN_SECRET}" \
            -d "$BODY" || echo "000")

          echo "pulse_id=${PULSE_ID}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"

          echo "pulse_id = ${PULSE_ID}"
          echo "http_code = ${HTTP_CODE}"
          cat /tmp/pulse_resp.json 2>/dev/null || true
          echo

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Pulse returned ${HTTP_CODE} — not fatal (scheduled heartbeat)"
          fi

      - name: Summary
        if: always()
        env:
          PULSE_ID: ${{ steps.send.outputs.pulse_id }}
          HTTP_CODE: ${{ steps.send.outputs.http_code }}
        run: |
          {
            echo "### Sovereign Pulse"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| pulse_id | ${PULSE_ID:-<none>} |"
            echo "| http_code | ${HTTP_CODE:-<skipped>} |"
            echo "| source | ${PULSE_SOURCE} |"
            echo "| schedule | every 6 hours |"
            echo ""
            echo "Policy: read-only · no ledger write · MCP FILLED=False"
          } >> "$GITHUB_STEP_SUMMARY"
