name: Producer Axiom Verify

on:
  push:
    branches: [main]
    paths:
      - "producer_axiom/**"
      - "terminal_axiom/**"
      - "consumer_axiom/**"
      - "tests/test_producer_axiom.py"
      - "tests/test_terminal_axiom.py"
      - "tests/test_consumer_axiom.py"
      - "tests/test_axiom_differential.py"
      - ".github/workflows/producer-axiom-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "producer_axiom/**"
      - "terminal_axiom/**"
      - "consumer_axiom/**"
      - "tests/test_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: T0 + P0 + C0 engines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Test terminal_axiom (T0)
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest tests/test_terminal_axiom.py -v

      - name: Test producer_axiom (P0)
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest tests/test_producer_axiom.py -v

      - name: Test consumer_axiom (C0)
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest tests/test_consumer_axiom.py -v

      - name: Differential T0/P0/C0
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest tests/test_axiom_differential.py -v

      - name: Emit certificates
        run: |
          set -euo pipefail
          PYTHONPATH=. python -c "from terminal_axiom.verification import main; main()"
          PYTHONPATH=. python -c "from producer_axiom.verification import main; main()"
          PYTHONPATH=. python -c "from consumer_axiom.verification import main; main()"
