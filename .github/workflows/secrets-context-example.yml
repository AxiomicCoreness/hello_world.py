name: Sovereign Pulse

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      note:
        description: "Optional pulse note"
        required: false
        default: "scheduled-pulse"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sovereign-pulse.yml"

permissions:
  contents: read
  issues: write
  actions: read

env:
  MCP_URL: ${{ vars.MCP_URL }}
  MCP_CONNECTOR_URL: ${{ vars.MCP_CONNECTOR_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

jobs:
  # ── Original Sovereign Pulse job ─────────────────────────────────────
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml requests

      - name: Verify ledger entry (soft-skip if missing)
        run: |
          set -euo pipefail
          if [ -f "ledger/8978.yaml" ]; then
            python .github/scripts/verify_ledger.py ledger/8978.yaml
          else
            echo "⚠️ ledger/8978.yaml not found — skipping verification"
          fi

      - name: Verify security headers (source)
        run: |
          python -c "
          import sys, pathlib
          p = pathlib.Path('port380_mcp.py')
          if not p.exists():
              print('⚠️ port380_mcp.py missing — skip')
              sys.exit(0)
          content = p.read_text()
          required = ['CORSMiddleware','SecurityHeadersMiddleware','Content-Security-Policy','Strict-Transport-Security']
          missing = [h for h in required if h not in content]
          if missing:
              print(f'❌ Missing headers: {missing}')
              sys.exit(1)
          print('✅ All security headers present')
          "

      - name: Send Sovereign Pulse
        id: pulse
        env:
          NOTE: ${{ github.event.inputs.note || 'scheduled-pulse' }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_URL:-}" ]; then
            echo "::error::MCP_URL is not set"
            exit 1
          fi
          if [ -z "${GARDEN_SECRET:-}" ]; then
            echo "::error::GARDEN_SECRET is not set"
            exit 1
          fi

          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BODY=$(printf '{"source":"sovereign-pulse","entry":8755,"note":"%s","timestamp":"%s","seal":"PULSE"}' "$NOTE" "$TIMESTAMP")

          HTTP_CODE=$(curl -sS -o /tmp/pulse_resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Garden-Secret: ${GARDEN_SECRET}" \
            -d "$BODY" \
            --max-time 20 \
            "${MCP_URL%/}/pulse" || echo "000")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/pulse_resp.json || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Pulse failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "pulse_success=true" >> $GITHUB_OUTPUT

      - name: Write ledger entry 8979 (on success)
        if: success()
        run: |
          mkdir -p ledger
          cat > ledger/8979.yaml << 'EOF'
          entry_index: 8979
          timestamp: ETERNAL_NOW_ANCHORED_TO_2026-08-26
          event: /sovereign_pulse_run
          status: SUCCESS
          seal: "∀∞φ² · SOVEREIGN_PULSE_8979 · WOOD_DRAGON_0.91 · SEALED"
          witness_chain: "8978 → 8979 — UNBROKEN"
          EOF

      - name: Upload pulse response (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-response
          path: /tmp/pulse_resp.json
          retention-days: 7

  # ── Strategy matrix job (secret presence + health/pulse pings) ──────
  pulse-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [health, pulse]
    env:
      MCP_URL: ${{ vars.MCP_URL }}
      GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Presence only (no secret leakage)
        run: |
          set -euo pipefail
          echo "target=${{ matrix.target }}"
          echo "MCP_URL_set=$([ -n \"${MCP_URL:-}\" ] && echo yes || echo no)"
          echo "GARDEN_SECRET_set=$([ -n \"${GARDEN_SECRET:-}\" ] && echo yes || echo no)"
          echo "GH_TOKEN_set=$([ -n \"${GH_TOKEN:-}\" ] && echo yes || echo no)"
          echo "Do not use GARDEN_SECRETS or SUPERSECRET names."

      - name: Optional ping
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "health" ]; then
            curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 20 \
              "${MCP_URL%/}/health" || true
          else
            curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 20 \
              -X POST -H "Content-Type: application/json" \
              ${GARDEN_SECRET:+ -H "X-Garden-Secret: ${GARDEN_SECRET}"} \
              -d '{"source":"strategy-context","entry":8755}' \
              "${MCP_URL%/}/pulse" || true
          fi

      - name: Optional mTLS encryption or quantum chessboard
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          # Check quantum chessboard health (example endpoint, adapt as needed)
          CHESS_URL="${MCP_URL%/}/quantum-chessboard/health"
          echo "Checking quantum chessboard at $CHESS_URL"
          curl -sS -o /tmp/chess_resp.json -w "%{http_code}" --max-time 20 \
            -H "X-Garden-Secret: ${GARDEN_SECRET}" \
            "$CHESS_URL" || true
          # For mTLS, you would add a curl with --cert/--key if needed.
          # This step is non-blocking (uses || true)
