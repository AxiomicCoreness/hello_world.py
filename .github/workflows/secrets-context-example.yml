name: Secrets and strategy context example

# Does not print secret values.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Dispatch note"
        required: false
        default: "manual"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  open-issue:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Example gh issue (disabled)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue --repo "${{ github.repository }}" \
            create --title "Issue title" --body "Issue body"

  pulse-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [health, pulse]
    env:
      MCP_URL: ${{ secrets.MCP_URL }}
      GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Presence only
        run: |
          set -euo pipefail
          echo "target=${{ matrix.target }}"
          echo "MCP_URL_set=$([ -n \"${MCP_URL:-}\" ] && echo yes || echo no)"
          echo "GARDEN_SECRET_set=$([ -n \"${GARDEN_SECRET:-}\" ] && echo yes || echo no)"
          echo "GH_TOKEN_set=$([ -n \"${GH_TOKEN:-}\" ] && echo yes || echo no)"
          echo "Do not use GARDEN_SECRETS or SUPERSECRET names."

      - name: Optional ping
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "health" ]; then
            curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 20 \
              "${MCP_URL%/}/health" || true
          else
            curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 20 \
              -X POST -H "Content-Type: application/json" \
              ${GARDEN_SECRET:+ -H "X-Garden-Secret: ${GARDEN_SECRET}"} \
              -d '{"source":"strategy-context","entry":8755}' \
              "${MCP_URL%/}/pulse" || true
          fi
