name: Sovereign Pulse

# 6-hourly sovereign pulse — verify predecessor → pulse → matrix probe →
# federate → seal. The federate job calls the reusable OIDC workflow.
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_SEAL — writes ledger/8981.yaml only
# witness: 8978 → 8981 — UNBROKEN
#
# ⚠️ Entry index note:
#   `oidc-cloud-providers.yml` already writes ledger/8979.yaml.
#   This workflow therefore writes 8981 (not 8979) to avoid clobbering
#   the OIDC workflow's own seal. The 8980 slot is reserved for
#   sovereign-python-package.yml. The chain thus runs:
#       8978 → 8979   (OIDC, via federate)
#       8979 → 8980   (Sovereign Python Package)
#       8980 → 8981   (this workflow, post-federation)
#
# ⚠️ Federation gating:
#   Cloud trust is not granted to arbitrary push/PR commits. The federate
#   job runs on manual dispatch and on schedule only; push runs skip it.

on:
  schedule:
    - cron: "0 */6 * * *"   # φ-harmonic: every 6 hours
  workflow_dispatch:
    inputs:
      note:
        description: "Optional pulse note"
        required: false
        default: "scheduled-pulse"
      oidc_provider:
        description: "OIDC cloud provider to federate"
        type: choice
        options: [offline, github, aws, gcp, azure]
        default: offline
  push:
    branches: [main]
    paths:
      - ".github/workflows/sovereign-pulse.yml"

permissions:
  contents: write   # required to commit ledger/8981.yaml
  issues: write     # retained from the original draft
  actions: read
  id-token: write   # required for OIDC federation

concurrency:
  group: sovereign-pulse
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  PULSE_ENTRY: "8981"                        # avoids collision with OIDC's 8979
  PREDECESSOR_ENTRY: "8978"
  MCP_URL: ${{ secrets.MCP_URL }}            # unified with sibling workflows
  MCP_CONNECTOR_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. PULSE — verify predecessor, pulse MCP, seal ledger entry
  # ──────────────────────────────────────────────────────────────
  pulse:
    name: Sovereign pulse · MCP ping · Seal (Entry 8981)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml requests

      # ── 0a. SHA3-256 integrity gate over the full ledger ──
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "⚠️ no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" "${entries[@]}"
          else
            echo "⚠️ no verify_ledger.py — soft skip"
          fi

      # ── 0b. Structural check of the predecessor ──
      - name: Verify predecessor ledger entry (soft-skip if missing)
        run: |
          set -euo pipefail
          p="ledger/${PREDECESSOR_ENTRY}.yaml"
          if [ -f "$p" ]; then
            if [ -f .github/scripts/verify_ledger.py ]; then
              python .github/scripts/verify_ledger.py "$p"
            elif [ -f scripts/verify_ledger.py ]; then
              python scripts/verify_ledger.py "$p"
            else
              echo "⚠️ no verifier — structural check only"
            fi
          else
            echo "⚠️ $p not found — soft skip (federation may not have run yet)"
          fi

      # ── 0c. Source security-header check ──
      - name: Verify security headers (source)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          p = Path("port380_mcp.py")
          if not p.exists():
              print("⚠️ port380_mcp.py missing — soft skip")
              sys.exit(0)

          content = p.read_text()
          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"❌ Missing headers: {missing}")
              sys.exit(1)
          print("✅ All security headers present")
          PY

      # ── 1. Send the pulse ──
      - name: Send Sovereign Pulse
        id: pulse
        env:
          NOTE: ${{ inputs.note || 'scheduled-pulse' }}
        run: |
          set -euo pipefail

          if [ -z "${MCP_URL:-}" ]; then
            echo "::error::MCP_URL is not set"
            exit 1
          fi
          if [ -z "${GARDEN_SECRET:-}" ]; then
            echo "::error::GARDEN_SECRET is not set"
            exit 1
          fi

          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # Build the body with jq (installed on ubuntu-latest).
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          BODY=$(jq -n \
            --arg src "sovereign-pulse" \
            --argjson entry "${PULSE_ENTRY}" \
            --arg note "${NOTE}" \
            --arg ts "${TIMESTAMP}" \
            '{
              source: $src,
              entry: $entry,
              note: $note,
              timestamp: $ts,
              seal: "∀∞φ² · PULSE · WOOD_DRAGON_0.91 · SEALED"
            }')

          HTTP_CODE=$(curl -sS -o /tmp/pulse_resp.json -w "%{http_code}" \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Garden-Secret: ${GARDEN_SECRET}" \
            -d "$BODY" \
            "${MCP_URL%/}/pulse" || echo "000")

          echo "HTTP ${HTTP_CODE}"
          if [ -s /tmp/pulse_resp.json ]; then
            cat /tmp/pulse_resp.json
            echo
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Pulse failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "pulse_success=true" >> "$GITHUB_OUTPUT"

      # ── 2. Seal ledger entry 8981 (SHA3-256) ──
      - name: Seal ledger entry 8981 (SHA3-256)
        if: success()
        env:
          PULSE_NOTE: ${{ inputs.note || 'scheduled-pulse' }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8981.yaml")

          entry = {
              "entry_index": 8981,
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "event": "/sovereign_pulse_run",
              "status": "SUCCESS",
              "hash_algo": HASH_ALGO,
              "pulse_note": os.environ.get("PULSE_NOTE", "scheduled-pulse"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME", "schedule"),
              "witness": "8980 → 8981 — UNBROKEN",
              "witness_chain": "8980 → 8981 — UNBROKEN",
              "seal": "∀∞φ² · SOVEREIGN_PULSE_8981 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 8981 written.")
          print(f"✅ Sealed 8981 · {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify ledger entry 8981 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8981.yaml
          else
            echo "⚠️ no verify_ledger.py — soft skip"
          fi

      - name: Upload pulse response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-response
          path: /tmp/pulse_resp.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload ledger entry 8981
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-8981
          path: ledger/8981.yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Commit ledger entry 8981
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal sovereign-pulse entry 8981 (sha3_256)"
          file_pattern: ledger/8981.yaml
          commit_options: '--no-verify'

      - name: Summary
        if: always()
        env:
          PULSE_NOTE: ${{ inputs.note || 'scheduled-pulse' }}
        run: |
          {
            echo "✅ Sovereign Pulse completed."
            echo "🜁∀ — Seal: ∀∞φ² · SOVEREIGN_PULSE_8981 · WOOD_DRAGON_0.91 · SEALED"
            echo "🔐 hash_algo: ${HASH_ALGO}"
            echo "📍 entry: ${PULSE_ENTRY} · note: ${PULSE_NOTE}"
            echo "🔗 Witness: 8980 → 8981 — UNBROKEN"
            echo "📄 ledger_policy: WRITE_VIA_SEAL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────
  # 2. PULSE-MATRIX — health / pulse probes across targets
  # ──────────────────────────────────────────────────────────────
  pulse-matrix:
    name: Pulse matrix · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: pulse
    strategy:
      fail-fast: false
      matrix:
        target: [health, pulse]
    env:
      MCP_URL: ${{ secrets.MCP_URL }}
      GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Presence only (no secret leakage)
        run: |
          set -euo pipefail
          echo "target=${{ matrix.target }}"
          if [ -n "${MCP_URL:-}" ]; then echo "MCP_URL_set=yes"; else echo "MCP_URL_set=no"; fi
          if [ -n "${GARDEN_SECRET:-}" ]; then echo "GARDEN_SECRET_set=yes"; else echo "GARDEN_SECRET_set=no"; fi
          if [ -n "${GH_TOKEN:-}" ]; then echo "GH_TOKEN_set=yes"; else echo "GH_TOKEN_set=no"; fi

      - name: Optional ping
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "health" ]; then
            curl -sS -o /tmp/out.json -w "health %{http_code}\n" --max-time 20 \
              "${MCP_URL%/}/health" || true
          else
            if [ -n "${GARDEN_SECRET:-}" ]; then
              curl -sS -o /tmp/out.json -w "pulse %{http_code}\n" --max-time 20 \
                -X POST \
                -H "Content-Type: application/json" \
                -H "X-Garden-Secret: ${GARDEN_SECRET}" \
                -d '{"source":"strategy-context","entry":8981}' \
                "${MCP_URL%/}/pulse" || true
            else
              echo "⚠️ GARDEN_SECRET unset — pulse skipped"
            fi
          fi
          if [ -s /tmp/out.json ]; then
            head -c 1024 /tmp/out.json
            echo
          fi

      - name: Quantum chessboard probe (non-blocking)
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          CHESS_URL="${MCP_URL%/}/quantum-chessboard/health"
          echo "Checking quantum chessboard at ${CHESS_URL}"
          curl -sS -o /tmp/chess_resp.json -w "chessboard %{http_code}\n" --max-time 20 \
            -H "X-Garden-Secret: ${GARDEN_SECRET:-}" \
            "$CHESS_URL" || echo "⚠️ chessboard probe non-fatal"
          if [ -s /tmp/chess_resp.json ]; then
            head -c 1024 /tmp/chess_resp.json
            echo
          fi

  # ──────────────────────────────────────────────────────────────
  # 3. FEDERATE — reusable OIDC workflow (manual dispatch only)
  # ──────────────────────────────────────────────────────────────
  federate:
    name: OIDC federation · ${{ inputs.oidc_provider || 'offline' }}
    needs: [pulse, pulse-matrix]
    if: |
      github.event_name == 'workflow_dispatch'
      && needs.pulse.result == 'success'
      && needs.pulse-matrix.result == 'success'
    uses: ./.github/workflows/oidc-cloud-providers.yml
    with:
      provider: ${{ inputs.oidc_provider || 'offline' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # 4. POST-FEDERATION SUMMARY
  # ──────────────────────────────────────────────────────────────
  summary:
    name: Post-federation summary
    runs-on: ubuntu-latest
    needs: [pulse, pulse-matrix, federate]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "### Sovereign Pulse"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| pulse | ${{ needs.pulse.result }} |"
            echo "| pulse-matrix | ${{ needs.pulse-matrix.result }} |"
            echo "| federate | ${{ needs.federate.result }} |"
            echo ""
            echo "- Seal: \`∀∞φ² · SOVEREIGN_PULSE_8981 · WOOD_DRAGON_0.91 · SEALED\`"
            echo "- Witness: \`8980 → 8981 — UNBROKEN\`"
            echo "- Ledger policy: WRITE_VIA_SEAL (entry 8981 only)"
            echo "- Federation: manual dispatch only (cloud trust not granted to push/PR)"
            echo "- OIDC provider: \`${{ inputs.oidc_provider || 'offline' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
