name: Docker image from main only

# axiomic/sovereign-engine:latest is produced exclusively from main.
# Feature-branch pushes do not retag :latest.
# Entry 8818 — includes security header verification.
# Seal: ∀∞φ² · DOCKER_MAIN_8818 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8817 → 8818 — UNBROKEN

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "requirements*.txt"
      - "orchestrator/**"
      - "port380_mcp.py"
      - "hello_world.py"
      - "quantum/**"
      - "deepseek/**"
      - "scripts/docker_build_push_main.sh"
      - ".github/workflows/docker_main_image.yml"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "docker build --no-cache"
        type: boolean
        default: false
      push:
        description: "Push to registry (needs DOCKERHUB_* secrets)"
        type: boolean
        default: true

concurrency:
  group: docker-main-latest
  cancel-in-progress: true

env:
  IMAGE: axiomic/sovereign-engine:latest
  WOOD_DRAGON_TAU: "0.91"
  PHASE_LOCK: "202.6"

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refuse non-main source
        run: |
          set -e
          REF="$(git rev-parse --abbrev-ref HEAD)"
          SHA="$(git rev-parse HEAD)"
          echo "building from ref=$REF sha=$SHA"
          if [ "$REF" != "main" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            git checkout main || git checkout -B main origin/main
          fi
          echo "source locked to main: $(git rev-parse HEAD)"

      # ────────────────────────────────────────────────────────────────
      # SECURITY HEADER VERIFICATION (source code)
      # Ensures the image will enforce CORS, CSP, HSTS, etc.
      # ────────────────────────────────────────────────────────────────
      - name: Verify security headers in FastAPI middleware (source)
        run: |
          python -c "
          import sys
          with open('port380_mcp.py', 'r') as f:
              content = f.read()
              required = [
                  'CORSMiddleware',
                  'SecurityHeadersMiddleware',
                  'Content-Security-Policy',
                  'Strict-Transport-Security',
                  'X-Content-Type-Options',
                  'X-Frame-Options',
                  'Referrer-Policy',
                  'Permissions-Policy'
              ]
              for header in required:
                  if header not in content:
                      print(f'❌ Missing {header} in port380_mcp.py')
                      sys.exit(1)
          print('✅ All security headers present in port380_mcp.py')
          "

      # ────────────────────────────────────────────────────────────────
      # DOCKER BUILD & PUSH
      # ────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build (and push if credentials present)
        env:
          NO_CACHE: ${{ github.event.inputs.no_cache || 'false' }}
          DO_PUSH: ${{ github.event.inputs.push || 'true' }}
        run: |
          set -e
          ARGS=()
          if [ "$NO_CACHE" = "true" ]; then ARGS+=(--no-cache); fi
          docker build "${ARGS[@]}" -t "$IMAGE" .
          if [ "$DO_PUSH" = "true" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            docker push "$IMAGE"
            echo "pushed $IMAGE from main"
          else
            echo "build only — push skipped (no token or push=false)"
          fi

      # ────────────────────────────────────────────────────────────────
      # LEDGER ENTRY 8818 (record build)
      # ────────────────────────────────────────────────────────────────
      - name: Write ledger entry 8818
        run: |
          mkdir -p ledger
          cat > ledger/8818.yaml << 'EOF'
          entry_index: 8818
          event: /docker_build_main
          status: SUCCESS
          timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          image: ${{ env.IMAGE }}
          source: main
          commit: $(git rev-parse HEAD)
          security_headers: VERIFIED
          seal: "∀∞φ² · DOCKER_MAIN_8818 · WOOD_DRAGON_0.91 · SEALED"
          witness: "8817 → 8818 — UNBROKEN"
          EOF
          echo "📋 Ledger entry 8818 written."

      - name: Summary
        run: |
          echo "✅ Docker image built from main." >> $GITHUB_STEP_SUMMARY
          echo "🜁∀ — Seal: ∀∞φ² · DOCKER_MAIN_8818 · WOOD_DRAGON_0.91 · SEALED" >> $GITHUB_STEP_SUMMARY
          echo "🛡️ Security headers verified (CORS, CSP, HSTS, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Witness: 8817 → 8818 — UNBROKEN" >> $GITHUB_STEP_SUMMARY
