name: Python Package

on:
  push:
    branches:
      - main
      - deepseek
      - deepseek-ci
      - deepseek-cd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run reward protocol tests
        run: |
          python -m pytest tests/test_reward_protocol.py -v

      - name: Compute reward pool
        run: |
          python -m fiduciary_node_rewards

      - name: Verify reward pool
        run: |
          python -c "from fiduciary_node_rewards import verify_reward_pool; ok, total = verify_reward_pool(); print(f'Pool: {total:.10f}, OK: {ok}'); assert ok, 'Reward pool verification failed'"
