name: DeepSeek CI Secrets

# Validates secret presence (booleans only) and DeepSeek lattice probe.
# Online API call runs only when DEEPSEEK_API_KEY is configured.
# Seal: ∀∞φ² · CI_SECRETS_8832 · WOOD_DRAGON_0.91 · SEALED

on:
  push:
    branches: [main]
    paths:
      - "quantum/deepseek_mesh/**"
      - "deepseek/**"
      - "contracts/ci-secrets.yaml"
      - ".github/workflows/deepseek-ci-secrets.yml"
      - "docs/github-actions-secrets.md"
  pull_request:
    branches: [main]
    paths:
      - "quantum/deepseek_mesh/**"
      - "deepseek/**"
      - "contracts/ci-secrets.yaml"
      - ".github/workflows/deepseek-ci-secrets.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 */12 * * *"

permissions:
  contents: read

jobs:
  secrets-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
      MCP_URL: ${{ secrets.MCP_URL }}
      GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic || true

      - name: Secret presence (never print values)
        run: |
          set -euo pipefail
          echo "=== CI secret inventory (boolean) ==="
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then echo "DEEPSEEK_API_KEY=present"; else echo "DEEPSEEK_API_KEY=missing"; fi
          if [ -n "${MCP_URL:-}" ]; then echo "MCP_URL=present"; else echo "MCP_URL=missing"; fi
          if [ -n "${GARDEN_SECRET:-}" ]; then echo "GARDEN_SECRET=present"; else echo "GARDEN_SECRET=missing"; fi
          echo "DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}"
          echo "DEEPSEEK_MODEL=${DEEPSEEK_MODEL}"
          echo "=== end inventory ==="

      - name: Offline lattice probe (must pass)
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from quantum.deepseek_mesh.dsh_adapter import probe, complete
          p = probe()
          assert "modes" in p and "offline" in p["modes"]
          assert "deepseek" in p["modes"] and "dsh" in p["modes"]
          r = complete("ci-offline-ping", prefer="offline")
          assert r.mode == "offline", r.mode
          print("probe", {k: p[k] for k in ("dsh_sdk", "api_key_set", "model", "modes")})
          print("offline_ok", r.mode)
          PY

      - name: Online DeepSeek probe (skip if no key)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from quantum.deepseek_mesh.dsh_adapter import complete, probe
          p = probe()
          assert p.get("api_key_set"), "key expected in this step"
          r = complete("reply with the single word: pong", prefer="deepseek", max_tokens=16)
          print("online_mode", r.mode)
          print("online_latency_ms", round(r.latency_ms, 1))
          # soft: network may fail; offline fallback still acceptable if annotated
          assert r.mode in ("deepseek", "offline", "dsh"), r.mode
          if r.mode == "offline" and r.meta and r.meta.get("fallback_reason"):
              print("fallback_reason", r.meta.get("fallback_reason"))
          PY

      - name: Pulse reachability (skip if no MCP_URL)
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 15 "${MCP_URL%/}/health" || echo 000)
          echo "health_http=$code"
          cat /tmp/health.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::MCP health not 200 — gate may be cold-starting on free tier"
          fi
