#!/usr/bin/env python3
from __future__ import annotations

import argparse
import hashlib
import json
import os
import re
import sys
from dataclasses import dataclass, field
from typing import Any, Dict, Iterable, List, Optional

try:
    import yaml
    HAVE_YAML = True
except ImportError:
    HAVE_YAML = False

REQUIRED_FIELDS = ("entry_index", "event", "seal", "witness_chain")
KNOWN_SERIES_PREFIXES = ("00", "51", "82", "83", "88", "89", "90", "91", "92")
WITNESS_RE = re.compile(r"^\s*(\d{3,6})\s*[→>\-]+\s*(\d{3,6})")
GENESIS_ANCHORS = {"0000"}
DELIMITER = "·"


@dataclass
class Entry:
    path: str
    index: str
    series: str
    data: Dict[str, Any]
    seal_ok: Optional[bool] = None
    seal_computed: Optional[str] = None
    chain_prev: Optional[str] = None
    chain_next: Optional[str] = None
    notes: List[str] = field(default_factory=list)


def _iter_yaml_files(ledger_dir: str) -> Iterable[str]:
    if not os.path.isdir(ledger_dir):
        raise FileNotFoundError(ledger_dir)
    for name in sorted(os.listdir(ledger_dir)):
        if name.endswith((".yaml", ".yml")):
            yield os.path.join(ledger_dir, name)


def _load_yaml_file(path: str) -> List[Dict[str, Any]]:
    with open(path, "r", encoding="utf-8") as f:
        text = f.read()
    if not HAVE_YAML:
        raise RuntimeError("PyYAML required to load ledger YAML files")
    docs = list(yaml.safe_load_all(text))
    out = [d for d in docs if isinstance(d, dict) and d]
    if not out:
        print(f"::warning file={path}::no mapping documents in file")
    return out


def _series_of(index: str) -> str:
    """First two digits of the zero-padded index."""
    return index.zfill(4)[:2]


def load_entries(ledger_dir: str,
                 wanted_series: Optional[List[str]] = None) -> List[Entry]:
    entries: List[Entry] = []
    for path in _iter_yaml_files(ledger_dir):
        try:
            docs = _load_yaml_file(path)
        except Exception as e:
            print(f"::error::failed to parse {path}: {e}")
            continue
        for doc in docs:
            raw_index = doc.get("entry_index")
            if raw_index is None:
                continue
            index = str(raw_index).zfill(4)
            series = _series_of(index)
            if wanted_series and series not in wanted_series:
                continue
            entries.append(Entry(path=path, index=index,
                                 series=series, data=doc))
    return entries


def _canonical_json(data: Dict[str, Any]) -> str:
    return json.dumps(data, sort_keys=True,
                      separators=(",", ":"), ensure_ascii=False)


def compute_seal_variants(data: Dict[str, Any]) -> Dict[str, str]:
    """Return every digest convention the ledger has used.

    A: hash(body without seal)
    B: hash(body without seal, prev_hash, witness_chain)
    C: hash(body without seal, timestamp)
    """
    def _hash(payload: Dict[str, Any]) -> str:
        canon = json.dumps(payload, sort_keys=True,
                           separators=(",", ":"), ensure_ascii=False)
        return hashlib.sha3_256(canon.encode("utf-8")).hexdigest()

    without_seal = {k: v for k, v in data.items() if k != "seal"}
    without_seal_witness = {k: v for k, v in without_seal.items()
                            if k not in ("prev_hash", "witness_chain")}
    without_seal_ts = {k: v for k, v in without_seal.items()
                       if k != "timestamp"}
    return {
        "A": _hash(without_seal),
        "B": _hash(without_seal_witness),
        "C": _hash(without_seal_ts),
    }


def compute_seal(data: Dict[str, Any]) -> str:
    return compute_seal_variants(data)["A"]


def seal_field_matches(data: Dict[str, Any], computed: str) -> bool:
    seal = data.get("seal", "")
    if not isinstance(seal, str):
        return False
    if seal.strip() == computed:
        return True
    parts = [p.strip() for p in seal.split(DELIMITER)]
    if parts and parts[-1] == computed:
        return True
    return False


def check_required_fields(entries: List[Entry]) -> int:
    bad = 0
    for e in entries:
        missing = [f for f in REQUIRED_FIELDS if f not in e.data]
        if missing:
            print(f"::error file={e.path}::entry {e.index} "
                  f"missing fields: {missing}")
            bad += 1
    return bad


def check_seals(entries: List[Entry], strict: bool = False) -> int:
    bad = 0
    for e in entries:
        variants = compute_seal_variants(e.data)
        e.seal_computed = variants["A"]
        matches = {name: seal_field_matches(e.data, h)
                   for name, h in variants.items()}
        ok = any(matches.values())
        e.seal_ok = ok
        if not ok:
            bad += 1
            level = "error" if strict else "warning"
            print(f"::{level} file={e.path}::entry {e.index} seal mismatch")
            for name, h in variants.items():
                print(f"        variant {name}: {h}")
            print(f"        seal field:      {e.data.get('seal')}")
    return bad


def check_chains(entries: List[Entry]) -> int:
    by_series: Dict[str, List[Entry]] = {}
    for e in entries:
        by_series.setdefault(e.series, []).append(e)

    bad = 0
    for series, group in sorted(by_series.items()):
        group.sort(key=lambda x: x.index)
        print(f"── series {series}: {len(group)} entries "
              f"({group[0].index}..{group[-1].index})")

        for i, e in enumerate(group):
            m = WITNESS_RE.match(str(e.data.get("witness_chain", "")))
            if not m:
                print(f"::error file={e.path}::entry {e.index} "
                      f"unparseable witness_chain: "
                      f"{e.data.get('witness_chain')!r}")
                bad += 1
                continue
            prev, nxt = m.group(1).zfill(4), m.group(2).zfill(4)
            e.chain_prev, e.chain_next = prev, nxt

            if nxt != e.index:
                print(f"::error file={e.path}::entry {e.index} "
                      f"chain arrow target {nxt} != index {e.index}")
                bad += 1
                continue

            if i > 0:
                prev_entry = group[i - 1]
                if prev_entry.chain_next != e.index:
                    print(f"::error file={e.path}::entry {e.index} "
                          f"previous series entry {prev_entry.index} "
                          f"points at {prev_entry.chain_next}, "
                          f"expected {e.index}")
                    bad += 1
                try:
                    gap = int(e.index) - int(prev_entry.index)
                except ValueError:
                    gap = 1
                if gap != 1:
                    print(f"::warning file={e.path}::series {series} gap "
                          f"{prev_entry.index} → {e.index} (gap={gap})")

            if e.index not in GENESIS_ANCHORS:
                if _series_of(prev) != series:
                    print(f"::warning file={e.path}::entry {e.index} "
                          f"prev {prev} is not in series {series}")
    return bad


def check_reward_pool(entries: List[Entry]) -> int:
    try:
        import fiduciary_node_rewards as fnr
    except ImportError:
        print("── reward-pool check skipped "
              "(fiduciary_node_rewards not importable)")
        return 0

    if not hasattr(fnr, "verify_reward_pool"):
        print("::warning::fiduciary_node_rewards lacks verify_reward_pool "
              "— skipped")
        return 0

    try:
        result = fnr.verify_reward_pool()
    except Exception as e:
        print(f"::error::verify_reward_pool raised: {e}")
        return 1

    if isinstance(result, tuple) and len(result) == 2:
        ok, total = result
    else:
        print(f"::warning::verify_reward_pool returned unexpected shape: "
              f"{result!r}")
        return 0

    try:
        total_f = float(total)
    except (TypeError, ValueError):
        print(f"::warning::reward total not numeric: {total!r}")
        return 0

    declared_value = None
    for e in entries:
        v = e.data.get("reward_pool") or e.data.get("declared_pool")
        if v is None:
            continue
        try:
            declared_value = float(v)
        except (TypeError, ValueError):
            continue
        break

    print(f"── reward pool: verify_reward_pool -> ok={ok}, "
          f"total={total_f:.10f}")
    if declared_value is not None:
        match = abs(declared_value - total_f) < 1e-6
        print(f"                declared value in ledger: "
              f"{declared_value:.10f} (match={match})")
    return 0 if ok else 1


def main(argv: Optional[List[str]] = None) -> int:
    ap = argparse.ArgumentParser(description="Verify sovereign ledger chains.")
    ap.add_argument("--root", default=".",
                    help="Repository root (default: .)")
    ap.add_argument("--ledger-dir", default=None,
                    help="Ledger directory (default: <root>/ledger)")
    ap.add_argument("--series", action="append", default=None,
                    help="Restrict to a series prefix (e.g. --series 88)")
    ap.add_argument("--strict-seals", action="store_true",
                    help="Treat seal mismatches as errors (default: warnings)")
    ap.add_argument("--no-reward-check", action="store_true",
                    help="Skip the fiduciary_node_rewards cross-check")
    ap.add_argument("--emit", metavar="PATH",
                    help="Print diagnostics for one entry and exit 0")
    args = ap.parse_args(argv)

    root = os.path.abspath(args.root)
    ledger_dir = args.ledger_dir or os.path.join(root, "ledger")

    if args.emit:
        return _emit_one(args.emit)

    if not os.path.isdir(ledger_dir):
        print(f"::error::ledger directory not found: {ledger_dir}")
        return 2

    print(f"verify_ledger — root={root}")
    print(f"                ledger_dir={ledger_dir}")

    entries = load_entries(ledger_dir, wanted_series=args.series)
    if not entries:
        print("::error::no entries found")
        return 2

    print(f"                loaded {len(entries)} entries")

    total_bad = 0
    total_bad += check_required_fields(entries)
    total_bad += check_seals(entries, strict=args.strict_seals)
    total_bad += check_chains(entries)

    if not args.no_reward_check:
        total_bad += check_reward_pool(entries)

    print()
    if total_bad == 0:
        print("✅ ledger verified — all chains intact, all seals match")
        return 0
    print(f"❌ ledger verification failed with {total_bad} issue(s)")
    return 1


def _emit_one(path: str) -> int:
    p = os.path.abspath(path)
    if not os.path.isfile(p):
        print(f"— {p}: not found")
        return 0
    try:
        with open(p, "r", encoding="utf-8") as f:
            data = yaml.safe_load(f) or {}
    except Exception as e:
        print(f"— {p}: parse error: {e}")
        return 0
    if not isinstance(data, dict):
        print(f"— {p}: not a mapping")
        return 0

    variants = compute_seal_variants(data)
    declared = data.get("seal", "(none)")
    regime = "(none)"
    for name, h in variants.items():
        if seal_field_matches(data, h):
            regime = name
            break

    print(f"— {p}")
    print(f"   entry_index:   {data.get('entry_index')}")
    print(f"   event:         {data.get('event')}")
    print(f"   declared:      {declared}")
    print(f"   computed A:    {variants['A']}")
    print(f"   computed B:    {variants['B']}")
    print(f"   computed C:    {variants['C']}")
    print(f"   regime:        {regime}")
    print(f"   north_star:    "
          f"{data.get('north_star', '71.975 Hz · 202.6° · W=0.0 · C=1.0')}")
    return 0


if __name__ == "__main__":
    sys.exit(main())
