name: debug-environment

# Diagnostic workflow — prints runner state, secret presence (never the
# values), and filesystem layout. Read-only; writes nothing; commits nothing.
#
# hash_algo: sha3_256 (FIPS 202) — declared for header consistency
# ledger_policy: NO_LEDGER_WRITE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-environment-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger

jobs:
  debug:
    name: Debug environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Debug environment
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          echo "::group::Debug environment"
          echo "runner.os         = ${{ runner.os }}"
          echo "github.ref        = ${{ github.ref }}"
          echo "github.sha        = ${{ github.sha }}"
          echo "github.event_name = ${{ github.event_name }}"

          echo "── secrets (presence only, never printed) ──"
          for name in MCP_URL GARDEN_SECRET ARGOCD_SERVER ARGOCD_AUTH_TOKEN AWS_ROLE_ARN; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "  ${name}          = SET (length ${#value})"
            else
              echo "  ${name}          = not set"
            fi
          done

          echo "── env ──"
          echo "  HASH_ALGO        = ${HASH_ALGO:-<unset>}"
          echo "  LEDGER_DIR       = ${LEDGER_DIR:-<unset>}"

          echo "── filesystem ──"
          if [ -d "${LEDGER_DIR:-ledger}" ]; then
            count=$(find "${LEDGER_DIR:-ledger}" -maxdepth 1 -type f | wc -l)
            echo "  ${LEDGER_DIR:-ledger}/  (directory, ${count} files)"
            ls -la "${LEDGER_DIR:-ledger}/"
          else
            echo "  ${LEDGER_DIR:-ledger}/  not found"
          fi

          if [ -f port380_mcp.py ]; then
            echo "  port380_mcp.py (file)"
            ls -la port380_mcp.py
          else
            echo "  port380_mcp.py  not found"
          fi

          if [ -d scripts ]; then
            count=$(find scripts -maxdepth 1 -type f | wc -l)
            echo "  scripts/ (directory, ${count} files)"
            ls -la scripts/ | head -n 40
            if [ "$count" -gt 40 ]; then
              echo "  … (${count} total, showing first 40)"
            fi
          else
            echo "  scripts/  not found"
          fi
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          {
            echo "### debug-environment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| runner.os | ${{ runner.os }} |"
            echo "| github.ref | \`${{ github.ref }}\` |"
            echo "| github.sha | \`${{ github.sha }}\` |"
            echo "| github.event_name | ${{ github.event_name }} |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| ledger_policy | NO_LEDGER_WRITE |"
          } >> "$GITHUB_STEP_SUMMARY"
