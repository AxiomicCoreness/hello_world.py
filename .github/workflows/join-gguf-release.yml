name: join-gguf-release

# Branch ci/join-1p8b-gguf only (dispatched with --ref): joins the plain-split 1.8B GGUF parts
# (deepseek-r2-1p8b-Q4_K_M.gguf.partNN, sums in PARTS.SHA256SUMS) on the release and uploads the
# single verified GGUF. The box's egress could not upload the 1.26 GB file in one request.
# main's copy (1.5B tar.gz parts) is unchanged.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding the split GGUF parts
        required: true
        default: model-deepseek-r2-1p8b-q4km-v1

permissions:
  contents: write

jobs:
  join:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      GGUF_SHA256: f19e0c500c4f734c6e8860e9f6e730e36d544c5f9500f74dce5339b188253af4
      GGUF_SIZE: "1259979680"
      GGUF: deepseek-r2-1p8b-Q4_K_M.gguf
    steps:
      - name: Download parts and PARTS.SHA256SUMS
        run: |
          set -euo pipefail
          mkdir work && cd work
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${GGUF}.part*" -p PARTS.SHA256SUMS
          ls -l
      - name: Verify parts
        working-directory: work
        run: |
          set -euo pipefail
          test "$(wc -l < PARTS.SHA256SUMS)" -eq 13
          test "$(ls ${GGUF}.part* | wc -l)" -eq 13
          sha256sum -c --strict PARTS.SHA256SUMS
      - name: Join and verify GGUF
        working-directory: work
        run: |
          set -euo pipefail
          ls ${GGUF}.part* | LC_ALL=C sort | xargs cat > "$GGUF"
          rm -f ${GGUF}.part*
          size=$(stat -c %s "$GGUF")
          test "$size" = "$GGUF_SIZE" || { echo "size $size != $GGUF_SIZE"; exit 1; }
          echo "${GGUF_SHA256}  ${GGUF}" | sha256sum -c --strict
      - name: Upload single GGUF to release
        working-directory: work
        run: |
          set -euo pipefail
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$GGUF"
