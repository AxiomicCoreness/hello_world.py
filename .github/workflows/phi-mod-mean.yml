name: phi-mod-mean
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assert-mean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: hard assert
        run: python3 scripts/phi_mod_mean.py
