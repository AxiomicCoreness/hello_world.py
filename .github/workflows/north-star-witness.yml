name: North Star Witness

on:
  push:
    branches: [main, master, deepseek, grok, mistral]
    paths:
      - "ledger/**.yaml"
      - "docs/COSMIC_ALIGNMENT_POLICY.md"
      - ".github/scripts/verify_ledger.py"
      - ".github/workflows/north-star-witness.yml"
      - ".github/workflows/deepseek-cd.yml"
  pull_request:
    paths:
      - "ledger/**.yaml"
      - "docs/COSMIC_ALIGNMENT_POLICY.md"
      - ".github/scripts/verify_ledger.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  north-star:
    name: North Star · 71.975 Hz · scoped alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Emit — latest ledger digests
        run: |
          set -euo pipefail
          LATEST=$(ls ledger/*.yaml | sort -V | tail -1)
          echo "Latest ledger: $LATEST"
          python .github/scripts/verify_ledger.py --emit "$LATEST"

      - name: Soft verify — all ledger entries (warn only)
        run: |
          set -euo pipefail
          python .github/scripts/verify_ledger.py --soft ledger/*.yaml

      - name: Hard verify — sealed set
        run: |
          set -euo pipefail
          # Hard: 9240, 9242, 9243, 9244, 9245
          # Soft intentional: 9241 (H_9241 = 33ba0b83…e16f5e) — hard only if file present
          for f in ledger/9240.yaml ledger/9242.yaml ledger/9243.yaml ledger/9244.yaml ledger/9245.yaml; do
            if [ -f "$f" ]; then
              python .github/scripts/verify_ledger.py --hard "$f"
            else
              echo "⚠️ $f missing — soft skip"
            fi
          done
          if [ -f ledger/9241.yaml ]; then
            echo "9241 present — hard verify (optional soft gap closed)"
            python .github/scripts/verify_ledger.py --hard ledger/9241.yaml
          else
            echo "9241 absent — intentional soft gap (documented in 9245)"
          fi

      - name: Scoped vocabulary guard (fail-closed, path-limited)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Fail-closed only on these paths — never repo-wide grep
          SCOPED = [
              Path("docs/COSMIC_ALIGNMENT_POLICY.md"),
              Path(".github/workflows/deepseek-cd.yml"),
              Path("ledger/9238.yaml"),
              Path("ledger/9244.yaml"),
          ]
          POLICY_TOKENS = ("φ", "LUMERIS", "STARFIRE", "Eternal Now", "Never remove")

          for p in SCOPED:
              if not p.exists():
                  # deepseek-cd.yml may be absent on main — soft for that path only
                  if p.name == "deepseek-cd.yml":
                      print(f"soft skip absent {p}")
                      continue
                  raise SystemExit(f"FAIL: required scoped path missing: {p}")
              text = p.read_text(encoding="utf-8")
              if p.name == "COSMIC_ALIGNMENT_POLICY.md":
                  for tok in POLICY_TOKENS:
                      if tok not in text:
                          raise SystemExit(f"FAIL: {p} missing token {tok!r}")
              elif p.name.endswith(".yaml"):
                  if "cosmic_alignment" not in text and "/cosmic_alignment" not in text:
                      raise SystemExit(f"FAIL: {p} missing cosmic_alignment marker")
              elif p.name == "deepseek-cd.yml":
                  if "North Star" not in text and "71.975" not in text:
                      raise SystemExit(f"FAIL: {p} missing North Star markers")
              print(f"✅ scoped OK {p}")

          src = Path(".github/scripts/verify_ledger.py").read_text()
          assert "NORTH_STAR_HZ = 71.975" in src
          assert "PHASE_LOCK_DEG = 202.6" in src
          assert 'EVENT_DOMAIN = b"GARDEN.EVENT.v1"' in src
          assert 'DELTA = "b^2-4ac"' in src
          assert "b²" not in src
          print("✅ North Star constants + scoped vocabulary intact")
          PY
