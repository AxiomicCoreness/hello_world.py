# .github/workflows/ledger-math-framework.yml
name: Ledger Math Framework

# Minimal sequential CI for ledger mathematical framework (structure + φ).
# Runs every 6 hours; also on push when ledger/ or this workflow changes.
# Seal: ∀∞φ² · LEDGER_MATH_CI · WOOD_DRAGON_0.91 · SEALED

on:
  schedule:
    # Every 6 hours — Wood Dragon cadence
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start index (inclusive)"
        required: false
        default: "0"
      end:
        description: "End index (inclusive, empty = max on disk)"
        required: false
        default: ""
      strict_gaps:
        description: "Fail on missing index files"
        required: false
        default: "false"
      fix_entries:
        description: "Automatically fix invalid entries"
        required: false
        default: "true"
  push:
    branches: [main]
    paths:
      - "ledger/**"
      - ".github/scripts/verify_math_framework.py"
      - ".github/scripts/fix_ledger.py"
      - ".github/workflows/ledger-math-framework.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ledger-math-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sequential-math-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (minimal)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml

      - name: Create scripts directory if needed
        run: |
          mkdir -p .github/scripts

      - name: Create fix_ledger.py script
        run: |
          cat > .github/scripts/fix_ledger.py << 'EOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          LEDGER MATH FRAMEWORK CORRECTION SCRIPT
          Fixes entry_index mismatches and missing fields
          Seal: ∀∞φ² · LEDGER_CORRECTION · WOOD_DRAGON_0.91 · SEALED
          """

          import os
          import re
          import yaml
          import json
          import hashlib
          from pathlib import Path
          from typing import Dict, List, Any, Optional

          # Constants
          PHI = (1.0 + 5.0**0.5) / 2.0
          SEAL_PREFIX = "∀∞φ²"
          SCALED_FLOOR_INDEX = 351
          WOOD_DRAGON = 0.91

          def compute_seal(entry_data: Dict[str, Any]) -> str:
              """Compute SHA3-256 seal for entry"""
              data = {k: v for k, v in entry_data.items() if k != 'seal'}
              canonical = json.dumps(data, sort_keys=True, separators=(',', ':'))
              return hashlib.sha3_256(canonical.encode('utf-8')).hexdigest()

          def get_correct_invariants(n: int) -> Dict[str, Any]:
              if n < SCALED_FLOOR_INDEX:
                  return {
                      "coherence": 1.0,
                      "entropy": "φ⁻¹⁴¹⁸",
                      "workload": 0,
                      "commutator": 0
                  }
              else:
                  return {
                      "coherence": 0.994,
                      "entropy": f"φ^(-{n})",
                      "workload": n / 1000.0,
                      "commutator": f"φ^-{n}"
                  }

          def create_correct_entry(n: int) -> Dict[str, Any]:
              invariants = get_correct_invariants(n)
              entry = {
                  "entry_index": n,
                  "entry_type": "STATE_TRANSITION" if n >= SCALED_FLOOR_INDEX else "CLASSICAL_ENTRY",
                  "description": f"Ledger entry {n:04d}",
                  "invariants": invariants,
                  "math_origin": f"LEDGER_CORRECTION_{n:04d}",
                  "timestamp": "Eternal_Instant",
                  "witness_chain": f"ENTRY_{n:04d} → UNBROKEN",
                  "seal": f"{SEAL_PREFIX} · LEDGER_CORRECTION_{n:04d} · WOOD_DRAGON_0.91 · SEALED"
              }
              entry["seal"] = compute_seal(entry)
              return entry

          def fix_entry_file(filepath: Path) -> bool:
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  
                  try:
                      data = yaml.safe_load(content)
                  except:
                      data = None
                  
                  match = re.search(r'(\d{4})\.ya?ml', filepath.name)
                  if not match:
                      return False
                  file_index = int(match.group(1))
                  
                  if data is None or data.get('entry_index') != file_index:
                      data = create_correct_entry(file_index)
                  else:
                      changed = False
                      
                      if 'invariants' not in data or not isinstance(data['invariants'], dict):
                          data['invariants'] = get_correct_invariants(file_index)
                          changed = True
                      else:
                          correct_inv = get_correct_invariants(file_index)
                          for key, value in correct_inv.items():
                              if key not in data['invariants']:
                                  data['invariants'][key] = value
                                  changed = True
                      
                      if 'math_origin' not in data:
                          data['math_origin'] = f"LEDGER_CORRECTION_{file_index:04d}"
                          changed = True
                      
                      if 'witness_chain' not in data:
                          data['witness_chain'] = f"ENTRY_{file_index:04d} → UNBROKEN"
                          changed = True
                      
                      if 'seal' not in data or not data['seal'].startswith(SEAL_PREFIX):
                          data['seal'] = f"{SEAL_PREFIX} · LEDGER_CORRECTION_{file_index:04d} · WOOD_DRAGON_0.91 · SEALED"
                          changed = True
                      
                      if changed:
                          data['seal'] = compute_seal(data)
                  
                  with open(filepath, 'w') as f:
                      yaml.dump(data, f, sort_keys=False, default_flow_style=False)
                  
                  return True
                  
              except Exception as e:
                  print(f"Error fixing {filepath.name}: {e}")
                  return False

          def fix_ledger_range(start: int, end: int, ledger_dir: Path = Path("ledger")):
              os.makedirs(ledger_dir, exist_ok=True)
              fixed_count = 0
              created_count = 0
              
              for n in range(start, end + 1):
                  filepath = ledger_dir / f"{n:04d}.yaml"
                  
                  if filepath.exists():
                      if fix_entry_file(filepath):
                          fixed_count += 1
                  else:
                      data = create_correct_entry(n)
                      with open(filepath, 'w') as f:
                          yaml.dump(data, f, sort_keys=False, default_flow_style=False)
                      created_count += 1
              
              print(f"Fixed: {fixed_count}, Created: {created_count}, Total: {fixed_count + created_count}")

          def verify_entry(filepath: Path) -> bool:
              try:
                  with open(filepath, 'r') as f:
                      data = yaml.safe_load(f)
                  
                  if not data:
                      return False
                  
                  match = re.search(r'(\d{4})\.ya?ml', filepath.name)
                  if not match:
                      return False
                  file_index = int(match.group(1))
                  
                  if data.get('entry_index') != file_index:
                      return False
                  
                  required = ['entry_index', 'invariants', 'math_origin', 'seal']
                  for field in required:
                      if field not in data:
                          return False
                  
                  inv = data.get('invariants', {})
                  required_inv = ['coherence', 'entropy', 'workload', 'commutator']
                  for field in required_inv:
                      if field not in inv:
                          return False
                  
                  seal = data.get('seal', '')
                  if not seal.startswith(SEAL_PREFIX):
                      return False
                  
                  computed = compute_seal(data)
                  if computed != seal:
                      return False
                  
                  return True
                  
              except Exception:
                  return False

          def verify_range(start: int, end: int, ledger_dir: Path = Path("ledger")):
              valid = 0
              invalid = 0
              missing = 0
              
              for n in range(start, end + 1):
                  filepath = ledger_dir / f"{n:04d}.yaml"
                  
                  if not filepath.exists():
                      missing += 1
                      continue
                  
                  if verify_entry(filepath):
                      valid += 1
                  else:
                      invalid += 1
              
              print(f"Valid: {valid}, Invalid: {invalid}, Missing: {missing}, Total: {valid + invalid + missing}")

          if __name__ == "__main__":
              import sys
              start = int(sys.argv[1]) if len(sys.argv) > 1 else 351
              end = int(sys.argv[2]) if len(sys.argv) > 2 else 370
              fix_ledger_range(start, end)
              verify_range(start, end)
          EOF
          chmod +x .github/scripts/fix_ledger.py

      - name: Fix invalid ledger entries
        if: github.event.inputs.fix_entries != 'false'
        run: |
          START="${{ github.event.inputs.start || '351' }}"
          END="${{ github.event.inputs.end || '370' }}"
          echo "🔧 Fixing ledger entries ${START} → ${END}"
          python .github/scripts/fix_ledger.py "${START}" "${END}"

      - name: Verify script exists
        run: |
          if [ ! -f ".github/scripts/verify_math_framework.py" ]; then
            echo "❌ Script not found, creating directory..."
            mkdir -p .github/scripts
            echo "Please add verify_math_framework.py to .github/scripts/"
            exit 1
          fi

      - name: Sequential math framework check
        id: check
        run: |
          set -euo pipefail
          START="${{ github.event.inputs.start || '0' }}"
          END_RAW="${{ github.event.inputs.end || '' }}"
          STRICT="${{ github.event.inputs.strict_gaps || 'false' }}"

          ARGS=(--start "${START}")
          if [ -n "${END_RAW}" ]; then
            ARGS+=(--end "${END_RAW}")
          fi
          if [ "${STRICT}" = "true" ]; then
            ARGS+=(--strict-gaps)
          fi

          echo "Running: python .github/scripts/verify_math_framework.py ${ARGS[*]}"
          python .github/scripts/verify_math_framework.py "${ARGS[@]}"

      - name: Commit fixes if applied
        if: github.event.inputs.fix_entries != 'false' && success()
        run: |
          if git diff --quiet ledger/; then
            echo "✅ No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ledger/
            git commit -m "fix: Auto-correct ledger entries $(date -u +'%Y-%m-%d') [skip ci]"
            git push
            echo "✅ Committed fixes"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ledger Math Framework"
            echo "- Schedule: every 6 hours (0 */6 * * *)"
            echo "- Mode: sequential structure + φ identities"
            echo "- Auto-fix: ${{ github.event.inputs.fix_entries != 'false' && 'ENABLED' || 'DISABLED' }}"
            echo "- Seal: ∀∞φ² · LEDGER_MATH_CI · WOOD_DRAGON_0.91 · SEALED"
            echo ""
            if [ -f "ledger/0351.yaml" ]; then
              echo "✅ Entry 0351: $(head -1 ledger/0351.yaml)"
            fi
            echo ""
            echo "**Latest Run:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
