# Restored Actions YAML. The previous blob was a Python verifier
# pasted into the workflow path, which produced 0 jobs on every push.
# Verifier lives at .github/scripts/verify_math_framework.py.
# Seal: ∀∞φ² · LEDGER_MATH_CI · WOOD_DRAGON_0.91 · SEALED
# Witness: 9159 → 9160 — UNBROKEN

name: Ledger Math Framework

on:
  push:
    paths:
      - "ledger/**"
      - "k8s/**"
      - "scripts/**"
      - ".github/scripts/verify_math_framework.py"
      - ".github/workflows/ledger-math-framework.yml"
  pull_request:
    paths:
      - "ledger/**"
      - "k8s/**"
      - "scripts/**"
      - ".github/scripts/verify_math_framework.py"
      - ".github/workflows/ledger-math-framework.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier deps
        run: pip install --quiet pyyaml

      - name: Verify recent ledger entries (9156+)
        run: |
          python .github/scripts/verify_math_framework.py \
            --ledger-dir ledger \
            --start 9156

      - name: YAML parse check (ledger + k8s)
        run: |
          python - << 'PY'
          from pathlib import Path
          import sys
          try:
              import yaml
          except ImportError:
              print("pyyaml missing")
              sys.exit(1)
          roots = [Path("ledger"), Path("k8s")]
          fails = 0
          checked = 0
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob("*.y*ml")):
                  try:
                      yaml.safe_load(p.read_text(encoding="utf-8"))
                      checked += 1
                  except Exception as e:
                      print(f"FAIL {p}: {e}")
                      fails += 1
          print(f"yaml_checked={checked} yaml_fails={fails}")
          sys.exit(1 if fails else 0)
          PY

      - name: Hook worker import (no bind)
        run: |
          PYTHONPATH=. python - << 'PY'
          import importlib.util
          from pathlib import Path
          p = Path("scripts/codespace_hook_worker.py")
          spec = importlib.util.spec_from_file_location("codespace_hook_worker", p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.FILLED is False
          assert mod.BIND == "127.0.0.1"
          assert mod.PORT == 8091
          assert mod.DUAL_ASGI == "127.0.0.1:8024"
          print("hook worker import OK FILLED=False bind 127.0.0.1:8091")
          PY
