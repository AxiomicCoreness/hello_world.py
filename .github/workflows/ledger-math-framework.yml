# Cap: Ledger Math CI checks 9156-9160 only.
# Does not rewrite 9157-9161. Does not walk to 510511.yaml.
# Seal: ∀∞φ² · LEDGER_MATH_CI · WOOD_DRAGON_0.91 · SEALED
# Witness: 9161 → 9162 — UNBROKEN

name: Ledger Math Framework

on:
  push:
    paths:
      - "ledger/9156.yaml"
      - "ledger/9157.yaml"
      - "ledger/9158.yaml"
      - "ledger/9159.yaml"
      - "ledger/9160.yaml"
      - "ledger/9162.yaml"
      - "k8s/**"
      - "scripts/codespace_hook_worker.py"
      - ".github/scripts/verify_math_framework.py"
      - ".github/workflows/ledger-math-framework.yml"
  pull_request:
    paths:
      - "ledger/9156.yaml"
      - "ledger/9157.yaml"
      - "ledger/9158.yaml"
      - "ledger/9159.yaml"
      - "ledger/9160.yaml"
      - "k8s/**"
      - "scripts/codespace_hook_worker.py"
      - ".github/scripts/verify_math_framework.py"
      - ".github/workflows/ledger-math-framework.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier deps
        run: pip install --quiet pyyaml

      - name: Verify ledger 9156-9160 only
        run: |
          python .github/scripts/verify_math_framework.py \
            --ledger-dir ledger \
            --start 9156 \
            --end 9160

      - name: YAML parse check (capped files + k8s)
        run: |
          python - << 'PY'
          from pathlib import Path
          import sys
          try:
              import yaml
          except ImportError:
              print("pyyaml missing")
              sys.exit(1)
          files = [Path(f"ledger/{n}.yaml") for n in range(9156, 9161)]
          k8s = Path("k8s")
          if k8s.exists():
              files.extend(sorted(k8s.rglob("*.y*ml")))
          fails = 0
          checked = 0
          for p in files:
              if not p.exists():
                  print(f"SKIP missing {p}")
                  continue
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
                  checked += 1
              except Exception as e:
                  print(f"FAIL {p}: {e}")
                  fails += 1
          print(f"yaml_checked={checked} yaml_fails={fails}")
          sys.exit(1 if fails else 0)
          PY

      - name: Hook worker import (no bind)
        run: |
          PYTHONPATH=. python - << 'PY'
          import importlib.util
          from pathlib import Path
          p = Path("scripts/codespace_hook_worker.py")
          spec = importlib.util.spec_from_file_location("codespace_hook_worker", p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.FILLED is False
          assert mod.BIND == "127.0.0.1"
          assert mod.PORT == 8091
          assert mod.DUAL_ASGI == "127.0.0.1:8024"
          print("hook worker import OK FILLED=False bind 127.0.0.1:8091")
          PY
