# ============================================================================
# MATHEMATICAL CONSTANTS
# ============================================================================
PHI = (1.0 + math.sqrt(5.0)) / 2.0
PI_SQRT2 = math.pi * math.sqrt(2.0)
EPS = 1e-12
SEAL_PREFIX = "∀∞φ²"
SCALED_FLOOR_INDEX = 351
WOOD_DRAGON = 0.91
LEDGER_MATH_CI = "LEDGER_MATH_CI"

# Classical entropy values
PHI_ENTROPY_CLASSICAL = {
    "φ⁻¹⁴¹⁸",
    "φ^{-1418}",
    "phi^-1418",
    "phi^{-1418}",
    "PHI^-1418",
    "φ⁻¹⁴¹⁸",
