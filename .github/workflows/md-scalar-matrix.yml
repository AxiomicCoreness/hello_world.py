name: MD Scalar Matrix

# Manual and path-push only. Removed from the parity slot and from cron.
# ledger_policy: NO_LEDGER_WRITE — commits pythonIDE/md_scalar_matrix.png only.

on:
  push:
    branches: [main, deepseek]
    paths:
      - "pythonIDE/md_scalar_matrix.py"
      - "POLICY.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/md-scalar-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: md-scalar-matrix

env:
  HASH_ALGO: sha3_256
  SCRIPT: pythonIDE/md_scalar_matrix.py
  ARTIFACT: pythonIDE/md_scalar_matrix.png

jobs:
  generate-matrix:
    name: MD Scalar Matrix · Generate · Commit
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet numpy matplotlib seaborn

      - name: Guard — script present
        run: |
          set -euo pipefail
          if [ ! -f "${SCRIPT}" ]; then
            echo "::error::${SCRIPT} not found"
            exit 1
          fi

      - name: Generate matrix
        run: |
          set -euo pipefail
          python "${SCRIPT}"
          if [ ! -f "${ARTIFACT}" ]; then
            echo "::error::${SCRIPT} did not produce ${ARTIFACT}"
            exit 1
          fi
          echo "generated ${ARTIFACT}"
          ls -la "${ARTIFACT}"

      - name: Upload PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md-scalar-matrix-${{ github.ref_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: warn

      - name: Auto-commit PNG only
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: pythonIDE/md_scalar_matrix.png (no ledger rewrite)"
          file_pattern: pythonIDE/md_scalar_matrix.png
          commit_options: '--no-verify'

      - name: Summary
        if: always()
        run: |
          {
            echo "MD Scalar Matrix completed."
            echo "trigger: workflow_dispatch or path push"
            echo "artifact: ${ARTIFACT}"
            echo "ledger_policy: NO_LEDGER_WRITE"
          } >> "$GITHUB_STEP_SUMMARY"
