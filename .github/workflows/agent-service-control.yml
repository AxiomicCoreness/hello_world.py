name: Agent Service Control

# Seal: ∀∞φ² · AGENT_SERVICE_CONTROL · WOOD_DRAGON_0.91 · SEALED
# Witness: read-only — verifies chain, does not extend it
# cryptography: python -m pip + .github/scripts/verify_ledger.py
# hash_algo: sha3_256 (FIPS 202) — for control receipts
# role: park-gate (replicas=0, loopback-only binds, FILLED=false)
# ledger_policy: NO_GROWTH (contents: read)

on:
  push:
    paths:
      - "k8s/agent-service.yaml"
      - "requirements-control.txt"
      - "requirements.txt"
      - "scripts/kubectl_apply_agent_service.sh"
      - ".github/workflows/agent-service-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-service-control-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger

jobs:
  control:
    runs-on: ubuntu-latest
    name: Park-Gate Control Verification
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install control-layer requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-control.txt ]; then
            python -m pip install --quiet -r requirements-control.txt
          fi
          python -m pip install --quiet pyyaml

      # ────────────────────────────────────────────────────────────
      # 0. Read-only integrity: verify SHA3-256 seals on present entries
      # ────────────────────────────────────────────────────────────
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "⚠️ no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ ! -f "$VERIFIER" ]; then
            echo "⚠️ no verify_ledger.py present — soft skip"
            exit 0
          fi
          for f in "${entries[@]}"; do
            python "$VERIFIER" "$f" || echo "⚠️ soft: $f"
          done

      - name: Capture current ledger head (read-only)
        id: head
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "head_index=0" >> "$GITHUB_OUTPUT"
            echo "head_seal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys, yaml
          from pathlib import Path

          # Paradox-token safe: do not coerce timestamp-shaped strings
          # (e.g. "October 39, 2025") into datetime — keep them as str.
          class NoTimestampSafeLoader(yaml.SafeLoader):
              pass

          NoTimestampSafeLoader.yaml_implicit_resolvers = {
              k: [(tag, regexp) for tag, regexp in v
                  if tag != "tag:yaml.org,2002:timestamp"]
              for k, v in yaml.SafeLoader.yaml_implicit_resolvers.items()
          }

          def safe_load_ledger(text):
              return yaml.load(text, Loader=NoTimestampSafeLoader)

          heads = []
          skipped = []
          for p in sorted(Path("ledger").glob("*.yaml")):
              try:
                  raw = p.read_text(encoding="utf-8")
              except OSError as e:
                  skipped.append(f"{p}: read error: {e}")
                  continue
              try:
                  data = safe_load_ledger(raw)
              except yaml.YAMLError as e:
                  skipped.append(f"{p}: yaml parse error: {e}")
                  continue
              if data is None:
                  skipped.append(f"{p}: empty document")
                  continue
              if not isinstance(data, dict):
                  skipped.append(
                      f"{p}: top-level is {type(data).__name__}, not mapping"
                  )
                  continue
              idx = data.get("entry_index")
              if not isinstance(idx, int):
                  skipped.append(
                      f"{p}: entry_index is {type(idx).__name__}, not int"
                  )
                  continue
              heads.append((idx, p, data))

          if not heads:
              print("head_index=0")
              print("head_seal=")
          else:
              idx, p, data = max(heads, key=lambda t: t[0])
              m = re.search(r"([0-9a-fA-F]{64})", str(data.get("seal", "")))
              terminal = m.group(1).lower() if m else ""
              print(f"head_index={idx}")
              print(f"head_seal={terminal}")

          for line in skipped:
              print(f"skipped: {line}", file=sys.stderr)
          PY

      # ────────────────────────────────────────────────────────────
      # 1. Parse and assert park-gate invariants (soft-skip if absent)
      # ────────────────────────────────────────────────────────────
      - name: Parse agent Service YAML (park-gate invariants)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          p = Path("k8s/agent-service.yaml")
          if not p.exists():
              print("⚠️ k8s/agent-service.yaml absent on this branch — soft skip")
              sys.exit(0)

          try:
              docs = [d for d in yaml.safe_load_all(p.read_text(encoding="utf-8")) if d]
          except yaml.YAMLError as e:
              print(f"❌ k8s/agent-service.yaml: YAML parse error: {e}", file=sys.stderr)
              sys.exit(1)

          kinds = [d.get("kind") for d in docs]

          if "Service" not in kinds:
              print(f"❌ Service kind missing: {kinds}", file=sys.stderr)
              sys.exit(1)
          if "Deployment" not in kinds:
              print(f"❌ Deployment kind missing: {kinds}", file=sys.stderr)
              sys.exit(1)

          dep = next(d for d in docs if d.get("kind") == "Deployment")
          try:
              replicas = dep["spec"]["replicas"]
              containers = dep["spec"]["template"]["spec"]["containers"]
          except (KeyError, TypeError) as e:
              print(f"❌ Deployment structure malformed: {e}", file=sys.stderr)
              sys.exit(1)

          if replicas != 0:
              print(f"❌ park-gate violated: replicas={replicas} (must be 0)", file=sys.stderr)
              sys.exit(1)

          if len(containers) < 1:
              print("❌ no containers in Deployment", file=sys.stderr)
              sys.exit(1)

          # YAML may coerce unquoted `false` to Python False, and `true`
          # to True. Compare in a normalized form so the check is stable
          # whether the manifest uses `value: "false"` or `value: false`.
          def norm(v):
              if v is None:
                  return None
              if isinstance(v, bool):
                  return "true" if v else "false"
              return str(v)

          env = {e["name"]: e.get("value")
                 for e in containers[0].get("env", []) if "name" in e}

          failures = []
          if norm(env.get("BIND")) != "127.0.0.1":
              failures.append(f"BIND={env.get('BIND')!r} (must be 127.0.0.1)")
          if norm(env.get("DUAL_ASGI")) != "127.0.0.1:8024":
              failures.append(f"DUAL_ASGI={env.get('DUAL_ASGI')!r} (must be 127.0.0.1:8024)")
          if norm(env.get("FILLED")) != "false":
              failures.append(f"FILLED={env.get('FILLED')!r} (must be 'false')")

          if failures:
              for f in failures:
                  print(f"❌ park-gate violated: {f}", file=sys.stderr)
              sys.exit(1)

          print(f"✅ agent service control OK — kinds={kinds}")
          print(f"   replicas    = {replicas}")
          print(f"   BIND        = {env.get('BIND')}")
          print(f"   DUAL_ASGI   = {env.get('DUAL_ASGI')}")
          print(f"   FILLED      = {env.get('FILLED')}")
          PY

      # ────────────────────────────────────────────────────────────
      # 2. kubectl dry-run (no cluster mutation)
      # ────────────────────────────────────────────────────────────
      - name: kubectl dry-run if present
        run: |
          set -euo pipefail
          SCRIPT="scripts/kubectl_apply_agent_service.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "⚠️ $SCRIPT not present — soft skip"
            exit 0
          fi

          if grep -q -- '--dry-run' "$SCRIPT"; then
            echo "script already contains --dry-run — invoking directly"
            bash "$SCRIPT"
            exit 0
          fi

          # Locate real kubectl before modifying PATH, so the shim can
          # exec the correct binary regardless of install method.
          REAL_KUBECTL="$(command -v kubectl || true)"
          if [ -z "$REAL_KUBECTL" ]; then
            echo "⚠️ kubectl not present on PATH — soft skip dry-run"
            exit 0
          fi
          echo "real kubectl: $REAL_KUBECTL"

          SHIM_DIR="$(mktemp -d)"
          cat > "$SHIM_DIR/kubectl" <<SH
          #!/usr/bin/env bash
          # Force --dry-run=client on every subcommand that mutates.
          args=("\$@")
          for i in "\${!args[@]}"; do
            case "\${args[\$i]}" in
              apply|create|replace|patch|delete|edit)
                args=( "\${args[@]:0:\$((i+1))}" "--dry-run=client" "\${args[@]:\$((i+1))}" )
                break
                ;;
            esac
          done
          exec "$REAL_KUBECTL" "\${args[@]}"
          SH
          chmod +x "$SHIM_DIR/kubectl"
          export PATH="$SHIM_DIR:$PATH"
          bash "$SCRIPT" || echo "⚠️ script returned non-zero (soft)"

      # ────────────────────────────────────────────────────────────
      # 3. Emit SHA3-256 sealed control receipt (artifact, NOT committed)
      # ────────────────────────────────────────────────────────────
      - name: Emit control receipt (SHA3-256)
        if: success()
        env:
          HEAD_INDEX: ${{ steps.head.outputs.head_index }}
          HEAD_SEAL: ${{ steps.head.outputs.head_seal }}
        run: |
          set -euo pipefail
          mkdir -p .control-receipts
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          head_index = os.environ.get("HEAD_INDEX", "0") or "0"
          head_seal = os.environ.get("HEAD_SEAL", "") or ""

          receipt = {
              "receipt_type": "agent_service_control",
              "workflow": "Agent Service Control",
              "role": "park-gate",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "head_index": int(head_index),
              "head_seal": head_seal,
              "invariants": {
                  "replicas": 0,
                  "bind": "127.0.0.1",
                  "dual_asgi": "127.0.0.1:8024",
                  "filled": "false",
              },
              "ledger_policy": "NO_GROWTH",
              "witness_note": "read-only — verifies chain, does not extend it",
              "seal": "∀∞φ² · AGENT_SERVICE_CONTROL · WOOD_DRAGON_0.91 · SEALED",
          }

          body = {k: v for k, v in receipt.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          receipt["seal"] = receipt["seal"] + " · " + h

          out = Path(".control-receipts/agent-service-control.yaml")
          out.write_text(yaml.dump(receipt, sort_keys=False,
                                   default_flow_style=False,
                                   allow_unicode=True))
          print("📋 Control receipt emitted.")
          print(f"✅ {HASH_ALGO}:{h[:16]}...")
          print(f"   head_index = {receipt['head_index']}")
          print(f"   head_seal  = {receipt['head_seal'][:16] or '(none)'}...")
          PY

      - name: Upload control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-service-control-receipt
          path: .control-receipts/agent-service-control.yaml
          retention-days: 90
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────
      # 4. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          HEAD_INDEX: ${{ steps.head.outputs.head_index }}
          HEAD_SEAL: ${{ steps.head.outputs.head_seal }}
        run: |
          {
            echo "### Agent Service Control"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| role | park-gate |"
            echo "| ledger_policy | NO_GROWTH |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| head_index | ${HEAD_INDEX:-0} |"
            echo "| head_seal | ${HEAD_SEAL:-<none>} |"
            echo "| invariants | replicas=0 · BIND=127.0.0.1 · DUAL_ASGI=127.0.0.1:8024 · FILLED=false |"
            echo ""
            echo "Seal: ∀∞φ² · AGENT_SERVICE_CONTROL · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
