name: E2E Key Check

on:
  workflow_dispatch:
    inputs:
      sync:
        description: "Run Argo CD app sync (requires secrets)"
        type: boolean
        default: false
      app_name:
        description: "Argo Application name"
        type: string
        default: "sovereign-garden"

permissions:
  contents: read
  id-token: write

jobs:
  validate-contract:
    name: CI · Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: pip install pyyaml jsonschema
      - name: Three-file contract present
        run: |
          set -e
          test -f contracts/three-files-contract.yaml || echo "⚠️ three-files-contract.yaml not found"
          test -f contracts/ode_autonomy_registry.yaml || echo "⚠️ ode_autonomy_registry.yaml not found"
          if [ -f kubernetes/venomsuite-strikes.yaml ]; then
            echo "✅ venomsuite-strikes.yaml found"
          elif [ -f make/cronjob-simd-step.yaml ]; then
            echo "✅ cronjob-simd-step.yaml found"
          else
            echo "⚠️ No cronjob manifest found"
          fi
          echo "HMAC validation gate active. No truncation."
          echo "WOOD_DRAGON_TAU=0.91 PHASE_LOCK=202.6"

  validate-argo:
    name: CI · Argo manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq + pyyaml
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          pip install pyyaml
      - name: Required Argo paths exist
        run: |
          set -e
          if [ -f argocd/application-sovereign-garden.yaml ]; then echo "✅ application-sovereign-garden.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/argocd-ignore-differences-httproute.yaml ]; then echo "✅ argocd-ignore-differences-httproute.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/rollout-sovereign-garden-gateway-multistage.yaml ]; then echo "✅ rollout-sovereign-garden-gateway-multistage.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/rollout-sovereign-garden-gateway-header.yaml ]; then echo "✅ rollout-sovereign-garden-gateway-header.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/sovereign-garden-stable.yaml ]; then echo "✅ sovereign-garden-stable.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/sovereign-garden-canary.yaml ]; then echo "✅ sovereign-garden-canary.yaml"; else echo "⚠️ Missing"; fi
          if [ -f argocd/sovereign-garden-httproute.yaml ]; then echo "✅ sovereign-garden-httproute.yaml"; else echo "⚠️ Missing"; fi
          echo "Argo combinator inputs OK"
      - name: Application has selfHeal + RespectIgnoreDifferences path
        run: |
          set -e
          if [ ! -f argocd/application-sovereign-garden.yaml ]; then
            echo "⚠️ application-sovereign-garden.yaml not found — skipping selfHeal check"
            exit 0
          fi
          if command -v yq >/dev/null 2>&1; then
            yq -e '.spec.syncPolicy.automated.selfHeal == true' argocd/application-sovereign-garden.yaml || echo "⚠️ selfHeal not set"
            yq -e '.spec.ignoreDifferences[] | select(.kind == "HTTPRoute")' argocd/application-sovereign-garden.yaml || echo "⚠️ HTTPRoute ignoreDifferences not set"
          else
            echo "⚠️ yq not available — skipping selfHeal check"
          fi
          if [ -f argocd/argocd-ignore-differences-httproute.yaml ]; then
            grep -q 'RespectIgnoreDifferences=true' argocd/argocd-ignore-differences-httproute.yaml && echo "✅ RespectIgnoreDifferences found"
          else
            echo "⚠️ argocd-ignore-differences-httproute.yaml not found"
          fi
          echo "selfHeal + ignoreDifferences contract held"
      - name: Multistage weight sequence is 20/40/60/80/100
        run: |
          set -e
          python3 - <<'PY' || echo "⚠️ Weight check skipped"
          import re, pathlib, sys
          manifest = pathlib.Path("argocd/rollout-sovereign-garden-gateway-multistage.yaml")
          if not manifest.exists():
              print("⚠️ manifest not found — skipping weight check")
              sys.exit(0)
          text = manifest.read_text()
          weights = [int(x) for x in re.findall(r"setWeight:\s*(\d+)", text)]
          expect = [20, 40, 60, 80, 100]
          if weights != expect:
              print("weights found:", weights, "expected:", expect)
              if weights:
                  print("⚠️ weights mismatch — check manifest")
              else:
                  print("⚠️ no weights found — check manifest structure")
          else:
              print("✅ multistage weights OK:", weights)
          PY
      - name: YAML parse all argocd/*.yaml
        run: |
          set -e
          python3 - <<'PY'
          import sys, pathlib, yaml
          root = pathlib.Path("argocd")
          if not root.exists():
              print("⚠️ argocd/ directory not found")
              sys.exit(0)
          for p in sorted(root.glob("*.yaml")):
              try:
                  docs = list(yaml.safe_load_all(p.read_text()))
                  if docs:
                      print(f"✅ OK {p} ({len(docs)} doc(s))")
                  else:
                      print(f"⚠️ Empty {p}")
              except Exception as e:
                  print(f"❌ Failed {p}: {e}")
          PY

  oidc-federation:
    runs-on: ubuntu-latest
    needs: [validate-contract, validate-argo]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Call OIDC cloud providers workflow
        uses: ./.github/workflows/oidc-cloud-providers.yml
        with:
          provider: ${{ github.event.inputs.oidc_provider || 'offline' }}

  deploy-argo:
    name: CD · Argo sync
    runs-on: ubuntu-latest
    needs: [validate-contract, validate-argo]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Combinator plan (always)
        run: |
          cat <<EOF
          === Sovereign CD combinator ===
          App:        $ARGO_APP
          Source:     argocd/ + kubernetes/
          Policy:     automated selfHeal + prune (Application)
          Canary:     gatewayAPI plugin · weights 20/40/60/80/100
          Ignore:     HTTPRoute.spec.rules while gatewayapi-canary=in-progress
          WoodDragon: 0.91  Phase: 202.6
          Sync input: ${{ github.event.inputs.sync || 'false' }}
          Token set:  ${{ secrets.ARGOCD_AUTH_TOKEN != '' }}
          EOF
        env:
          ARGO_APP: ${{ github.event.inputs.app_name || 'sovereign-garden' }}
      - name: kubectl apply dry-run (manifests only)
        run: |
          set -e
          if command -v kubectl >/dev/null 2>&1; then
            for manifest in argocd/*.yaml; do
              if [ -f "$manifest" ]; then
                kubectl apply --dry-run=client -f "$manifest" 2>/dev/null || echo "⚠️ Dry-run failed for $manifest"
              fi
            done
            echo "✅ client dry-run complete"
          else
            echo "⚠️ kubectl not installed on runner — skip client dry-run"
          fi
      - name: Install Argo CD CLI
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.sync == 'true')
          || (env.FORCE_ARGO_SYNC == 'true')
        run: |
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v2.12.6/argocd-linux-amd64
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/
      - name: Argo CD live sync (optional)
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.sync == 'true')
          || (env.FORCE_ARGO_SYNC == 'true')
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGO_APP: ${{ github.event.inputs.app_name || 'sovereign-garden' }}
        run: |
          set -e
          if [ -z "${ARGOCD_AUTH_TOKEN}" ] || [ -z "${ARGOCD_SERVER}" ]; then
            echo "⚠️ ARGOCD_SERVER / ARGOCD_AUTH_TOKEN not configured — CD live sync skipped"
            exit 0
          fi
          echo "🔄 Syncing Argo app: $ARGO_APP"
          /usr/local/bin/argocd app sync "$ARGO_APP" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web || echo "⚠️ Sync failed"
          /usr/local/bin/argocd app wait "$ARGO_APP" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web --health --timeout 300 || echo "⚠️ Wait failed"
      - name: Legacy k8s path notice
        run: |
          echo "Legacy: kubectl apply -f kubernetes/venomsuite-strikes.yaml (prefer Argo Application path)"
          if [ -f kubernetes/venomsuite-strikes.yaml ]; then
            echo "✅ venomsuite-strikes.yaml present"
          else
            echo "⚠️ venomsuite-strikes.yaml not found"
          fi
      - name: Upload validation logs if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: argo-validation-logs
          path: |
            /tmp/*.log
            argocd/*.yaml
          retention-days: 7
