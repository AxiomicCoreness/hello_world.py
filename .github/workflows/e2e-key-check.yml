name: E2E Suite with Key Check

on:
  workflow_dispatch:
    inputs:
      e2e_max_workers:
        description: 'Max parallel workers for e2e tests'
        type: number
        default: 4
  workflow_call:
    inputs:
      e2e_max_workers:
        description: 'Max parallel workers for e2e tests'
        type: number
        default: 4
    secrets:
      DEEPSEEK_API_KEY:
        required: true
      GARDEN_SECRET:
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python (for harness)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        run: npm install -g pnpm

      # ─── Enforce API key ──────────────────────────────────────
      - name: Validate DEEPSEEK_API_KEY
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is not set. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the repo secret DEEPSEEK_API_KEY."
            exit 1
          fi
          echo "✅ DEEPSEEK_API_KEY is set."

      - name: Install dependencies
        run: pnpm install

      - name: Run Vitest e2e suite
        run: pnpm test:e2e
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_E2E_MAX_WORKERS: ${{ inputs.e2e_max_workers || 4 }}
