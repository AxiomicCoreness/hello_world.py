name: Witness Chain SQLite

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/witness_chain_sqlite.py"
      - ".github/workflows/witness-chain-sqlite.yml"
      - "ledger/8337.yaml"
      - "ledger/8338.yaml"
      - "ledger/8339.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/witness_chain_sqlite.py"
      - ".github/workflows/witness-chain-sqlite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-chain-sqlite-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  SCRIPT: .github/scripts/witness_chain_sqlite.py
  DB_ARTIFACT: witness_chain.db
  EXPECTED_ROWS: "8337,8338,8339"

jobs:
  build-and-verify:
    name: Build verify seal witness chain
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      - name: Confirm builder script present
        id: check
        run: |
          set -euo pipefail
          if [ ! -f "${SCRIPT}" ]; then
            echo "::error::${SCRIPT} not found"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Run witness chain builder
        id: build
        if: steps.check.outputs.present == 'true'
        run: |
          set -euo pipefail
          set +e
          python "${SCRIPT}" 2>&1 | tee witness_chain_build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "builder_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::witness_chain_sqlite.py exited ${rc}"
            exit 1
          fi
          if [ ! -f "${DB_ARTIFACT}" ]; then
            echo "::error::${DB_ARTIFACT} not produced by script"
            echo "db_sha3_256=" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          DB_SHA=$(python -c "import hashlib,pathlib; print(hashlib.new('sha3_256', pathlib.Path('witness_chain.db').read_bytes()).hexdigest())")
          echo "db_sha3_256=${DB_SHA}" >> "$GITHUB_OUTPUT"
          echo "db sha3_256: ${DB_SHA:0:16}..."

      - name: Assert witness rows present
        id: rows
        if: steps.build.outputs.db_sha3_256 != ''
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3
          fi
          IFS=',' read -ra WANTED <<< "${EXPECTED_ROWS}"
          missing=()
          for entry in "${WANTED[@]}"; do
            count=$(sqlite3 "${DB_ARTIFACT}" "SELECT COUNT(*) FROM witness WHERE entry_index=${entry};" 2>/dev/null || echo "0")
            if [ "${count}" -lt 1 ]; then
              missing+=("${entry}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::witness rows missing for entries: ${missing[*]}"
            echo "rows_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "rows_ok=true" >> "$GITHUB_OUTPUT"
          echo "witness rows present: ${EXPECTED_ROWS}"

      - name: Verify chain linkage in DB
        id: chain
        if: steps.rows.outputs.rows_ok == 'true'
        run: |
          set -euo pipefail
          python -c "import sqlite3,sys; db=sqlite3.connect('witness_chain.db'); rows=db.execute('SELECT entry_index, prev_hash, hash FROM witness ORDER BY entry_index').fetchall();\nimport sys\nif not rows:\n  print('no rows'); sys.exit(1)\nprev=''\nfor i,p,h in rows:\n  if p!=prev:\n    print('break at',i); sys.exit(1)\n  prev=h\nprint('chain intact',len(rows))"

      - name: Upload witness chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-chain-sqlite
          path: |
            witness_chain.db
            witness_chain_build.log
          retention-days: 30
          if-no-files-found: warn
