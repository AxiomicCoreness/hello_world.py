name: Witness Chain SQLite

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/witness_chain_sqlite.py"
      - ".github/workflows/witness-chain-sqlite.yml"
      - "ledger/8337.yaml"
      - "ledger/8338.yaml"
      - "ledger/8339.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/witness_chain_sqlite.py"
      - ".github/workflows/witness-chain-sqlite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-chain-sqlite-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  SCRIPT: .github/scripts/witness_chain_sqlite.py
  DB_ARTIFACT: witness_chain.db
  EXPECTED_ROWS: "8337,8338,8339"

jobs:
  build-and-verify:
    name: Build verify seal witness chain
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      - name: Confirm builder script present
        id: check
        run: |
          set -euo pipefail
          if [ ! -f "${SCRIPT}" ]; then
            echo "::error::${SCRIPT} not found"
            exit 1
          fi

      - name: Run witness chain builder
        id: build
        run: |
          set -euo pipefail
          set +e
          python "${SCRIPT}" 2>&1 | tee witness_chain_build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "builder_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::witness_chain_sqlite.py exited ${rc}"
            exit 1
          fi
          if [ ! -f "${DB_ARTIFACT}" ]; then
            echo "::error::${DB_ARTIFACT} not produced by script"
            exit 1
          fi
          DB_SHA=$(python -c "import hashlib,pathlib; print(hashlib.new('sha3_256', pathlib.Path('witness_chain.db').read_bytes()).hexdigest())")
          echo "db_sha3_256=${DB_SHA}" >> "$GITHUB_OUTPUT"
          echo "db sha3_256: ${DB_SHA:0:16}..."

      - name: Assert witness rows present
        id: rows
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3
          fi
          IFS=',' read -ra WANTED <<< "${EXPECTED_ROWS}"
          missing=()
          for entry in "${WANTED[@]}"; do
            count=$(sqlite3 "${DB_ARTIFACT}" "SELECT COUNT(*) FROM witness WHERE entry_index=${entry};" 2>/dev/null || echo "0")
            if [ "${count}" -lt 1 ]; then
              missing+=("${entry}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::witness rows missing for entries: ${missing[*]}"
            exit 1
          fi
          echo "rows_ok=true" >> "$GITHUB_OUTPUT"
          echo "witness rows present: ${EXPECTED_ROWS}"

      - name: Verify chain linkage in DB
        id: chain
        if: steps.rows.outputs.rows_ok == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3, sys
          
          rows = sqlite3.connect("witness_chain.db").execute(
              "SELECT entry_index, prev_hash, hash FROM witness ORDER BY entry_index"
          ).fetchall()
          
          if not rows:
              print("::error::No rows found in witness table.")
              sys.exit(1)
              
          # The first entry must be a genesis anchor or explicitly empty
          first_index, first_prev, first_hash = rows[0]
          if first_prev not in ("", "0000000000000000", "0" * 64):
              print(f"::error::Chain break at genesis. First entry {first_index} has prev_hash={first_prev}")
              sys.exit(1)
              
          # Verify the rest of the chain
          prev = first_hash
          for i, p, h in rows[1:]:
              if p != prev:
                  print(f"::error::Chain break at entry {i}. Expected prev_hash={prev}, got {p}")
                  sys.exit(1)
              prev = h
              
          print(f"✅ Chain intact across {len(rows)} entries.")
          PY

      - name: Upload witness chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-chain-sqlite
          path: |
            witness_chain.db
            witness_chain_build.log
          retention-days: 30
          if-no-files-found: warn
