name: Sovereign Engine V5 CI/CD
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Verify sovereign_node_full.py
      run: |
        retry() { local n=1; local max=3; local delay=30;
          until "$@"; do
            if [ $n -ge $max ]; then echo "Failed"; return 1; fi
            n=$((n+1)); echo "Retrying in $delay..."; sleep $delay;
          done;
        }
        retry bash -c "set -e; test -f sovereign_node_full.py; LINES=$(wc -l < sovereign_node_full.py); echo "Lines: $LINES"; if [ "$LINES" -lt 200 ]; then echo "Too short"; exit 1; fi; python sovereign_node_full.py"
    - name: Validate ledger
      run: |
        retry() { local n=1; local max=3; local delay=20;
          until "$@"; do
            if [ $n -ge $max ]; then echo "Failed"; return 1; fi
            n=$((n+1)); echo "Retrying in $delay..."; sleep $delay;
          done;
        }
        retry bash -c "python -c 'import json, os, sys; required = ["ledger_entry_757.json", "ledger_entry_758.json"]; [print("OK " + f) if os.path.exists(f) else sys.exit(1) for f in required]; print("All checks passed")'"