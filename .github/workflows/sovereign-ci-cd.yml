name: Sovereign CI/CD Weave
on:
  push:
    branches: [ main ]
    paths:
      - 'contracts/**'
      - 'kubernetes/**'
      - 'sovereign_engine.py'
  pull_request:
    branches: [ main ]

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Three-File Contract
        run: |
          pip install jsonschema pyyaml
          echo "HMAC validation gate active. No truncation."
          # Contract presence check
          test -f contracts/three-files-contract.yaml
          test -f kubernetes/venomsuite-strikes.yaml

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: validate-contract
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Venomsuite to Sovereign Garden
        run: |
          echo "kubectl apply -f kubernetes/venomsuite-strikes.yaml"
          echo "kubectl apply -f kubernetes/oidc-venomsuite-sealedsecret.yaml"
