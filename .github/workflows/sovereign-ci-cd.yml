name: Sovereign CI/CD

# Working method: GitHub-hosted ubuntu-latest, no self-hosted runner, no actions/*.
# Schedule replaces manual-only dispatch. Every 6 hours UTC.
# The other workflows are not fired here. workflow-parity.yml spaces them
# across the same 6 hours, at most 3 per 15-minute tick.
# ledger/8977.yaml stays frozen.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      oidc_provider:
        description: "recorded only; offline does not dispatch a sibling"
        type: choice
        options:
          - offline
          - github
          - aws
          - gcp
          - azure
        default: offline

permissions:
  contents: read

concurrency:
  group: sovereign-cicd-hosted-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Sovereign CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report and exit 0
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "oidc=${{ github.event.inputs.oidc_provider || 'offline' }}"
          echo "schedule=0 */6 * * * UTC"
          echo "runner=ubuntu-latest"
          echo "ledger/8977.yaml frozen; not written"
          exit 0
