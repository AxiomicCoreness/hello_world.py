name: Sovereign CI/CD

# Working method, rewired from sovereign-ci-green.yml run 37060594857 (success).
# GitHub-hosted ubuntu-latest. No self-hosted runner. No actions/* uses.
# actions/checkout and actions/setup-python are what produced startup_failure
# with 0 jobs on run 2447. Do not add them back until the allowlist allows them.
# ledger/8977.yaml stays frozen. This job does not write it.

on:
  workflow_dispatch:
    inputs:
      oidc_provider:
        description: "recorded only; offline does not dispatch a sibling"
        type: choice
        options:
          - offline
          - github
          - aws
          - gcp
          - azure
        default: offline

permissions:
  contents: read

concurrency:
  group: sovereign-cicd-hosted-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Sovereign CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report and exit 0
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "oidc=${{ github.event.inputs.oidc_provider || 'offline' }}"
          echo "runner=ubuntu-latest (GitHub-hosted, not self-hosted)"
          echo "method=sovereign-ci-green.yml"
          echo "ledger/8977.yaml frozen; not written"
          exit 0
