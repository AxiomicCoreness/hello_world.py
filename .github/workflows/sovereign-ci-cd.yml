name: Sovereign CI/CD

# 8977 remains frozen. This file does not commit ledger/8977.yaml.
# startup_failure cause (measured 2026-10-02):
#   run 2447 used actions/checkout, actions/setup-python, actions/upload-artifact
#   and completed with 0 jobs.
#   sovereign-ci-green.yml (no uses:) completed success in the same window.
# Until Settings → Actions permissions allow those actions, this workflow
# must not reference them or GitHub refuses the job graph.

on:
  workflow_dispatch:
    inputs:
      oidc_provider:
        description: "OIDC cloud provider to federate"
        type: choice
        options:
          - offline
          - github
          - aws
          - gcp
          - azure
        default: offline
  push:
    branches: [main]
    paths:
      - ".github/workflows/sovereign-ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: sovereign-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Sovereign CI/CD smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report without third-party actions
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "oidc=${{ github.event.inputs.oidc_provider || 'offline' }}"
          echo "ledger/8977.yaml is frozen; this job does not write it"
          echo "checkout/setup-python/upload-artifact omitted: allowlist blocks them"
          exit 0
