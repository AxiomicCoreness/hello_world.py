name: Sovereign Engine V5 CI/CD
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: |
        LINES=$(wc -l < sovereign_node_full.py)
        if [ "$LINES" -ne 406 ]; then exit 1; fi
        python sovereign_node_full.py
    - run: |
        import json,os
        for f in ['ledger_entry_757.json','ledger_entry_758.json']:
          if not os.path.exists(f):exit(1)
          with open(f) as file:json.load(file)
        print('All checks passed')
      shell: python