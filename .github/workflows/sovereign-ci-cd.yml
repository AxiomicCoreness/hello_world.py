name: Sovereign CI/CD Combinator (Argo)

# CI: validate contracts + Argo Application/Rollout/HTTPRoute sources
# CD: optional argocd CLI sync when ARGOCD_AUTH_TOKEN is configured
# Wood Dragon 0.91 · Entry 8817

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "kubernetes/**"
      - "k8s/**"
      - "make/**"
      - "argocd/**"
      - "sovereign_engine.py"
      - "port380_mcp.py"
      - "orchestrator/**"
      - ".github/workflows/sovereign-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "kubernetes/**"
      - "argocd/**"
      - ".github/workflows/sovereign-ci-cd.yml"
  workflow_dispatch:
    inputs:
      sync:
        description: "Run Argo CD app sync (requires secrets)"
        type: boolean
        default: false
      app_name:
        description: "Argo Application name"
        type: string
        default: "sovereign-garden"

concurrency:
  group: sovereign-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  WOOD_DRAGON_TAU: "0.91"
  PHASE_LOCK: "202.6"
  ARGO_APP: ${{ github.event.inputs.app_name || 'sovereign-garden' }}

jobs:
  # ── CI: contract + path presence ─────────────────────────────
  validate-contract:
    name: CI · Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: pip install pyyaml jsonschema

      - name: Three-file contract present
        run: |
          set -e
          test -f contracts/three-files-contract.yaml
          test -f contracts/ode_autonomy_registry.yaml
          test -f kubernetes/venomsuite-strikes.yaml || test -f make/cronjob-simd-step.yaml
          echo "HMAC validation gate active. No truncation."
          echo "WOOD_DRAGON_TAU=$WOOD_DRAGON_TAU PHASE_LOCK=$PHASE_LOCK"

  # ── CI: Argo CD combinator inputs ─────────────────────────
  validate-argo:
    name: CI · Argo manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq + pyyaml
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          pip install pyyaml

      - name: Required Argo paths exist
        run: |
          set -e
          test -f argocd/application-sovereign-garden.yaml
          test -f argocd/argocd-ignore-differences-httproute.yaml
          test -f argocd/rollout-sovereign-garden-gateway-multistage.yaml
          test -f argocd/rollout-sovereign-garden-gateway-header.yaml
          test -f argocd/sovereign-garden-stable.yaml
          test -f argocd/sovereign-garden-canary.yaml
          test -f argocd/sovereign-garden-httproute.yaml
          echo "Argo combinator inputs OK"

      - name: Application has selfHeal + RespectIgnoreDifferences path
        run: |
          set -e
          # automated.selfHeal must be true on primary Application
          yq -e '.spec.syncPolicy.automated.selfHeal == true' argocd/application-sovereign-garden.yaml
          # ignoreDifferences on HTTPRoute rules (canary-safe)
          yq -e '.spec.ignoreDifferences[] | select(.kind == "HTTPRoute")' argocd/application-sovereign-garden.yaml
          # fragment carries RespectIgnoreDifferences
          grep -q 'RespectIgnoreDifferences=true' argocd/argocd-ignore-differences-httproute.yaml
          echo "selfHeal + ignoreDifferences contract held"

      - name: Multistage weight sequence is 20/40/60/80/100
        run: |
          set -e
          python3 - <<'PY'
          import re, pathlib, sys
          text = pathlib.Path("argocd/rollout-sovereign-garden-gateway-multistage.yaml").read_text()
          weights = [int(x) for x in re.findall(r"setWeight:\s*(\d+)", text)]
          expect = [20, 40, 60, 80, 100]
          if weights != expect:
              print("weights found:", weights, "expected:", expect)
              sys.exit(1)
          print("multistage weights OK:", weights)
          PY

      - name: YAML parse all argocd/*.yaml
        run: |
          set -e
          python3 - <<'PY'
          import sys, pathlib, yaml
          root = pathlib.Path("argocd")
          for p in sorted(root.glob("*.yaml")):
              docs = list(yaml.safe_load_all(p.read_text()))
              assert docs, p
              print(f"OK {p} ({len(docs)} doc(s))")
          PY

  # ── CD: dry-run echo or live argocd sync ───────────────────
  deploy-argo:
    name: CD · Argo sync
    runs-on: ubuntu-latest
    needs: [validate-contract, validate-argo]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Combinator plan (always)
        run: |
          cat <<EOF
          === Sovereign CD combinator ===
          App:        $ARGO_APP
          Source:     argocd/ + kubernetes/
          Policy:     automated selfHeal + prune (Application)
          Canary:     gatewayAPI plugin · weights 20/40/60/80/100
          Ignore:     HTTPRoute.spec.rules while gatewayapi-canary=in-progress
          WoodDragon: $WOOD_DRAGON_TAU  Phase: $PHASE_LOCK
          Sync input: ${{ github.event.inputs.sync || 'false' }}
          Token set:  ${{ secrets.ARGOCD_AUTH_TOKEN != '' }}
          EOF

      - name: kubectl apply dry-run (manifests only)
        run: |
          set -e
          # No cluster required: client-side validate structure if kubectl exists
          if command -v kubectl >/dev/null 2>&1; then
            kubectl apply --dry-run=client -f argocd/sovereign-garden-stable.yaml || true
            kubectl apply --dry-run=client -f argocd/sovereign-garden-canary.yaml || true
            kubectl apply --dry-run=client -f argocd/sovereign-garden-httproute.yaml || true
            kubectl apply --dry-run=client -f argocd/rollout-sovereign-garden-gateway-multistage.yaml || true
            echo "client dry-run complete"
          else
            echo "kubectl not installed on runner — skip client dry-run"
          fi

      - name: Argo CD live sync (optional)
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.sync == 'true')
          || (env.FORCE_ARGO_SYNC == 'true')
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -e
          if [ -z "${ARGOCD_AUTH_TOKEN}" ] || [ -z "${ARGOCD_SERVER}" ]; then
            echo "ARGOCD_SERVER / ARGOCD_AUTH_TOKEN not configured — CD live sync skipped"
            exit 0
          fi
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v2.12.6/argocd-linux-amd64
          chmod +x /tmp/argocd
          /tmp/argocd app sync "$ARGO_APP" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          /tmp/argocd app wait "$ARGO_APP" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web --health --timeout 300

      - name: Legacy k8s path notice
        run: |
          echo "Legacy: kubectl apply -f kubernetes/venomsuite-strikes.yaml (prefer Argo Application path)"
