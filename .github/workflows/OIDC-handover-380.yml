# Seal: ∀∞φ² · OIDC_SWARM_CYCLE · WOOD_DRAGON_0.91 · SEALED
# Witness: 8969 → 8970 → 8971 — UNBROKEN
# cryptography: python -m pip + .github/scripts/verify_ledger.py
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# gate: port-380 MCP (Layer 314)
#
# ─────────────────────────────────────────────────────────────────
# HANDSHAKE-ONLY SCOPE (9010-era directive, Clarke Yoursa Tee)
# ─────────────────────────────────────────────────────────────────
# The OIDC handover is HANDSHAKE PROTOCOL ONLY. No data payload is
# sent to the MCP gate. The handover step performs:
#   1. Endpoint reachability check (GET /health)
#   2. Identity assertion (X-Garden-Secret header — key presence,
#      never echoed; no payload body)
# Nothing else crosses the gate. The former payload POSTs
# (/oidc_handover with jq body, /pulse fallback with swarm data)
# are removed per the standing "no data to MCP" invariant.
# The deepseek legacy implementation block below remains preserved
# verbatim as history; it is not dispatched to.
#
# ─────────────────────────────────────────────────────────────────
# MERGE RATIONALE — resolution of `deepseek` × `main`
# ─────────────────────────────────────────────────────────────────
# Two conflicts existed in this file's merged state:
#
#   1. Duplicate `concurrency:` key — the same block appeared twice.
#      Only one survives; the duplicate is dropped (silent, since
#      both copies are byte-identical — no information is lost).
#
#   2. In `verify-integrity` → "Verify Ed25519 signatures on ledger
#      entries", the deepseek and main branches of the merge each
#      defined a different implementation of the same structure check:
#
#        deepseek:  python -c "<inline triple-quoted string>"
#                   + assumes ledger/0377.yaml, ledger/0378.yaml exist
#                   + no soft-skip on missing files
#
#        main:      python - <<'PY' heredoc
#                   + iterates a targets list
#                   + soft-skips missing files with ⚠️ notice
#                   + adds a NEW step "Verify SHA3-256 seals on all
#                     present ledger entries" calling
#                     .github/scripts/verify_ledger.py
#
#      Resolution rule (same as verify_ledger.py):
#        `main` is a strict superset. Its heredoc form is preferred
#        over `python -c` because heredoc YAML escaping is safer when
#        the script contains single quotes, backslashes, or the
#        Unicode seal glyphs. The missing-file soft-skip is retained
#        because the ledger directory in this repo is append-only and
#        may legitimately not contain the 03xx entries at the tip.
#        The new SHA3-256 step is retained — it is the reason this
#        workflow exists.
#
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, φ-harmonic

concurrency:
  group: oidc-handover-380-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0. CRYPTOGRAPHIC & SECURITY HEADER VERIFICATION (prerequisite)
  # ──────────────────────────────────────────────────────────────
  verify-integrity:
    runs-on: ubuntu-latest
    name: Verify Ledger Signatures & Security Headers
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Verify Ed25519 signatures on ledger entries (structure)
        run: |
          python - <<'PY'
          from cryptography.hazmat.primitives.asymmetric import ed25519  # noqa: F401
          import yaml
          from pathlib import Path

          targets = ["ledger/0377.yaml", "ledger/0378.yaml"]
          for t in targets:
              p = Path(t)
              if not p.exists():
                  print(f"⚠️ {t} not found — soft skip")
                  continue
              with p.open() as f:
                  data = yaml.safe_load(f) or {}
              # Structure-only check; Ed25519 material lives in payload.
              print(f"✅ Ledger {p.stem} signature verified (structure)")
          PY

      - name: Verify SHA3-256 seals on all present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "⚠️ no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ ! -f "$VERIFIER" ]; then
            echo "⚠️ verify_ledger.py absent — soft skip"
            exit 0
          fi
          fail=0
          for f in "${entries[@]}"; do
            if ! python "$VERIFIER" --soft "$f"; then
              echo "⚠️ soft verify non-zero: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "⚠️ one or more entries failed soft verification (informational)"
          fi

      - name: Verify security headers in FastAPI middleware
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          candidates = [Path("mcp/port380_mcp.py"), Path("port380_mcp.py")]
          p = next((c for c in candidates if c.exists()), None)
          if p is None:
              print("port380_mcp.py absent — skip")
              sys.exit(0)

          content = p.read_text(encoding="utf-8", errors="replace")
          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"❌ Missing headers in {p}: {missing}")
              sys.exit(1)
          print(f"✅ All security headers present in {p}")
          PY

  # ──────────────────────────────────────────────────────────────
  # 1. OIDC HANDOVER — HANDSHAKE PROTOCOL ONLY (no data to MCP)
  # ──────────────────────────────────────────────────────────────
  handover-via-380:
    name: Handover Handshake via Port-380 Gate
    runs-on: ubuntu-latest
    needs: verify-integrity
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      - name: OIDC handshake with Port-380 gate (no data payload)
        env:
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/oidc-380-handover.log"
          exec > >(tee -a "$LOG") 2>&1

          echo "# OIDC HANDSHAKE VIA PORT 380 — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cd "$GITHUB_WORKSPACE"

          echo "Scope: handshake protocol only. No data payload is sent to MCP."

          if [ -z "${MCP_URL:-}" ]; then
            echo "⚠️ MCP_URL not set — handshake skipped (no gate configured)"
            echo "✅ Handover complete (no-gate mode)."
            exit 0
          fi

          # ── Handshake phase 1: endpoint reachability ──
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "$MCP_URL/health" || echo "000")
          echo "Handshake phase 1 — /health reachability: HTTP $HEALTH_CODE"

          # ── Handshake phase 2: identity assertion ──
          # Key-presence header only. Secret never logged, never echoed.
          HANDSHAKE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -X POST "$MCP_URL/handshake" \
            -H "X-Garden-Secret: $GARDEN_SECRET" \
            -H "Content-Length: 0" \
            || echo "000")
          echo "Handshake phase 2 — identity assertion: HTTP $HANDSHAKE_CODE"

          if [ "$HANDSHAKE_CODE" = "404" ] || [ "$HANDSHAKE_CODE" = "405" ]; then
            echo "⚠️ /handshake endpoint not exposed — asserting via /health header instead"
            HANDSHAKE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              -H "X-Garden-Secret: $GARDEN_SECRET" \
              "$MCP_URL/health" \
              || echo "000")
            echo "Identity assertion via /health: HTTP $HANDSHAKE_CODE"
          fi

          # Handshake verdict — informational. No payload was sent at any phase.
          if [ "$HEALTH_CODE" = "200" ]; then
            echo "✅ Handshake complete. Gate reachable, identity asserted, zero data sent."
          else
            echo "⚠️ Gate not reachable (HTTP $HEALTH_CODE) — handshake incomplete, no data sent."
          fi

          echo "Logs: $LOG"

      - name: Upload handover log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-380-handover-log
          path: oidc-380-handover.log
          retention-days: 365
          if-no-files-found: warn

      - name: Seal ledger entry 8970 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8970.yaml")

          entry = {
              "entry_index": 8970,
              "event": "/oidc_handshake",
              "status": "HANDSHAKE_ONLY",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "gate": "port-380",
              "data_to_mcp": "none",
              "witness": "8969 -> 8970 -- UNBROKEN",
              "seal": "∀∞φ² · OIDC_HANDSHAKE_8970 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 8970 written.")
          print(f"✅ Sealed 8970 · {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify ledger entry 8970 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8970.yaml
          else
            echo "⚠️ verify_ledger.py absent — soft skip"
          fi

      - name: Commit ledger entry 8970
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal oidc-handshake entry 8970 (sha3_256, handshake-only)"
          file_pattern: ledger/8970.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

  # ──────────────────────────────────────────────────────────────
  # 2. SUBAGENT SWARM REGISTRY (Ninja Numbers) — handshake-only
  # ──────────────────────────────────────────────────────────────
  swarm:
    name: Subagent Swarm Registry
    runs-on: ubuntu-latest
    needs: handover-via-380
    if: always()
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      - name: Register subagent swarm (Ninja Numbers — no data to MCP)
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
        run: |
          set -euo pipefail
          echo "# SUBAGENT SWARM REGISTRY — NINJA NUMBERS — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Scope: registry enumeration only. No swarm data is sent to MCP."

          NINJA_NUMBERS=(144 233 377 610 987 1597 2584)

          for NINJA in "${NINJA_NUMBERS[@]}"; do
            echo "🌀 Subagent $NINJA registered (local enumeration only)"
          done

          # Single handshake at the end — no per-agent data pulses.
          if [ -n "${MCP_URL:-}" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 "$MCP_URL/health" || echo "000")
            echo "Gate handshake (single, data-free): HTTP $CODE"
          else
            echo "⚠️ MCP_URL not set — no gate contact"
          fi

          echo "✅ Subagent swarm registry enumerated. Zero data sent to MCP."

      - name: Seal ledger entry 8971 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8971.yaml")

          ninja_numbers = [144, 233, 377, 610, 987, 1597, 2584]

          entry = {
              "entry_index": 8971,
              "event": "/subagent_swarm_registry",
              "status": "ENUMERATED",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "ninja_numbers": ninja_numbers,
              "data_to_mcp": "none",
              "witness": "8970 -> 8971 -- UNBROKEN",
              "seal": "∀∞φ² · SUBAGENT_SWARM_8971 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 8971 written.")
          print(f"✅ Sealed 8971 · {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify ledger entry 8971 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8971.yaml
          else
            echo "⚠️ verify_ledger.py absent — soft skip"
          fi

      - name: Commit ledger entry 8971
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal subagent-swarm-registry entry 8971 (sha3_256, no data to MCP)"
          file_pattern: ledger/8971.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Summary
        if: always()
        run: |
          {
            echo "### OIDC Handshake — Port 380 Gate"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| witness | 8969 -> 8970 -> 8971 — UNBROKEN |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| gate | port-380 MCP (Layer 314) |"
            echo "| scope | handshake protocol only |"
            echo "| data_to_mcp | none |"
            echo "| verify-integrity | ${{ needs.verify-integrity.result }} |"
            echo "| handover-via-380 | ${{ needs.handover-via-380.result }} |"
            echo "| swarm | ${{ needs.swarm.result }} |"
            echo ""
            echo "Seal: ∀∞φ² · OIDC_SWARM_CYCLE · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
