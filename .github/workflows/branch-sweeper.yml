name: Branch sweeper
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete fully-merged branches (never main, never protected)
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v '^origin/main$'); do
            b="${ref#origin/}"
            # skip protected prefixes
            case "$b" in
              main|release*|protected*) echo "skip ${b} (protected)"; continue ;;
            esac
            # delete ONLY if every commit of the branch is already in main
            if git merge-base --is-ancestor "origin/${b}" origin/main; then
              echo "deleting fully-merged branch: ${b}"
              git push origin --delete "${b}"
            else
              echo "keeping ${b} (contains unmerged commits)"
            fi
          done
