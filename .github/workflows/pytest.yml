name: pytest

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            python -m pip install --upgrade pip
            if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
            if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
            pip install pytest numpy fastapi uvicorn pydantic prometheus_client

      - name: Run pytest (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: pytest -q

      - name: Import check (api + prometheus)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 15
          command: |
            python -c "from core.api import app; print('core.api import OK, routes:', len(app.routes))"
