name: Pytest · dual-gate ledger

on:
  push:
    branches: [main, "feat/*", grok-skill_tensor]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/pytest.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pytest-dual-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger.v2 # FIXED: Updated to the v2 directory

jobs:
  verify-integrity:
    name: Verify Ledger Signatures & Security Headers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # FIXED: Pull in TeaVM/DeepInfer dependencies

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml jax jaxlib # FIXED: Added jax dependencies

      - name: Verify Ledger (Dynamic)
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          
          if [ ! -f "$VERIFIER" ]; then
            echo "verify_ledger.py absent — skip"
            exit 0
          fi

          # FIXED: Dynamically target ledger.v2/ instead of hardcoded 9240-9245
          entries=(ledger.v2/*.yml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No entries in ledger.v2/ — skip"
            exit 0
          fi

          # Hard check the entire v2 ledger
          python "$VERIFIER" --hard "${entries[@]}"

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-integrity
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -q -r requirements-ci.txt || true; fi
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt || true; fi
          # FIXED: Added jax, jaxlib, torch so the DeepInfer/TOI tests can run
          pip install -q cryptography pyyaml requests flake8 pytest numpy jax jaxlib torch || true

      - name: Run pytest
        run: |
          # FIXED: Removed `exit 0`. If tests fail, the job now fails.
          # FIXED: Ignored the GPU-specific folders so CI doesn't crash.
          PYTHONPATH=. python -m pytest -q --tb=short \
            --ignore=vendor \
            --ignore=multibody_simulator/tests \
            -m "not gpu"

  summary:
    name: Summary (no ledger rewrite)
    runs-on: ubuntu-latest
    needs: [verify-integrity, test]
    if: always()
    steps:
      - name: Write step summary
        run: |
          {
            echo "### Pytest · dual-gate ledger"
            echo ""
            echo "| Gate | Mode |"
            echo "|------|------|"
            echo "| ledger.v2/*.yml | hard |"
            echo ""
            echo "Display name distinct from sovereign-cicd.yml (Sovereign CI/CD)."
            echo "No sealed ledger body rewritten."
          } >> "$GITHUB_STEP_SUMMARY"
