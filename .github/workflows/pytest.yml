name: pytest

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          retry() {
            local n=1
            local max=3
            local delay=30
            until "$@"; do
              if [ $n -ge $max ]; then echo "Failed after $n attempts"; return 1; fi
              n=$((n+1))
              echo "Retrying in $delay seconds..."
              sleep $delay
            done
          }
          retry bash -c "python -m pip install --upgrade pip && pip install pytest numpy fastapi uvicorn pydantic prometheus_client"
      - name: Run pytest
        run: |
          retry() {
            local n=1
            local max=3
            local delay=20
            until "$@"; do
              if [ $n -ge $max ]; then echo "Failed after $n attempts"; return 1; fi
              n=$((n+1))
              echo "Retrying in $delay seconds..."
              sleep $delay
            done
          }
          retry pytest -q