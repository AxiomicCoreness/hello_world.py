name: Sovereign CI/CD

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      OIDC_CLIENT_SECRET: "ci_dummy_secret_32chars_minimum_xx"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps (with inline retry)
        run: |
          retry() {
            local n=1
            local max=3
            local delay=30
            until "$@"; do
              if [ $n -ge $max ]; then
                echo "Command failed after $n attempts."
                return 1
              fi
              n=$((n+1))
              echo "Retrying in $delay seconds..."
              sleep $delay
            done
          }
          retry bash -c "python -m pip install --upgrade pip && if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi && if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi"

      - name: Lint with flake8 (report strict; do not block style)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Run pytest (no retry, fail cleanly)
        run: |
          pytest -q --tb=line || pytest tests -q --tb=line

      - name: Import check (hello_world + routes)
        run: |
          python -c "from hello_world import app; print('hello_world import OK, routes:', len(app.routes))" || echo "hello_world import soft-fail"

      - name: Run test_all.py (single-pass Garden verification)
        run: |
          if [ -f test_all.py ]; then
            python test_all.py || true
          elif [ -f tests/test_all.py ]; then
            python tests/test_all.py || true
          else
            echo "test_all.py not found — skipping"
          fi
