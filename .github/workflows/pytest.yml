name: Pytest · dual-gate ledger

on:
  push:
    branches: [main, "feat/*", grok-skill_tensor]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/pytest.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pytest-dual-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger.v2 # FIXED: Updated to target the v2 directory

jobs:
  verify-integrity:
    name: Verify Ledger Signatures & Security Headers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # FIXED: Pulls in TeaVM, DeepSelect, etc.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml jax jaxlib torch # FIXED: Added missing heavy deps

      - name: Verify Ledger (Dynamic)
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          
          if [ ! -f "$VERIFIER" ]; then
            echo "verify_ledger.py absent — skip"
            exit 0
          fi

          # FIXED: Dynamically target ledger.v2/ instead of hardcoded 9240-9245
          entries=(ledger.v2/*.yml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No entries in ledger.v2/ — skip"
            exit 0
          fi

          # Hard check the entire v2 ledger
          python "$VERIFIER" --hard "${entries[@]}"

      - name: Verify Ed25519 signatures on ledger entries (soft)
        id: ed25519
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          p = Path("ledger.v2/9298.yml") # Updated target
          if not p.exists():
              print("ledger.v2/9298.yml not present — soft skip")
              sys.exit(0)
          try:
              from cryptography.hazmat.primitives.asymmetric import ed25519  # noqa: F401
              import yaml
              data = yaml.safe_load(p.read_text()) or {}
              print(f"Ed25519 structure soft-check ok (entry_index={data.get('entry_index')})")
          except ImportError as e:
              print(f"missing dependency {e} — soft skip")
          PY

      - name: Verify security headers in FastAPI middleware (source)
        id: headers_source
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          candidates = [Path("mcp/port380_mcp.py"), Path("port380_mcp.py")]
          p = next((c for c in candidates if c.exists()), None)
          if p is None:
              print("port380_mcp.py not present — soft skip")
              sys.exit(0)
          content = p.read_text(encoding="utf-8", errors="replace")
          required = [
              "CORSMiddleware", "SecurityHeadersMiddleware",
              "Content-Security-Policy", "Strict-Transport-Security",
              "X-Content-Type-Options", "X-Frame-Options",
              "Referrer-Policy", "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"Missing headers in {p}: {missing}")
              sys.exit(1)
          print(f"All security headers present in {p}")
          PY

      - name: Verify live security headers from MCP_URL (soft)
        id: headers_live
        continue-on-error: true
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_URL:-}" ]; then
            echo "MCP_URL not set — soft skip"
            exit 0
          fi
          echo "Checking live headers from $MCP_URL"
          curl -s -I -X GET --max-time 15 "$MCP_URL/health" || echo "reach soft-fail"

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-integrity
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -q -r requirements-ci.txt || true; fi
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt || true; fi
          pip install -q cryptography pyyaml requests flake8 pytest numpy jax jaxlib torch || true

      - name: Run pytest
        run: |
          # FIXED: Removed `exit 0`. If tests fail, the job now fails.
          # FIXED: Ignored the GPU-specific folders so CI doesn't crash.
          PYTHONPATH=. python -m pytest -q --tb=short \
            --ignore=vendor \
            --ignore=multibody_simulator/tests \
            --continue-on-collection-errors \
            -m "not gpu"

  summary:
    name: Summary (no ledger rewrite)
    runs-on: ubuntu-latest
    needs: [verify-integrity, test]
    if: always()
    steps:
      - name: Write step summary
        run: |
          {
            echo "### Pytest · dual-gate ledger"
            echo ""
            echo "| Gate | Mode |"
            echo "|------|------|"
            echo "| ledger.v2/*.yml | hard |"
            echo ""
            echo "Display name distinct from sovereign-cicd.yml (Sovereign CI/CD)."
            echo "No sealed ledger body rewritten."
          } >> "$GITHUB_STEP_SUMMARY"
