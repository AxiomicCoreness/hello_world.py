name: gate-diag-9263
on:
  push:
    branches: [mistral-gate-diag-9263]
    paths: ['.github/workflows/gate-diag-9263.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: run-verifier-run4
        run: |
          set +e
          python3 .github/scripts/verify_ledger_seals.py . --require 8958 --require 8959 > gate_diag_output4.txt 2>&1
          echo "verifier_exit=$?" >> gate_diag_output4.txt
      - name: commit-output
        run: |
          git config user.name "mistral-gate-diag"
          git config user.email "actions@github.com"
          git add gate_diag_output4.txt
          git commit -m "gate diag run 4 output"
          git push
