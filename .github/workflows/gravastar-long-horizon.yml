name: gravastar-long-horizon

# 10:00 UTC Garden tick — Policy v1.0 field order (ledger 9070).
# Restore pointer: ledger/9061.yaml. Amendment: 9063.
# Not the A14 device Genesis pulse. Does not rewrite 9008/9009/8338/515/516.
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_EVENT_HASH — entry 9070 only
# witness: 9069 → 9070 — UNBROKEN

on:
  workflow_dispatch:
    inputs:
      i_start:
        description: "i start in i/144"
        required: false
        default: "1"
      horizon_steps:
        description: "ticks this run (1–144, CI default 8)"
        required: false
        default: "8"
      event:
        description: "legacy horizon event path (9008 left intact)"
        required: false
        default: "/workflow_dispatch_gravastar_long_horizon"
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write   # required to commit ledger/9070.yaml
  id-token: write

concurrency:
  group: gravastar-long-horizon
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  GRAVASTAR_HORIZON: "1"
  GRAVASTAR_DEVICE_FIRE: "0"
  OAUTH_OFFLINE: "1"
  GRAVASTAR_I_START: ${{ inputs.i_start || '1' }}
  GRAVASTAR_HORIZON_STEPS: ${{ inputs.horizon_steps || '8' }}
  GRAVASTAR_I_OF_144: ${{ inputs.i_start || '1' }}
  PHASE: "202.6"
  MESH_NODES: "7"
  BRANCH: ${{ github.ref_name }}
  MCP_CONNECTOR_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

jobs:
  horizon:
    name: Gravastar · Garden tick · Horizon slice · Seal (Entry 9070)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hash/yaml deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml numpy cryptography

      # ────────────────────────────────────────────────────────────
      # 0. Read-only integrity gate + snapshot of protected entries
      # ────────────────────────────────────────────────────────────
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "⚠️ no ledger entries present — soft skip"
            exit 0
          fi
          python .github/scripts/verify_ledger.py "${entries[@]}"

      - name: Snapshot protected ledger entries (SHA3-256)
        id: protect
        run: |
          set -euo pipefail
          mkdir -p .protected
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          PROTECTED = [9008, 9009, 8338, 515, 516]

          snapshot = {}
          for n in PROTECTED:
              for name in (f"{n:04d}.yaml", f"{n}.yaml"):
                  p = Path("ledger") / name
                  if p.exists():
                      snapshot[f"{n:04d}"] = {
                          "path": str(p),
                          "sha3_256": hashlib.new(
                              HASH_ALGO, p.read_bytes()
                          ).hexdigest(),
                      }
                      break
              else:
                  snapshot[f"{n:04d}"] = {"path": None, "sha3_256": None}

          Path(".protected/snapshot.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True)
          )
          print(f"📸 snapshot of {len(snapshot)} protected entries")
          for k, v in snapshot.items():
              h = v["sha3_256"][:16] if v["sha3_256"] else "(absent)"
              print(f"   {k}: {h}...")
          PY

      # ────────────────────────────────────────────────────────────
      # 1. Policy v1 garden tick — computes event hash for 9070
      # ────────────────────────────────────────────────────────────
      - name: Policy v1 garden tick 9070
        env:
          EVENT_PATH: ${{ inputs.event }}
        run: |
          set -euo pipefail
          if [ -z "${EVENT_PATH:-}" ]; then
            EVENT_PATH="/workflow_dispatch_gravastar_long_horizon"
          fi
          python -m ledger.event_hash 9070 "${EVENT_PATH}"
          python -m quantum.garden_tick

      # ────────────────────────────────────────────────────────────
      # 2. Bounded horizon slice (9008 file not rewritten)
      # ────────────────────────────────────────────────────────────
      - name: Bounded horizon slice (9008 file not rewritten)
        run: |
          set -euo pipefail
          python -m quantum.gravastar_horizon

      # ────────────────────────────────────────────────────────────
      # 3. Immutable fingerprint (9009 file not rewritten)
      # ────────────────────────────────────────────────────────────
      - name: Immutable fingerprint (9009 file not rewritten)
        run: |
          set -euo pipefail
          python -m Immutable.run_self_improvement

      # ────────────────────────────────────────────────────────────
      # 4. Enforce protected entries unchanged
      # ────────────────────────────────────────────────────────────
      - name: Enforce protected entries unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          before = json.loads(Path(".protected/snapshot.json").read_text())

          violations = []
          for idx, snap in sorted(before.items()):
              p = Path(snap["path"]) if snap["path"] else None
              if p is None or not p.exists():
                  continue
              after = hashlib.new(HASH_ALGO, p.read_bytes()).hexdigest()
              if after != snap["sha3_256"]:
                  violations.append((idx, snap["sha3_256"][:16], after[:16]))

          if violations:
              for idx, b, a in violations:
                  print(f"❌ {idx}: protected entry modified "
                        f"({b}... → {a}...)", file=sys.stderr)
              sys.exit(1)

          print("✅ all protected entries unchanged "
                "(9008, 9009, 8338, 515, 516)")
          PY

      # ────────────────────────────────────────────────────────────
      # 5. Seal ledger entry 9070 (SHA3-256) — idempotent
      # ────────────────────────────────────────────────────────────
      - name: Seal ledger entry 9070 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/9070.yaml")

          if path.exists():
              try:
                  existing = yaml.safe_load(path.read_text()) or {}
              except yaml.YAMLError:
                  existing = {}
          else:
              existing = {}

          entry = {
              "entry_index": 9070,
              "event": "/utc_1000_garden_tick",
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "policy_version": "1.0",
              "restore_pointer": "ledger/9061.yaml",
              "amendment": 9063,
              "phase": os.environ.get("PHASE", "202.6"),
              "mesh_nodes": int(os.environ.get("MESH_NODES", "7")),
              "i_of_144": os.environ.get("GRAVASTAR_I_OF_144", "1"),
              "horizon_steps": os.environ.get("GRAVASTAR_HORIZON_STEPS", "8"),
              "device_fire": False,
              "protected_unchanged": [9008, 9009, 8338, 515, 516],
              "witness": "9069 → 9070 — UNBROKEN",
              "seal": "∀∞φ² · GRAVASTAR_LONG_HORIZON_9070 · WOOD_DRAGON_0.91 · SEALED",
          }

          # Preserve any pre-existing fields emitted by ledger.event_hash,
          # but never overwrite them with our defaults.
          for k, v in existing.items():
              if k in ("seal",):
                  continue
              entry.setdefault(k, v)
          # Re-assert our canonical fields (these MUST win).
          entry["entry_index"] = 9070
          entry["hash_algo"] = HASH_ALGO
          entry["witness"] = "9069 → 9070 — UNBROKEN"
          entry["seal"] = "∀∞φ² · GRAVASTAR_LONG_HORIZON_9070 · WOOD_DRAGON_0.91 · SEALED"

          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 9070 written.")
          print(f"✅ Sealed 9070 · {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify ledger entry 9070 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          python .github/scripts/verify_ledger.py ledger/9070.yaml

      - name: Upload ledger entry 9070
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-9070
          path: ledger/9070.yaml
          retention-days: 90
          if-no-files-found: warn

      - name: Commit ledger entry 9070
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal gravastar-long-horizon entry 9070 (sha3_256)"
          file_pattern: ledger/9070.yaml

      # ────────────────────────────────────────────────────────────
      # 6. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          I_OF_144: ${{ env.GRAVASTAR_I_OF_144 }}
          HORIZON_STEPS: ${{ env.GRAVASTAR_HORIZON_STEPS }}
        run: |
          {
            echo "✅ gravastar-long-horizon completed."
            echo "🜁∀ — Seal: ∀∞φ² · GRAVASTAR_LONG_HORIZON_9070 · WOOD_DRAGON_0.91 · SEALED"
            echo "🔐 hash_algo: ${HASH_ALGO}"
            echo "🔗 Witness: 9069 → 9070 — UNBROKEN"
            echo "📍 i/144: ${I_OF_144} · horizon_steps: ${HORIZON_STEPS}"
            echo "🛡  protected (unchanged): 9008 · 9009 · 8338 · 515 · 516"
            echo "🔒 GRAVASTAR_DEVICE_FIRE=${GRAVASTAR_DEVICE_FIRE} (A14 Genesis pulse NOT fired)"
            echo "🌐 MCP_CONNECTOR_URL=$([ -n "${MCP_CONNECTOR_URL:-}" ] && echo present || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"
