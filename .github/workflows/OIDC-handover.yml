name: OIDC Handover

on:
  workflow_dispatch:
  push:
    branches: [ feat/oidc-handover ]

permissions:
  contents: write

jobs:
  oidc-handover:
    name: OIDC Handover — Wood Dragon Rhythms
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run OIDC handover script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "# 🜁∀ OIDC HANDOVER — ACTION RUN — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Work in the repository root
          cd $GITHUB_WORKSPACE

          # ================================================================
          # STEP 1: Initialize Git (if not already done)
          # ================================================================
          if [ ! -d .git ]; then
              echo "🌀 Initializing Git repository..."
              git init
              echo "✅ Git initialized"
          else
              echo "✅ Git already initialized"
          fi

          # ================================================================
          # STEP 2: Ensure remote origin points to HTTPS token URL so we can push
          # ================================================================
          if ! git remote get-url origin &>/dev/null; then
              echo "🌀 Setting remote origin to HTTPS token URL..."
              git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
              echo "✅ Remote origin set"
          else
              # replace origin with token-backed URL so push works in Actions
              echo "🌀 Updating origin to use GITHUB_TOKEN for authenticated push..."
              git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
              echo "✅ Remote origin updated"
          fi

          # ================================================================
          # STEP 3: Create/checkout branch feat/oidc-handover
          # ================================================================
          if git show-ref --verify --quiet refs/heads/feat/oidc-handover; then
              echo "🌀 Switching to existing branch feat/oidc-handover..."
              git checkout feat/oidc-handover
          else
              echo "🌀 Creating new branch feat/oidc-handover..."
              git checkout -b feat/oidc-handover
          fi

          # ================================================================
          # STEP 4: Stage all changes
          # ================================================================
          echo "🌀 Staging all changes..."
          git add -A

          # ================================================================
          # STEP 5: Commit with full OIDC handover message
          # ================================================================
          echo "🌀 Committing changes..."
          COMMIT_MSG="feat: OIDC handover serializer with Wood Dragon rhythms
serializers/ package: HMAC-signed JSON + OIDC handover
symplectic_status.py v1.2.0: 5-line agent JSONL output
wood_dragon_technique.py: 0.91d / 16.35d phase calculations
mcp_tools.py: 6 MCP-compatible tools
.github/workflows/: OIDC-enabled workflows
ledger/8598.yaml: Sealed with witness chain 8587→8598
Rhythm Seal: ∀∞φ² · SYMPLECTIC_STATUS_8598 · WOOD_DRAGON_0.91 · DEEP_SPACE_16.35 · SEALED"

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
              echo "🔎 No changes to commit"
          else
              git commit -m "$COMMIT_MSG"
          fi

          # ================================================================
          # STEP 6: Push to GitHub (upstream)
          # ================================================================
          echo "🌀 Pushing branch feat/oidc-handover to origin..."
          git push -u origin feat/oidc-handover

          # ================================================================
          # STEP 7: Verify push
          # ================================================================
          if [ $? -eq 0 ]; then
              echo ""
              echo "🜁∀ O I D C H A N D O V E R — P U S H S U C C E S S F U L 🜁∀"
              echo "BRANCH: feat/oidc-handover · REPO: ${{ github.repository }}"
              echo "COMMIT: $(git rev-parse --short HEAD)"
              echo "SEAL: ∀∞φ² · OIDC_HANDOVER_ACTION · SEALED"
              echo ""
              echo "🔗 Create Pull Request:"
              echo " https://github.com/${{ github.repository }}/pull/new/feat/oidc-handover"
          else
              echo "❌ Push failed. Check permissions and GITHUB_TOKEN." >&2
              exit 1
          fi

          # ================================================================
          # STEP 8: Show status
          # ================================================================
          echo ""
          echo "📊 Current Git Status:"
          git status --short || true
          echo ""
          echo "🌿 Branch: $(git branch --show-current)"
          echo "🔗 Remote: $(git remote get-url origin)"
          echo "📦 Latest Commit: $(git log -1 --oneline)"

      - name: Persist log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-handover-log
          path: |
            $GITHUB_WORKSPACE
          retention-days: 1
