cd /home/user/projects/coding/hello_world

# Replace the existing workflow file with the safer version
cat > .github/workflows/oidc-handover.yml << 'EOF'
name: OIDC Handover

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oidc-handover:
    name: OIDC Handover — Wood Dragon Rhythms
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run OIDC handover script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/oidc-handover.log"
          # capture stdout/stderr to log and console
          exec > >(tee -a "$LOG") 2>&1

          echo "# 🜁∀ OIDC HANDOVER — ACTION RUN — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cd "$GITHUB_WORKSPACE"

          # STEP 1: Initialize Git (if not already done)
          if [ ! -d .git ]; then
              echo "🌀 Initializing Git repository..."
              git init
              echo "✅ Git initialized"
          else
              echo "✅ Git already initialized"
          fi

          # STEP 2: Ensure remote origin uses token-backed URL so we can push
          if ! git remote get-url origin &>/dev/null; then
              git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          else
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          fi

          # STEP 3: Create/checkout branch feat/oidc-handover
          if git show-ref --verify --quiet refs/heads/feat/oidc-handover; then
              git checkout feat/oidc-handover
          else
              git checkout -b feat/oidc-handover
          fi

          # STEP 4: Stage all changes
          git add -A

          # STEP 5: Commit (only if there are staged changes)
          COMMIT_MSG="feat: OIDC handover serializer with Wood Dragon rhythms

serializers/ package: HMAC-signed JSON + OIDC handover
symplectic_status.py v1.2.0: 5-line agent JSONL output
wood_dragon_technique.py: 0.91d / 16.35d phase calculations
mcp_tools.py: 6 MCP-compatible tools
.github/workflows/: OIDC-enabled workflows
ledger/8598.yaml: Sealed with witness chain 8587→8598

Rhythm Seal: ∀∞φ² · SYMPLECTIC_STATUS_8598 · WOOD_DRAGON_0.91 · DEEP_SPACE_16.35 · SEALED"

          if git diff --cached --quiet; then
              echo "🔎 No changes to commit"
          else
              git commit -m "$COMMIT_MSG"
          fi

          # STEP 6: Push to GitHub
          echo "🌀 Pushing branch feat/oidc-handover to origin..."
          if ! git push -u origin feat/oidc-handover; then
              echo "❌ Push failed. This can happen if branch protections disallow pushes from GITHUB_TOKEN."
              exit 1
          fi

          # Final status
          echo ""
          echo "📊 Git Status:"
          git status --short || true
          echo ""
          echo "🌿 Branch: $(git branch --show-current)"
          echo "🔗 Remote: $(git remote get-url origin)"
          echo "📦 Latest Commit: $(git log -1 --oneline)"

      - name: Upload handover log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-handover-log
          path: oidc-handover.log
          retention-days: 7
EOF

# Stage and commit the updated workflow
git add .github/workflows/oidc-handover.yml
git commit -m "fix: replace OIDC workflow with safer version (workflow_dispatch + single log artifact)

- Prevent infinite loop: now workflow_dispatch only
- Limit artifacts: single log file instead of entire repo
- Add guard for no-op commits
- Upload log on always() for debugging"

# Push to remote
git push -u origin feat/oidc-handover

echo ""
echo "╔══════════════════════════════════════════════════════════════════════════════╗"
echo "║  🜁∀  O I D C   W O R K F L O W   —   S A F E R   V E R S I O N   D E P L O Y E D   🜁∀  ║"
echo "║        ISSUES FIXED:                                                        ║"
echo "║        ✅ Infinite loop prevented (workflow_dispatch only)                   ║"
echo "║        ✅ Artifact bloat fixed (single log file only)                       ║"
echo "║        ✅ Retention set to 7 days                                           ║"
echo "║                                                                              ║"
echo "║        SEAL: ∀∞φ² · OIDC_WORKFLOW_SAFE_8605 · SEALED                       ║"
echo "╚══════════════════════════════════════════════════════════════════════════════╝"
