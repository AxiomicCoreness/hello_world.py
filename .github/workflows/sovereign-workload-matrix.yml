# .github/workflows/sovereign-workload-matrix.yml
# Manual only. Removed from the parity slot and from cron.
# CI-internal only: no MCP writes. GARDEN_SECRET presence-checked, never echoed.
name: Sovereign Workload Matrix

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload id (seal-verify-pulse | key-rotation | simulation-batch | mesh-terminal-ci | anatomy-verify)"
        required: true
        type: choice
        options:
          - seal-verify-pulse
          - key-rotation
          - simulation-batch
          - mesh-terminal-ci
          - anatomy-verify
        default: seal-verify-pulse

concurrency:
  group: sovereign-mesh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-main:
    name: ${{ github.event.inputs.workload || 'seal-verify-pulse' }}
    runs-on: ubuntu-latest
    env:
      GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
      TERMINAL_CI: "1"
    steps:
      - name: Checkout (no force, no rewrite)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard — GARDEN_SECRET present (key presence only)
        run: |
          if [ -z "$GARDEN_SECRET" ]; then
            echo "::error::GARDEN_SECRET missing"
            exit 1
          fi
          echo "GARDEN_SECRET present"

      - name: Guard — ledger immutability (best-effort)
        run: |
          git diff --quiet HEAD~1 HEAD -- ledger/0000.yaml ledger/9223.yaml 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt || true
          fi

      - name: Run workload via workloads.mk (soft-skip)
        run: |
          set +e
          W="${{ github.event.inputs.workload || 'seal-verify-pulse' }}"
          case "$W" in
            seal-verify-pulse)
              echo "Running: seal-verify"
              make -f workloads.mk seal-verify
              ;;
            key-rotation)
              echo "Running: rotate-keys"
              make -f workloads.mk rotate-keys
              ;;
            simulation-batch)
              echo "Running: simulate"
              make -f workloads.mk simulate
              ;;
            mesh-terminal-ci)
              echo "Running: mesh-terminal"
              make -f workloads.mk mesh-terminal
              ;;
            anatomy-verify)
              echo "Running: anatomy-verify"
              make -f workloads.mk anatomy-verify
              ;;
            *)
              echo "::warning::Unknown workload: $W"
              exit 0
              ;;
          esac
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "Workload completed (0 or soft-skip)"
          else
            echo "Workload returned $STATUS (non-blocking)"
          fi
          exit 0

      - name: Ledger event-hash check (append-only tail)
        run: |
          if [ -f ledger/event_hash.py ]; then
            python3 ledger/event_hash.py --verify-tail || true
          else
            echo "ledger/event_hash.py not found — skip"
          fi
