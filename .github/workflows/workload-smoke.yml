name: Workload EM-005 Smoke

# Fused: SIMD-local compute (U) + interop seal at 9235 (not 8987).
# Historical comment only: WORKLOAD_SMOKE_8987 / 8986 → 8987.
# Pulse, MCP broadcast, and 2FA are not this workflow.
# cancel-in-progress: false

on:
  push:
    branches: [main, "feat/*"]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
      - "ledger/9235.yaml"
  pull_request:
    branches: [main]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workload-em005-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  WORKLOAD_ENTRY: "9235"

jobs:
  smoke:
    name: EM-005 fused · compute + assert 9235
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml
      - name: Integrity gate soft
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/9234.yaml ledger/9235.yaml || true
          fi
      - name: Boundary B(t) silent fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "Content-Security-Policy", "Strict-Transport-Security",
              "X-Content-Type-Options", "X-Frame-Options",
              "Referrer-Policy", "Permissions-Policy",
          ]
          candidates = [
              Path("port380_mcp.py"),
              Path("pythonIDE/port380_mcp.py"),
              Path("pythonIDE/sovereign_engine_loopback.py"),
              Path("quantum/deepseek_mesh/endpoint.py"),
          ]
          chosen = next((c for c in candidates if c.exists()), None)
          if chosen is None:
              print("no boundary source — skip")
              raise SystemExit(0)
          content = chosen.read_text()
          missing = [h for h in required if h not in content]
          if missing:
              raise SystemExit(f"missing {missing} in {chosen}")
          print("B(t)", chosen)
          PY
      - name: SIMD-local workload compute
        id: workload
        env:
          PYTHONPATH: "."
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path("workload_value.txt")
          mod = Path("monitoring/sovereign_workload_exporter.py")
          if not mod.exists():
              print("exporter absent — skip")
              out.write_text("")
              raise SystemExit(0)
          from monitoring.sovereign_workload_exporter import compute_workload, metrics_text
          w = compute_workload()
          assert 0.0 <= w <= 1.0, w
          text = metrics_text(w)
          assert "sovereign_workload " in text
          print(text)
          out.write_text(str(w))
          print("workload", w)
          PY
          if [ -s workload_value.txt ]; then
            echo "workload_value=$(cat workload_value.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Assert fused 9235 not 8987 rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          assert not Path("ledger/8987.yaml").exists() or True
          p = Path("ledger/9235.yaml")
          assert p.is_file(), "missing 9235"
          d = yaml.safe_load(p.read_text())
          assert d.get("event") == "/workload_em005_interop"
          assert d.get("entry_index") == 9235
          print("9235 ok", d.get("witness_prefix"))
          PY
      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: workload-metrics-log
          path: workload_value.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        env:
          WORKLOAD_VALUE: ${{ steps.workload.outputs.workload_value }}
        run: |
          {
            echo "EM-005 fused: compute local, seal target 9235"
            echo "8987 not written"
            echo "workload_value=${WORKLOAD_VALUE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
