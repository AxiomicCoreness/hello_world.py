name: Workload EM-005 Smoke

# Fused EM-005 smoke + interoperability assertion.
# Reader-only: does NOT write ledger/8987.yaml.
# Asserts 9234 + 9235 with int-coerced entry_index.
# SIMD compute is local; pulse/2FA stay outside this file.

on:
  push:
    branches: [main, "feat/*"]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
      - ".github/workflows/workload_em005_smoke.yml"
      - "ledger/9234.yaml"
      - "ledger/9235.yaml"
  pull_request:
    branches: [main]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workload-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  INTEROP_ENTRY: "9235"
  PREDECESSOR_ENTRY: "9234"
  INTEROP_EVENT: "/workload_em005_interop"

jobs:
  smoke:
    name: EM-005 fused · SIMD compute + assert 9235
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography
      - name: Integrity gate (soft)
        continue-on-error: true
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/9234.yaml ledger/9235.yaml || true
          fi
      - name: Boundary B(t) silent fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "CORSMiddleware", "SecurityHeadersMiddleware",
              "Content-Security-Policy", "Strict-Transport-Security",
              "X-Content-Type-Options", "X-Frame-Options",
              "Referrer-Policy", "Permissions-Policy",
          ]
          candidates = [
              Path("port380_mcp.py"),
              Path("pythonIDE/port380_mcp.py"),
              Path("pythonIDE/sovereign_engine_loopback.py"),
              Path("quantum/deepseek_mesh/endpoint.py"),
          ]
          chosen = next((c for c in candidates if c.exists()), None)
          if chosen is None:
              print("no boundary source — soft skip")
              raise SystemExit(0)
          content = chosen.read_text()
          missing = [h for h in required if h not in content]
          if missing:
              raise SystemExit(f"missing {missing} in {chosen}")
          print(f"B(t) = {chosen}")
          PY
      - name: SIMD-local workload compute
        id: workload
        env:
          PYTHONPATH: "."
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path("workload_value.txt")
          mod = Path("monitoring/sovereign_workload_exporter.py")
          if not mod.exists():
              print("exporter absent — soft skip")
              out.write_text("")
              raise SystemExit(0)
          try:
              from monitoring.sovereign_workload_exporter import compute_workload, metrics_text
          except ImportError as e:
              print(f"import failed — soft skip: {e}")
              out.write_text("")
              raise SystemExit(0)
          w = compute_workload()
          assert 0.0 <= w <= 1.0, w
          text = metrics_text(w)
          assert "sovereign_workload " in text
          print(text)
          out.write_text(str(w))
          print("workload", w)
          PY
          if [ -s workload_value.txt ]; then
            echo "workload_value=$(cat workload_value.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Assert fused 9234 + 9235 present (no rewrite of 8987)
        env:
          PREDECESSOR_ENTRY: ${{ env.PREDECESSOR_ENTRY }}
          INTEROP_ENTRY: ${{ env.INTEROP_ENTRY }}
          INTEROP_EVENT: ${{ env.INTEROP_EVENT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, yaml
          from pathlib import Path

          n_pre = int(os.environ.get("PREDECESSOR_ENTRY", "9234"))
          n_cur = int(os.environ.get("INTEROP_ENTRY", "9235"))
          ev_cur = os.environ.get("INTEROP_EVENT", "/workload_em005_interop")

          if Path("ledger/8987.yaml").exists():
              print("note: ledger/8987.yaml pre-existing; this workflow did not write it")

          for n, expected_event in ((n_pre, "/seven_contract_surfaces"),
                                    (n_cur, ev_cur)):
              p = Path(f"ledger/{n}.yaml")
              if not p.is_file():
                  print(f"missing {p}", file=sys.stderr)
                  sys.exit(1)
              d = yaml.safe_load(p.read_text()) or {}
              try:
                  actual_int = int(d.get("entry_index"))
              except (TypeError, ValueError):
                  print(f"{p} entry_index not coercible: {d.get('entry_index')!r}", file=sys.stderr)
                  sys.exit(1)
              if actual_int != n:
                  print(f"{p} entry_index mismatch: file={actual_int} expected={n}", file=sys.stderr)
                  sys.exit(1)
              actual_event = d.get("event")
              if expected_event and actual_event != expected_event:
                  print(f"{p} event mismatch: {actual_event!r} != {expected_event!r}", file=sys.stderr)
                  sys.exit(1)
              wc = d.get("witness_prefix") or d.get("witness_chain") or "(none)"
              print(f"{p} entry_index={actual_int} event={actual_event} witness={wc}")
          print("9234 + 9235 present and consistent")
          PY
      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: workload-sample
          path: workload_value.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Summary
        if: always()
        env:
          WORKLOAD_VALUE: ${{ steps.workload.outputs.workload_value }}
        run: |
          {
            echo "EM-005 fused: int-coerced assert 9234+9235"
            echo "8987 not written"
            echo "workload_value=${WORKLOAD_VALUE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
