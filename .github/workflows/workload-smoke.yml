name: Workload EM-005 Smoke

# Fused EM-005 smoke + interoperability assertion.
# Reader-only: does NOT write ledger/8987.yaml (that entry does not exist).
# Asserts ledger/9234.yaml and ledger/9235.yaml present with expected events.
# Historical name WORKLOAD_SMOKE_8987 is a comment only.
# SIMD compute is local; pulse/2FA stay outside this file.
#
# hash_algo: sha3_256 (FIPS 202)
# ledger_policy: NO_LEDGER_WRITE — reader
# witness (observed): 9233 → 9234 → 9235 — UNBROKEN
#
# ═══════════════════════════════════════════════════════════════════
#  QUANTUM / CYBERNETIC FRAME
# ═══════════════════════════════════════════════════════════════════
#
#  ρ(t)          — sovereign workload state
#  U(t)          — compute_workload / metrics_text (read-only, unitary)
#  Φ_abs(ρ)      — ABSENT — no seal performed by this workflow
#  B(t)          — boundary: port380_mcp.py, silent pythonIDE/** fallback
#  𝒜_n ⊆ 𝒜_{n+1} — preserved by leaving the 92xx region untouched

on:
  push:
    branches: [main, "feat/*"]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
      - ".github/workflows/workload_em005_smoke.yml"
      - "ledger/9234.yaml"
      - "ledger/9235.yaml"
  pull_request:
    branches: [main]
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workload-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  INTEROP_ENTRY: "9235"
  PREDECESSOR_ENTRY: "9234"
  INTEROP_EVENT: "/workload_em005_interop"

jobs:
  smoke:
    name: EM-005 fused · SIMD compute + assert 9235
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      # ────────────────────────────────────────────────────────────
      # 0. Integrity gate — soft
      # ────────────────────────────────────────────────────────────
      - name: Integrity gate (soft)
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/9234.yaml ledger/9235.yaml || true
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 1. Boundary B(t) — silent pythonIDE fallback
      # ────────────────────────────────────────────────────────────
      - name: Boundary B(t) silent fallback
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          candidates = [
              Path("port380_mcp.py"),
              Path("pythonIDE/port380_mcp.py"),
              Path("pythonIDE/sovereign_engine_loopback.py"),
              Path("quantum/deepseek_mesh/endpoint.py"),
          ]
          chosen = next((c for c in candidates if c.exists()), None)
          if chosen is None:
              print("no boundary source — soft skip")
              raise SystemExit(0)

          content = chosen.read_text()
          missing = [h for h in required if h not in content]
          if missing:
              raise SystemExit(f"missing {missing} in {chosen}")
          print(f"✅ B(t) = {chosen}")
          PY

      # ────────────────────────────────────────────────────────────
      # 2. SIMD-local workload compute (pure U(t))
      # ────────────────────────────────────────────────────────────
      - name: SIMD-local workload compute
        id: workload
        env:
          PYTHONPATH: "."
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          out = Path("workload_value.txt")
          mod = Path("monitoring/sovereign_workload_exporter.py")
          if not mod.exists():
              print("exporter absent — soft skip")
              out.write_text("")
              raise SystemExit(0)

          try:
              from monitoring.sovereign_workload_exporter import compute_workload, metrics_text
          except ImportError as e:
              print(f"import failed — soft skip: {e}")
              out.write_text("")
              raise SystemExit(0)

          w = compute_workload()
          assert 0.0 <= w <= 1.0, f"workload out of range: {w}"

          text = metrics_text(w)
          assert "sovereign_workload " in text, "missing gauge line"
          assert 'sovereign_workload_em{protocol="005"}' in text, "missing EM-005 label"

          print(text)
          print(f"✅ workload = {w}")
          out.write_text(str(w))
          PY

          if [ -s workload_value.txt ]; then
            W=$(cat workload_value.txt)
            W_SHA=$(python - <<PY
          import hashlib, pathlib
          print(hashlib.new("sha3_256", pathlib.Path("workload_value.txt").read_bytes()).hexdigest())
          PY
            )
            echo "workload_value=${W}" >> "$GITHUB_OUTPUT"
            echo "workload_value_sha3_256=${W_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "workload_value=" >> "$GITHUB_OUTPUT"
            echo "workload_value_sha3_256=" >> "$GITHUB_OUTPUT"
          fi

      # ────────────────────────────────────────────────────────────
      # 3. Assert 9234 + 9235 (interop entries) — read-only
      # ────────────────────────────────────────────────────────────
      - name: Assert fused 9234 + 9235 present (no rewrite of 8987)
        env:
          PREDECESSOR_ENTRY: ${{ env.PREDECESSOR_ENTRY }}
          INTEROP_ENTRY: ${{ env.INTEROP_ENTRY }}
          INTEROP_EVENT: ${{ env.INTEROP_EVENT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, yaml
          from pathlib import Path

          n_pre = os.environ.get("PREDECESSOR_ENTRY", "9234")
          n_cur = os.environ.get("INTEROP_ENTRY", "9235")
          ev_cur = os.environ.get("INTEROP_EVENT", "/workload_em005_interop")

          # 8987 must NOT be written by this workflow
          if Path("ledger/8987.yaml").exists():
              print("note: ledger/8987.yaml present (pre-existing); this workflow did not write it")

          for n, expected_event in ((n_pre, "/seven_contract_surfaces"), (n_cur, ev_cur)):
              p = Path(f"ledger/{n}.yaml")
              if not p.is_file():
                  print(f"❌ missing {p}", file=sys.stderr)
                  sys.exit(1)
              d = yaml.safe_load(p.read_text()) or {}
              if d.get("entry_index") != n:
                  print(f"❌ {p} entry_index mismatch: {d.get('entry_index')}", file=sys.stderr)
                  sys.exit(1)
              if expected_event and d.get("event") != expected_event:
                  print(f"❌ {p} event mismatch: {d.get('event')!r} != {expected_event!r}", file=sys.stderr)
                  sys.exit(1)
              print(f"✅ {p} event={d.get('event')} witness={d.get('witness_prefix', d.get('witness_chain'))}")
          PY

      # ────────────────────────────────────────────────────────────
      # 4. Upload sample
      # ────────────────────────────────────────────────────────────
      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-sample
          path: workload_value.txt
          retention-days: 14
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────
      # 5. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          WORKLOAD_VALUE: ${{ steps.workload.outputs.workload_value }}
          WORKLOAD_SHA: ${{ steps.workload.outputs.workload_value_sha3_256 }}
        run: |
          {
            echo "### Workload EM-005 Smoke — fused"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry (observed) | 9235 |"
            echo "| event | /workload_em005_interop |"
            echo "| workload_value | ${WORKLOAD_VALUE:-<none>} |"
            echo "| workload_sha3_256 | ${WORKLOAD_SHA:0:16} |"
            echo "| em_protocol | 005 |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| witness | 9233 → 9234 → 9235 — UNBROKEN |"
            echo "| ledger_policy | NO_LEDGER_WRITE |"
            echo ""
            echo "**Quantum/cybernetic frame:**"
            echo "- \`ρ(t)\` — sovereign workload state"
            echo "- \`U(t)\` — compute_workload / metrics_text (read-only)"
            echo "- \`Φ_abs(ρ)\` — ABSENT — no seal performed"
            echo "- \`B(t)\` — \`port380_mcp.py\` → \`pythonIDE/**\` (silent fallback)"
            echo ""
            echo "🜁∀ — 8987 not written. Pulse and 2FA stay outside this file."
          } >> "$GITHUB_STEP_SUMMARY"
