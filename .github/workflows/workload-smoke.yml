name: Workload EM-005 Smoke

on:
  push:
    paths:
      - "monitoring/sovereign_workload_exporter.py"
      - "prometheus/metrics_server.py"
      - ".github/workflows/workload-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute sovereign_workload sample
        run: |
          python <<'PY'
          import sys
          import os

          # Ensure monitoring/ is in the path
          sys.path.insert(0, os.getcwd())

          # Import the module
          from monitoring.sovereign_workload_exporter import compute_workload, metrics_text

          # Compute workload and validate bounds
          w = compute_workload()
          assert 0.0 <= w <= 1.0, f"Workload out of range: {w}"

          # Generate and validate Prometheus text
          text = metrics_text(w)
          assert "sovereign_workload " in text, "Missing gauge line"
          assert 'sovereign_workload_em{protocol="005"}' in text, "Missing EM-005 label"

          # Output for debug
          print(text)
          print(f"OK: workload = {w}")
          PY
