name: reward-distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Compute reward pool
        run: python -m fiduciary_node_rewards

      - name: Sanity check pool
        run: |
          python - <<'PY'
          from fiduciary_node_rewards import total_pool
          t = total_pool()
          assert t > 0, "reward pool must be positive"
          print(f"reward_pool = {t:.10f}")
          PY
