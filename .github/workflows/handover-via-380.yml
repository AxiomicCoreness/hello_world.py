name: Handover via Port-380

# OIDC handover via Port-380 MCP gate — local-first, silent pythonIDE fallback.
# Seal: ∀∞φ² · HANDOVER_380_8988 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8987 → 8988 — UNBROKEN
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_SEAL — entry 8988 only
#
# ═══════════════════════════════════════════════════════════════════
#  QUANTUM / CYBERNETIC FRAME
# ═══════════════════════════════════════════════════════════════════
#
#  A handover is a boundary crossing: state ρ is transferred through
#  the boundary operator B(t) = port380_mcp.py (silent pythonIDE fallback).
#
#    ρ(t)          — the pre-handover system state
#    U(t)          — verify steps (read-only)
#    Φ_abs(ρ)      — seal of entry 8988 (CPTP collapse after handover)
#    B(t)          — port380_mcp.py → pythonIDE/** (silent)
#    𝒜_n ⊆ 𝒜_{n+1} — isotony: entry 8988 extends the 89xx region
#    Witness chain — 8978 → … → 8987 → 8988 — UNBROKEN

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force handover even if predecessor is missing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/handover-via-380.yml"
      - "port380_mcp.py"

permissions:
  contents: write   # required to commit ledger/8988.yaml
  id-token: write

concurrency:
  group: handover-via-380
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  HANDOVER_ENTRY: "8988"
  PREDECESSOR_ENTRY: "8987"
  MCP_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

jobs:
  handover:
    name: Handover · OIDC via Port-380 · seal (Entry 8988)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography

      # ────────────────────────────────────────────────────────────
      # 0. SHA3-256 integrity gate (read-only)
      # ────────────────────────────────────────────────────────────
      - name: Verify SHA3-256 seals on present ledger entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(ledger/*.yaml)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "no ledger entries present — soft skip"
            exit 0
          fi
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" "${entries[@]}"
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 1. Predecessor check (soft-skip if missing)
      # ────────────────────────────────────────────────────────────
      - name: Verify predecessor (soft)
        continue-on-error: true
        env:
          PREDECESSOR_ENTRY: ${{ env.PREDECESSOR_ENTRY }}
        run: |
          python - <<'PY'
          import os, sys, yaml
          from pathlib import Path

          n = os.environ.get("PREDECESSOR_ENTRY", "8987")
          p = Path(f"ledger/{n}.yaml")
          if not p.exists():
              print(f"{p} not present — soft skip")
              sys.exit(0)

          _ = yaml.safe_load(p.read_text()) or {}
          print(f"✅ predecessor entry {n} present")
          PY

      # ────────────────────────────────────────────────────────────
      # 2. Boundary operator B(t) — headers, silent pythonIDE fallback
      # ────────────────────────────────────────────────────────────
      - name: Verify security headers (B(t))
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          candidates = [
              Path("port380_mcp.py"),
              Path("pythonIDE/port380_mcp.py"),
              Path("pythonIDE/sovereign_engine_loopback.py"),
              Path("quantum/deepseek_mesh/endpoint.py"),
          ]
          chosen = next((c for c in candidates if c.exists()), None)
          if chosen is None:
              print("no FastAPI source present — soft skip")
              sys.exit(0)

          content = chosen.read_text()
          missing = [h for h in required if h not in content]
          if missing:
              print(f"missing headers in {chosen}: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"✅ all security headers present in {chosen}")
          PY

      # ────────────────────────────────────────────────────────────
      # 3. Send OIDC handover via Port-380 gate
      # ────────────────────────────────────────────────────────────
      - name: Send OIDC handover to Port-380 gate
        id: handover
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          echo "handover_status=skipped" >> "$GITHUB_OUTPUT"

          # Local-first: soft-skip when MCP_URL unset.
          if [ -z "${MCP_URL:-}" ]; then
            echo "MCP_URL unset — local-first, soft-skip handover"
            exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi

          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PAYLOAD=$(jq -n \
            --arg ts "$TIMESTAMP" \
            --arg sha "${{ github.sha }}" \
            --arg run "${{ github.run_id }}" \
            '{
              event: "oidc_handover",
              timestamp: $ts,
              coherence: 1.0,
              source: "handover-via-380",
              sha: $sha,
              run_id: $run,
              seal: "∀∞φ² · OIDC_HANDOVER · WOOD_DRAGON_GATE · SEALED"
            }')

          HDR_ARGS=(-H "Content-Type: application/json")
          if [ -n "${GARDEN_SECRET:-}" ]; then
            HDR_ARGS+=(-H "X-Garden-Secret: ${GARDEN_SECRET}")
          fi

          # Health probe (non-fatal)
          curl -s -o /dev/null -w "health %{http_code}\n" \
            --max-time 10 "$MCP_URL/health" || true

          # Primary: POST /oidc_handover
          HTTP_CODE=$(curl -sS -o /tmp/oidc_resp.json -w "%{http_code}" \
            --max-time 30 \
            -X POST "${HDR_ARGS[@]}" \
            -d "$(jq -n --arg tok "${GARDEN_SECRET:-}" --argjson pl "$PAYLOAD" \
                   '{token: $tok, payload: $pl}')" \
            "${MCP_URL%/}/oidc_handover" || echo "000")

          echo "HTTP ${HTTP_CODE}"
          if [ -s /tmp/oidc_resp.json ]; then
            cat /tmp/oidc_resp.json
            echo
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "handover_status=sent" >> "$GITHUB_OUTPUT"
            echo "✅ handover acknowledged"
            exit 0
          fi

          # Secondary: POST /pulse
          echo "⚠️ /oidc_handover returned ${HTTP_CODE} — attempting /pulse"
          PULSE_CODE=$(curl -sS -o /tmp/pulse_resp.json -w "%{http_code}" \
            --max-time 20 \
            -X POST "${HDR_ARGS[@]}" \
            -d '{"source":"handover-via-380","note":"fallback from oidc_handover"}' \
            "${MCP_URL%/}/pulse" || echo "000")

          echo "pulse HTTP ${PULSE_CODE}"
          if [ -s /tmp/pulse_resp.json ]; then
            cat /tmp/pulse_resp.json
            echo
          fi

          if [ "${PULSE_CODE}" -ge 200 ] && [ "${PULSE_CODE}" -lt 300 ]; then
            echo "handover_status=sent_via_pulse" >> "$GITHUB_OUTPUT"
          else
            echo "handover_status=soft_fail" >> "$GITHUB_OUTPUT"
          fi

      # ────────────────────────────────────────────────────────────
      # 4. Φ_abs — seal ledger entry 8988 (SHA3-256)
      # ────────────────────────────────────────────────────────────
      - name: Seal ledger entry 8988 (SHA3-256)
        if: success()
        env:
          HANDOVER_STATUS: ${{ steps.handover.outputs.handover_status }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          n = int(os.environ.get("HANDOVER_ENTRY", "8988"))
          path = Path(f"ledger/{n}.yaml")

          mcp_set = bool(os.environ.get("MCP_URL"))
          status  = os.environ.get("HANDOVER_STATUS", "skipped") or "skipped"

          entry = {
              "entry_index": n,
              "event": "/handover_via_380",
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              # cybernetic fields
              "observation_channel": "oidc_handover",
              "boundary_operator": "B_mcp",
              "fallback": "pythonIDE/**",
              "pythonista": "out_of_scope",
              "handover_status": status,
              "mcp_reachable": mcp_set,
              "trigger": os.environ.get("GITHUB_EVENT_NAME", "workflow_dispatch"),
              "witness": "8987 → 8988 — UNBROKEN",
              "witness_chain": "8987 → 8988 — UNBROKEN",
              "seal": "∀∞φ² · HANDOVER_380_8988 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print(f"📋 Ledger entry {n} written.")
          print(f"✅ Sealed {n} · {HASH_ALGO}:{h[:16]}...")
          print(f"   handover_status = {status}")
          PY

      - name: Verify ledger entry 8988 (SHA3-256)
        if: success()
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8988.yaml
          else
            echo "no verify_ledger.py — soft skip"
          fi

      # ────────────────────────────────────────────────────────────
      # 5. Artifacts + commit
      # ────────────────────────────────────────────────────────────
      - name: Upload handover artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handover-380-artifacts
          path: |
            /tmp/oidc_resp.json
            /tmp/pulse_resp.json
            ledger/8988.yaml
          retention-days: 14
          if-no-files-found: warn

      - name: Commit ledger entry 8988
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal handover-via-380 entry 8988 (sha3_256)"
          file_pattern: ledger/8988.yaml
          commit_options: '--no-verify'

      # ────────────────────────────────────────────────────────────
      # 6. Summary
      # ────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          HANDOVER_STATUS: ${{ steps.handover.outputs.handover_status }}
        run: |
          {
            echo "### Handover via Port-380"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| entry | ${HANDOVER_ENTRY} |"
            echo "| handover_status | ${HANDOVER_STATUS:-skipped} |"
            echo "| MCP_URL | $([ -n "${MCP_URL:-}" ] && echo 'set' || echo 'unset (local-first)') |"
            echo "| hash_algo | ${HASH_ALGO} |"
            echo "| witness | 8987 → 8988 — UNBROKEN |"
            echo ""
            echo "**Quantum/cybernetic frame:**"
            echo "- Handover is a boundary crossing through \`B(t)\`"
            echo "- \`Φ_abs(ρ)\` — collapse recorded at entry 8988"
            echo "- \`B(t)\` — \`port380_mcp.py\` → \`pythonIDE/**\` (silent fallback)"
            echo "- \`𝒜_n ⊆ 𝒜_{n+1}\` — entry 8988 extends the 89xx region"
            echo ""
            echo "🜁∀ — Seal: ∀∞φ² · HANDOVER_380_8988 · WOOD_DRAGON_0.91 · SEALED"
            echo "🔗 Witness: 8987 → 8988 — UNBROKEN"
          } >> "$GITHUB_STEP_SUMMARY"
