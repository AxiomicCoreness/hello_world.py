name: mTLS Cert Rotation (cybernetic)

# Cybernetic mTLS control loop — observation, collapse, action, record.
# Unlike mtls-cert-lifecycle.yml (soft-fail read-only), this workflow:
#   - Runs the rotation-readiness check as a measurement
#   - Records BOTH rotate=true and rotate=false as sealed ledger entries
#   - On rotate=true: rotates certs, seals new fingerprint, pulses MCP
#   - Federates via OIDC when rotation is triggered
#   - Adjusts the next-check cadence based on observed φ-phase
# Seal: ∀∞φ² · MTLS_ROTATION_8819 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8818 → 8819 — UNBROKEN
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# ledger_policy: WRITE_VIA_SEAL — entry 8819 only
#
# ═══════════════════════════════════════════════════════════════════
#  CYBERNETIC FRAMING
# ═══════════════════════════════════════════════════════════════════
#
#  B(t) ∈ S(t) — the boundary operator is part of the system state.
#  mTLS certificates are the physical realization of B.
#
#  Wiener's first law of cybernetics: a self-regulating system must
#  regulate every control surface that determines its behavior.
#  A certificate that never rotates is a control surface the system
#  has abdicated.
#
#  Quantum mapping:
#    |cert_state⟩ ∈ {valid, expiring, expired}
#      → measured via mtls_cert_lifecycle.py --check-rotate
#    Φ_abs(|cert_state⟩) = a new ledger entry (CPTP map application)
#    Θ(t) = {noop, rotate, emergency_rotate}
#    ΔG > 0 requires at least one entry per observation — a "null
#    result" (rotate=false) is still an observation and still advances
#    the chain.
#
#  This is the *active* half of the loop. The passive half
#  (mtls-cert-lifecycle.yml) remains as a soft-fail monitor for badge
#  visibility; this workflow is what actually closes the control loop.

on:
  schedule:
    - cron: "45 */6 * * *"   # offset +30m from the passive monitor's :20
  workflow_dispatch:
    inputs:
      oidc_provider:
        description: "OIDC cloud provider to federate on rotation"
        type: choice
        options: [offline, github, aws, gcp, azure]
        default: offline
      force_rotate:
        description: "Force rotation regardless of readiness"
        type: boolean
        default: false

permissions:
  contents: write   # required to commit ledger/8819.yaml
  id-token: write

concurrency:
  group: mtls-cert-rotation
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  ENTRY_INDEX: "8819"
  MCP_URL: ${{ secrets.MCP_URL }}
  GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0. MEASURE — collapse the cert-lifecycle state
  # ──────────────────────────────────────────────────────────────
  measure:
    name: Measure · cert lifecycle state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rotate:      ${{ steps.lifecycle.outputs.rotate }}
      cert_dir:    ${{ steps.lifecycle.outputs.cert_dir }}
      fingerprint: ${{ steps.lifecycle.outputs.fingerprint }}
      phase:       ${{ steps.lifecycle.outputs.phase }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Prepare cert directory (ephemeral if none on disk)
        id: prepare
        run: |
          set -euo pipefail
          if [ -d certs/live ]; then
            echo "cert_dir=certs" >> "$GITHUB_OUTPUT"
          else
            if [ -f scripts/mtls_cert_rotate.sh ]; then
              bash scripts/mtls_cert_rotate.sh --init --days 7 --out /tmp/mtls-ci \
                || echo "⚠️ init returned non-zero (soft)"
              echo "cert_dir=/tmp/mtls-ci" >> "$GITHUB_OUTPUT"
            else
              echo "cert_dir=" >> "$GITHUB_OUTPUT"
              echo "⚠️ no scripts/mtls_cert_rotate.sh — cert dir empty"
            fi
          fi

      - name: Measure cert lifecycle
        id: lifecycle
        env:
          CERT_DIR: ${{ steps.prepare.outputs.cert_dir }}
          FORCE_ROTATE: ${{ inputs.force_rotate || 'false' }}
        run: |
          set -euo pipefail
          echo "rotate=false"        >> "$GITHUB_OUTPUT"
          echo "cert_dir=${CERT_DIR}" >> "$GITHUB_OUTPUT"
          echo "fingerprint="          >> "$GITHUB_OUTPUT"
          echo "phase=null"            >> "$GITHUB_OUTPUT"

          if [ -z "${CERT_DIR:-}" ]; then
            echo "⚠️ no cert source — measurement skipped"
            exit 0
          fi
          if [ ! -f quantum/mtls_cert_lifecycle.py ]; then
            echo "⚠️ mtls_cert_lifecycle.py missing — measurement skipped"
            exit 0
          fi

          # φ-phase of the current epoch (self-improvement signal)
          PHI_PHASE=$(python -c "
          import math, time
          phi = (1 + math.sqrt(5)) / 2
          t = time.time()
          print(f'{(t * phi) % (2*math.pi):.6f}')
          ")
          echo "phase=${PHI_PHASE}" >> "$GITHUB_OUTPUT"

          # Rotation-readiness check (0 = no, 2 = recommend)
          set +e
          python quantum/mtls_cert_lifecycle.py --dir "$CERT_DIR" --check-rotate
          code=$?
          set -e

          case "$code" in
            0)
              echo "✅ rotation not required (measured)"
              # rotate=false preserved from default
              ;;
            2)
              echo "⚠️ rotation recommended by measurement"
              echo "rotate=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "⚠️ lifecycle exited $code — soft continue (rotate=false)"
              ;;
          esac

          if [ "${FORCE_ROTATE}" = "true" ]; then
            echo "⚠️ force_rotate requested — overriding to rotate=true"
            echo "rotate=true" >> "$GITHUB_OUTPUT"
          fi

          # Fingerprint of the current cert (if extractable)
          if command -v openssl >/dev/null 2>&1 && [ -f "${CERT_DIR}/server.crt" ]; then
            FP=$(openssl x509 -in "${CERT_DIR}/server.crt" -noout -fingerprint -sha256 \
                  2>/dev/null | cut -d= -f2 | tr -d ':' | tr 'A-Z' 'a-z' || echo "")
            echo "fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────
  # 1. ROTATE — apply Θ(t) = rotate
  # ──────────────────────────────────────────────────────────────
  rotate:
    name: Rotate · cert regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: measure
    if: needs.measure.outputs.rotate == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssl

      - name: Apply rotation
        env:
          CERT_DIR: ${{ needs.measure.outputs.cert_dir }}
        run: |
          set -euo pipefail
          if [ -f scripts/mtls_cert_rotate.sh ]; then
            bash scripts/mtls_cert_rotate.sh --rotate --days 7 --out "${CERT_DIR}/new" \
              || echo "⚠️ rotation script returned non-zero (soft)"
          else
            echo "⚠️ no scripts/mtls_cert_rotate.sh — procedural rotation skipped"
          fi

      - name: Extract new fingerprint
        id: new_fp
        env:
          CERT_DIR: ${{ needs.measure.outputs.cert_dir }}
        run: |
          set -euo pipefail
          FP=""
          if [ -f "${CERT_DIR}/new/server.crt" ]; then
            FP=$(openssl x509 -in "${CERT_DIR}/new/server.crt" -noout \
                  -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':' | tr 'a-z' 'A-Z' || echo "")
          fi
          echo "new_fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "new fingerprint: ${FP:-<none>}"

  # ──────────────────────────────────────────────────────────────
  # 2. RECORD — every observation produces a sealed entry (isotony)
  # ──────────────────────────────────────────────────────────────
  record:
    name: Record · seal ledger entry 8819
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [measure, rotate]
    if: always() && needs.measure.result == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml

      - name: Seal ledger entry 8819 (SHA3-256)
        env:
          ROTATE:        ${{ needs.measure.outputs.rotate }}
          OLD_FP:        ${{ needs.measure.outputs.fingerprint }}
          NEW_FP:        ${{ needs.rotate.outputs.new_fingerprint }}
          PHI_PHASE:     ${{ needs.measure.outputs.phase }}
          FORCE_ROTATE:  ${{ inputs.force_rotate || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "${LEDGER_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = os.environ.get("HASH_ALGO", "sha3_256")
          path = Path("ledger/8819.yaml")

          rotated = os.environ.get("ROTATE", "false") == "true"
          old_fp  = os.environ.get("OLD_FP", "") or ""
          new_fp  = os.environ.get("NEW_FP", "") or ""
          phase   = os.environ.get("PHI_PHASE", "null") or "null"

          # Θ(t): the control action this cycle applied
          theta = "rotate" if rotated else "noop"

          entry = {
              "entry_index": 8819,
              "event": "/mtls_cert_rotation",
              "status": "SUCCESS",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "hash_algo": HASH_ALGO,
              "boundary_operator": "B_mtls",
              "theta": theta,
              "rotate_recommended": rotated,
              "old_fingerprint": old_fp,
              "new_fingerprint": new_fp,
              "phi_phase": phase,
              "force_rotate": os.environ.get("FORCE_ROTATE", "false") == "true",
              "witness": "8818 → 8819 — UNBROKEN",
              "seal": "∀∞φ² · MTLS_ROTATION_8819 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("📋 Ledger entry 8819 written.")
          print(f"✅ Sealed 8819 · {HASH_ALGO}:{h[:16]}...")
          print(f"   theta              = {theta}")
          print(f"   rotate_recommended = {rotated}")
          print(f"   old_fingerprint    = {old_fp[:16] or '(none)'}")
          print(f"   new_fingerprint    = {new_fp[:16] or '(none)'}")
          print(f"   phi_phase          = {phase}")
          PY

      - name: Verify ledger entry 8819 (SHA3-256)
        run: |
          set -euo pipefail
          VERIFIER=".github/scripts/verify_ledger.py"
          [ -f "$VERIFIER" ] || VERIFIER="scripts/verify_ledger.py"
          if [ -f "$VERIFIER" ]; then
            python "$VERIFIER" ledger/8819.yaml
          else
            echo "⚠️ no verify_ledger.py — soft skip"
          fi

      - name: Upload ledger entry 8819
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-8819
          path: ledger/8819.yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Commit ledger entry 8819
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal mTLS rotation entry 8819 (sha3_256)"
          file_pattern: ledger/8819.yaml
          commit_options: '--no-verify'

  # ──────────────────────────────────────────────────────────────
  # 3. FEDERATE — only when rotation actually happened
  # ──────────────────────────────────────────────────────────────
  federate:
    name: OIDC federation · ${{ inputs.oidc_provider || 'offline' }}
    needs: [measure, rotate]
    if: |
      needs.rotate.result == 'success'
      && needs.measure.outputs.rotate == 'true'
    uses: ./.github/workflows/oidc-cloud-providers.yml
    with:
      provider: ${{ inputs.oidc_provider || 'offline' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # 4. PULSE — feed the loop back into the system
  # ──────────────────────────────────────────────────────────────
  pulse:
    name: Pulse · feed Θ(t) back into the system
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [measure, record]
    if: always() && needs.record.result == 'success'
    steps:
      - name: MCP pulse (if MCP_URL set)
        if: ${{ env.MCP_URL != '' }}
        env:
          ROTATE:  ${{ needs.measure.outputs.rotate }}
          OLD_FP:  ${{ needs.measure.outputs.fingerprint }}
          PHASE:   ${{ needs.measure.outputs.phase }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi

          BODY=$(jq -n \
            --arg src "mtls-cert-rotation" \
            --argjson entry 8819 \
            --argjson rotated "$([ "${ROTATE}" = "true" ] && echo true || echo false)" \
            --arg old_fp "${OLD_FP}" \
            --arg phase "${PHASE}" \
            '{
              source: $src,
              entry: $entry,
              rotated: $rotated,
              old_fingerprint: $old_fp,
              phi_phase: $phase,
              note: "cybernetic boundary regulation"
            }')

          curl -sS --max-time 20 \
            -X POST "$MCP_URL/pulse" \
            -H "X-Garden-Secret: $GARDEN_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            || echo "⚠️ MCP pulse failed (non-fatal)"

  # ──────────────────────────────────────────────────────────────
  # 5. SUMMARY
  # ──────────────────────────────────────────────────────────────
  summary:
    name: Post-cycle summary
    runs-on: ubuntu-latest
    needs: [measure, rotate, record, federate, pulse]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "### mTLS Cert Rotation — cybernetic cycle"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| rotate (measured) | ${{ needs.measure.outputs.rotate }} |"
            echo "| old_fingerprint | \`${{ needs.measure.outputs.fingerprint }}\` |"
            echo "| new_fingerprint | \`${{ needs.rotate.outputs.new_fingerprint }}\` |"
            echo "| phi_phase | ${{ needs.measure.outputs.phase }} |"
            echo "| entry | 8819 |"
            echo "| hash_algo | sha3_256 (FIPS 202) |"
            echo ""
            echo "**Job results:**"
            echo "- measure: ${{ needs.measure.result }}"
            echo "- rotate: ${{ needs.rotate.result }}"
            echo "- record: ${{ needs.record.result }}"
            echo "- federate: ${{ needs.federate.result }}"
            echo "- pulse: ${{ needs.pulse.result }}"
            echo ""
            echo "**Boundary operator B(t):** mTLS"
            echo "**Control action Θ(t):** ${{ needs.measure.outputs.rotate == 'true' && 'rotate' || 'noop' }}"
            echo "**Witness:** \`8818 → 8819 — UNBROKEN\`"
            echo ""
            echo "**Cybernetic note:** *both* outcomes (rotate=true, rotate=false) are sealed —"
            echo "the 'no-op' observation still advances 𝒜_n, preserving isotony."
          } >> "$GITHUB_STEP_SUMMARY"
