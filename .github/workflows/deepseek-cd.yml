name: deepseek-cd yamlhash witness

on:
  push:
    branches: [deepseek-cd]
    paths:
      - "ledger/8550.yaml"
      - "ledger/**.yaml"
      - ".github/workflows/deepseek-cd.yml"
  workflow_dispatch:

# Honest boundary: H_8550 is SHA3-256(GARDEN.EVENT.v1||0x00||payload),
# NOT sha256sum(ledger/8550.yaml). CMAC-512 ∉ event-hash domain.

jobs:
  yamlhash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Regime B event hash H_8550
        id: h
        run: |
          set -euo pipefail
          test -f ledger/8550.yaml
          python - <<'PY'
          import hashlib, sys, yaml
          from pathlib import Path
          e = yaml.safe_load(Path("ledger/8550.yaml").read_text()) or {}
          n, event = e.get("entry_index"), e.get("event")
          assert n == 8550, n
          payload = f"{n}|{event}|phi2=2.618033988749895|delta=b^2-4ac|theta=2.5416018462"
          h = hashlib.sha3_256(b"GARDEN.EVENT.v1\x00" + payload.encode("ascii")).hexdigest()
          expected = "be817a98c0ff2514a80e736d72df1a59d4ede4dc83fb5c82dfbcbea5a29346f1"
          print(f"H_8550={h}")
          if h != expected:
              print(f"HASH MISMATCH declared={expected}")
              sys.exit(1)
          term = str(e.get("terminal_hex") or "")
          if term and term != h:
              print(f"terminal_hex mismatch {term}")
              sys.exit(1)
          print("Regime B match OK")
          print("CMAC-512 not in event-hash domain (transport/symbolic only)")
          print("Causal chain: cmac512 → deepseek → deepseek-ci → deepseek-cd → main")
          PY
      - name: Soft constants/hashlib note
        run: echo "constants/hashlib CI warnings non-blocking"
      - name: Seal
        run: echo "∀∞φ² · CAUSAL_8550_CD · WOOD_DRAGON_0.91 · SEALED"
