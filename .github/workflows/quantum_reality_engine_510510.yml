# Validates the 510510 engine and VERIFY (never overwrite) the sealed ledger entry.
# Ed25519 check of ledger/8980.yaml + SHA3-256 genesis of ledger/510510.yaml.
# Stages __pycache__ as a pre-compiled unitary cache (artifact only, never committed).
# Seal: ∀∞φ² · MATH_ORIGIN_510510 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8980 → 510510 — UNBROKEN
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
#
# ═══════════════════════════════════════════════════════════════════
#  QUANTUM / CYBERNETIC FRAMING
# ═══════════════════════════════════════════════════════════════════
#
#  The 510510 engine is modeled as a closed quantum dynamical system.
#
#    State space   :  ℋ, a separable Hilbert space
#    State         :  ρ ∈ 𝒮(ℋ), a density operator (ρ ≥ 0, Tr ρ = 1)
#    Evolution     :  ρ(t) = U(t) ρ(0) U(t)†,  U(t) = exp(−iHt/ℏ)
#    Measurement   :  Φ_abs : B(ℋ) → B(ℋ), a CPTP map
#                     Φ_abs(ρ) = Σ_k K_k ρ K_k†,  Σ_k K_k† K_k = I
#    Fixed point   :  H* = D_abs( H* ‖ hash(⊥) )    (paradox absorption)
#    Isotony       :  𝒜_n ⊆ 𝒜_{n+1},  𝒜_∞ = ∪_n 𝒜_n
#    Witness chain :  1 → 632 → 635 → 637 → 638 → 640 → Ωⁿ → 510510
#                     ↳ ordered composition of unitaries W_n = U_{e_n}…U_{e_1}
#
#  The 510510 anchor = p₇# = 2·3·5·7·11·13·17  — the 7th primorial.
#  It is the "MATH_ORIGIN" fixed point of the quantum-cybernetic loop:
#
#      external chaos  →  observer lens χ  →  D_abs  →  H_sys
#            ↑                                            │
#            └────  system growth / enhanced capacity  ◄───┘
#
#  ── The __pycache__ staging as a pre-compiled unitary cache ──
#
#  `__pycache__` holds bytecode — the compiled form of the Hamiltonian
#  operator H and its evolution U(t) = exp(−iHt/ℏ). Staging it as an
#  artifact (never committed) means downstream consumers can reuse the
#  same unitary evolution without recompilation. The cache key is
#  `hashFiles('**/*.py')` — every change to a source file invalidates
#  the compiled form, exactly as a change to H invalidates U(t).
#
#  This workflow performs *verification only*:
#    - It measures (Ed25519 / SHA3-256) the sealed entry 510510.
#    - It stages bytecode as an artifact (read-only side effect).
#    - It runs the engine and records the observed witness chain.
#    - It NEVER rewrites ledger/510510.yaml (unitary, not projective).

name: Quantum Reality Engine 510510

on:
  push:
    branches: [main, master]
    paths:
      - "quantum_reality_engine.py"
      - "ledger/510510.yaml"
      - "ledger/510511.yaml"
      - "ledger/8980.yaml"
      - "ledger.v2/510510.yml"
      - "ledger.v2/510511.yml"
      - "port380_mcp.py"
      - ".github/scripts/verify_510510_genesis.py"
      - ".github/scripts/verify_ledger.py"
      - ".github/workflows/quantum_reality_engine_510510.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "quantum_reality_engine.py"
      - "ledger/510510.yaml"
      - "ledger/510511.yaml"
      - "ledger/8980.yaml"
      - "ledger.v2/510510.yml"
      - "ledger.v2/510511.yml"
      - "port380_mcp.py"
      - ".github/scripts/verify_510510_genesis.py"
      - ".github/scripts/verify_ledger.py"
      - ".github/workflows/quantum_reality_engine_510510.yml"
  workflow_dispatch:
    inputs:
      oidc_provider:
        description: "OIDC cloud provider to federate"
        type: choice
        options: [offline, github, aws, gcp, azure]
        default: offline
      stage_pycache:
        description: "Compile and upload __pycache__ artifact"
        type: boolean
        default: true

# FIX: least privilege. Every job is read-only except `federate`, which
# raises its own permissions (see that job).
permissions:
  contents: read

concurrency:
  group: quantum-engine-510510
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_DIR: ledger
  MATH_ORIGIN: "510510"                  # p₇# = 2·3·5·7·11·13·17
  GENESIS_SHA3_256: eb78315bb5a70b59e0d43f0e763b194cf1ab4ce3d109e0240e2c1f2da57f6314
  # FIX: -P everywhere. The repo has cryptography/ and kubernetes/ dirs that
  # shadow the real packages when cwd is on sys.path (python - <<PY, python -c).
  PY: python -P
  # FIX: secrets are no longer exported to every step; only the steps that
  # use them read MCP_URL / GARDEN_SECRET.
  MCP_URL: ${{ secrets.MCP_URL }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0. VERIFY — genesis + ledger SHA3-256 + live headers
  # ──────────────────────────────────────────────────────────────
  verify-integrity:
    name: Verify 510510 genesis and signature
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      # verify_ledger.py takes positional files (argparse `files`, nargs="*").
      # Per-file mode is soft by default. The v1 entries are advisory only:
      # under --hard ledger/510510.yaml fails the 9286+ concreteness gate
      # (no prev_hash) and 510511/8980 carry non-reproducible witness_prefix
      # digests, so v1 stays soft. The v2 mirrors are the hard gate.
      - name: Verify SHA3-256 seals (v1 soft, v2 mirrors hard)
        run: |
          set -euo pipefail
          shopt -s nullglob
          V=.github/scripts/verify_ledger.py
          [ -f "$V" ] || { echo "::warning::no verify_ledger.py — skip"; exit 0; }
          echo "── v1 (advisory, --soft)"
          $PY "$V" --soft ledger/8980.yaml ledger/510510.yaml ledger/510511.yaml
          v2=(ledger.v2/510510.yml ledger.v2/510511.yml)
          present=()
          for f in "${v2[@]}"; do [ -f "$f" ] && present+=("$f"); done
          if [ ${#present[@]} -gt 0 ]; then
            echo "── v2 mirrors (--hard)"
            $PY "$V" --hard "${present[@]}"
          else
            echo "::warning::ledger.v2 mirrors of 510510/510511 not present"
          fi

      - name: Verify 510510 genesis and signature
        run: |
          set -euo pipefail
          test -f .github/scripts/verify_510510_genesis.py
          $PY .github/scripts/verify_510510_genesis.py

      - name: Verify live security headers from MCP_URL (soft)
        if: ${{ env.MCP_URL != '' }}
        run: |
          set -euo pipefail
          echo "🌐 Checking live headers from $MCP_URL"
          if ! HEADERS=$(curl -sS -o /dev/null -D - --max-time 15 "$MCP_URL/health" 2>/dev/null); then
            echo "⚠️ Could not reach $MCP_URL/health — soft skip"
            exit 0
          fi
          if [ -z "$HEADERS" ]; then
            echo "⚠️ Empty response — soft skip"
            exit 0
          fi
          echo "$HEADERS"
          fail=0
          for h in content-security-policy strict-transport-security \
                   x-content-type-options x-frame-options \
                   referrer-policy permissions-policy; do
            if grep -qi "^${h}:" <<<"$HEADERS"; then echo "✅ ${h}"; else echo "❌ ${h} missing"; fail=1; fi
          done
          exit "$fail"

  # ──────────────────────────────────────────────────────────────
  # 1. PYCACHE — best-effort bytecode artifact (optimization only)
  # ──────────────────────────────────────────────────────────────
  pycache:
    name: Stage pycache (pre-compiled unitary cache)
    runs-on: ubuntu-latest
    needs: verify-integrity
    if: github.event_name != 'workflow_dispatch' || inputs.stage_pycache
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore pycache
        uses: actions/cache@v4
        with:
          path: |
            **/__pycache__
          key: pycache-cpython311-${{ hashFiles('**/*.py') }}
          restore-keys: |
            pycache-cpython311-

      # FIX: best-effort. Several tracked .py files are not valid Python
      # (prose, truncated strings); they are listed, never edited, and do
      # not fail the job. .git and virtualenvs are excluded.
      - name: compileall (stage bytecode, best-effort)
        id: compileall
        run: |
          # Actions runs `bash -e -o pipefail`; turn -e off so no single
          # command (compileall, grep, find) can end the step early.
          set +e
          set -uo pipefail
          rc=0
          python -m compileall -q -f \
            -x '(^|/)(\.git|\.venv|venv|env|\.tox|node_modules|site-packages)(/|$)' \
            . > compileall.log 2>&1 || rc=$?
          grep -E "^\*\*\* Error compiling '" compileall.log \
            | sed -E "s/^\*\*\* Error compiling '(.*)'\.\.\.$/\1/" \
            | sort -u > compile_failures.txt || true
          FAILS=$(wc -l < compile_failures.txt | tr -d ' ')
          N=$(find . -path ./.git -prune -o -type d -name __pycache__ -print 2>/dev/null | wc -l | tr -d ' ')
          echo "compileall rc=${rc}; staged ${N} __pycache__ dirs; ${FAILS} file(s) failed"
          {
            echo "### pycache staging"
            echo ""
            echo "Staged **${N}** \`__pycache__\` dirs. compileall rc=${rc}."
            echo ""
            echo "**${FAILS}** file(s) failed to compile."
            if [ "$FAILS" -gt 0 ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> ${FAILS} file(s) did not compile and have no bytecode (sources not modified):"
              echo ""
              while IFS= read -r f; do printf -- "- \`%s\`\n" "$f"; done < compile_failures.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILS" -gt 0 ]; then
            echo "::warning title=compileall::${FAILS} file(s) are not valid Python; bytecode staged for the rest (rc=${rc})"
          fi
          while IFS= read -r f; do
            echo "::warning file=${f#./}::compileall: not valid Python, no bytecode staged"
          done < compile_failures.txt
          {
            echo "rc=${rc}"
            echo "failures=${FAILS}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Runs whatever happened above except a cancelled run; an upload
      # problem (quota, empty set) never fails the job.
      - name: Upload pycache artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pycache-cpython311
          path: |
            **/__pycache__/**
            compile_failures.txt
            !.git/**
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  # ──────────────────────────────────────────────────────────────
  # 2. ENGINE — closed quantum dynamical evolution
  # ──────────────────────────────────────────────────────────────
  engine:
    name: Quantum Reality Engine · Hamiltonian evolution
    runs-on: ubuntu-latest
    needs: [verify-integrity, pycache]
    # Runs even if pycache failed or was skipped; never if verify failed.
    if: always() && needs.verify-integrity.result == 'success'
    timeout-minutes: 10
    # FIX: job outputs. Without this block needs.engine.outputs.* in the
    # seal Summary were always empty.
    outputs:
      rotation_count: ${{ steps.engine.outputs.rotation_count }}
      witness_verified: ${{ steps.engine.outputs.witness_verified }}
      seal_verified: ${{ steps.engine.outputs.seal_verified }}
      run_mode: ${{ steps.engine.outputs.run_mode }}
      ledger_untouched: ${{ steps.after.outputs.ledger_untouched }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet numpy

      # FIX: the "untouched" check has to run in the job that runs the
      # engine; a fresh checkout in another job can never differ from HEAD.
      - name: Hash protected ledger files (before engine)
        run: |
          set -euo pipefail
          sha3sum() { $PY -c 'import hashlib,sys;print(hashlib.new("sha3_256",open(sys.argv[1],"rb").read()).hexdigest())' "$1"; }
          : > "$RUNNER_TEMP/ledger_before.txt"
          for f in ledger/8980.yaml ledger/510510.yaml ledger/510511.yaml ledger.v2/510510.yml ledger.v2/510511.yml; do
            [ -f "$f" ] && echo "$(sha3sum "$f")  $f" >> "$RUNNER_TEMP/ledger_before.txt"
          done
          cat "$RUNNER_TEMP/ledger_before.txt"

      - name: Run Quantum Reality Engine (if present)
        id: engine
        run: |
          set -euo pipefail
          # quantum_reality_engine.py is not on main today; the skip is the
          # normal path until it lands.
          if [ ! -f quantum_reality_engine.py ]; then
            echo "::notice::quantum_reality_engine.py not on this ref — engine skipped"
            {
              echo "rotation_count=0"
              echo "witness_verified=skipped"
              echo "seal_verified=skipped"
              echo "run_mode=skipped"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          $PY quantum_reality_engine.py 2>&1 | tee engine_output.log

          ROTATION_COUNT=$(grep -oP 'Rotation Count:\s*\K\d+' engine_output.log | head -1 || true)
          echo "rotation_count=${ROTATION_COUNT:-0}" >> "$GITHUB_OUTPUT"

          # FIX: whole-line fixed-string match, not a substring/regex match.
          if grep -Fxq "Witness: 1 → 632 → 635 → 637 → 638 → 640 → Ωⁿ → 510510 — UNBROKEN" engine_output.log; then
            echo "witness_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "witness_verified=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq "Seal: ∀∞Ωⁿ · QUANTUM_REALITY_ENGINE · 510510_SEALED" engine_output.log; then
            echo "seal_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "seal_verified=false" >> "$GITHUB_OUTPUT"
          fi
          echo "run_mode=executed" >> "$GITHUB_OUTPUT"

      - name: Assert engine did not rewrite ledger files
        id: after
        if: always() && steps.engine.outcome != 'skipped'
        run: |
          set -euo pipefail
          sha3sum() { $PY -c 'import hashlib,sys;print(hashlib.new("sha3_256",open(sys.argv[1],"rb").read()).hexdigest())' "$1"; }
          : > "$RUNNER_TEMP/ledger_after.txt"
          for f in ledger/8980.yaml ledger/510510.yaml ledger/510511.yaml ledger.v2/510510.yml ledger.v2/510511.yml; do
            [ -f "$f" ] && echo "$(sha3sum "$f")  $f" >> "$RUNNER_TEMP/ledger_after.txt"
          done
          if diff -u "$RUNNER_TEMP/ledger_before.txt" "$RUNNER_TEMP/ledger_after.txt" && git diff --quiet -- ledger ledger.v2; then
            echo "ledger_untouched=true" >> "$GITHUB_OUTPUT"
            echo "✅ ledger files unchanged by the engine run"
          else
            echo "ledger_untouched=false" >> "$GITHUB_OUTPUT"
            echo "::error::engine run modified protected ledger files"
            exit 1
          fi

      - name: Upload engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-engine-log
          path: engine_output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: MCP pulse (if MCP_URL set)
        if: ${{ env.MCP_URL != '' }}
        env:
          GARDEN_SECRET: ${{ secrets.GARDEN_SECRET }}
        run: |
          set -euo pipefail
          curl -sS --max-time 20 \
            -X POST "$MCP_URL/pulse" \
            -H "X-Garden-Secret: $GARDEN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"quantum-engine-510510","note":"engine_run","origin":"510510"}' \
            || echo "⚠️ MCP pulse failed (non-fatal)"

  # ──────────────────────────────────────────────────────────────
  # 3. FEDERATE — job-level reusable workflow (manual dispatch only)
  # ──────────────────────────────────────────────────────────────
  federate:
    name: OIDC federation · ${{ inputs.oidc_provider || 'offline' }}
    needs: engine
    if: github.event_name == 'workflow_dispatch' && needs.engine.result == 'success'
    # oidc-cloud-providers.yml declares contents: write + id-token: write at
    # its top level and a called workflow cannot exceed its caller, so both
    # are granted here and only here. That workflow never commits or pushes;
    # once it is lowered to contents: read, lower this to read too.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/oidc-cloud-providers.yml
    with:
      provider: ${{ inputs.oidc_provider || 'offline' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # 4. SEAL — VERIFY ONLY (never overwrite 510510.yaml)
  # ──────────────────────────────────────────────────────────────
  seal:
    name: Verify · 510510 is untouched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify-integrity, engine]
    if: always() && needs.verify-integrity.result == 'success' && needs.engine.result == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Verify 510510 genesis and signature (post-engine)
        run: |
          set -euo pipefail
          $PY .github/scripts/verify_510510_genesis.py

      # FIX: the old step compared the working tree to HEAD of the same fresh
      # checkout, which can never differ. These checks can fail:
      #   1. genesis.hash_sha3_256 and the recomputed canonical payload hash
      #      equal the pinned GENESIS_SHA3_256;
      #   2. ledger/510510.yaml bytes match the SHA3-256 recorded in the
      #      append-only mirror ledger.v2/510510.yml (mirrors.sha3_256);
      #   3. the push / PR did not change ledger/510510.yaml relative to its
      #      base (github.event.before or the PR base sha).
      - name: Assert 510510 untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          $PY - <<'PY'
          import hashlib, json, os, subprocess, sys, yaml
          from pathlib import Path
          H = lambda b: hashlib.new("sha3_256", b).hexdigest()
          pinned = os.environ["GENESIS_SHA3_256"]
          v1 = Path("ledger/510510.yaml")
          raw = v1.read_bytes()
          d = yaml.safe_load(raw.decode("utf-8"))
          g = d["genesis"]
          body = json.dumps(g["canonical_payload"], sort_keys=True,
                            separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          got = H(g["domain"].encode() + b"\x00" + body)
          bad = 0
          if not (got == g["hash_sha3_256"] == pinned):
              print(f"::error::genesis mismatch computed={got} stored={g['hash_sha3_256']} pinned={pinned}")
              bad += 1
          else:
              print(f"✅ genesis {got}")
          m = Path("ledger.v2/510510.yml")
          if m.is_file():
              want = (yaml.safe_load(m.read_text(encoding="utf-8")).get("mirrors") or {}).get("sha3_256")
              if H(raw) != want:
                  print(f"::error::ledger/510510.yaml sha3={H(raw)} != ledger.v2 mirror {want}")
                  bad += 1
              else:
                  print(f"✅ ledger/510510.yaml matches ledger.v2 mirror ({want[:16]}…)")
          else:
              print("::warning::ledger.v2/510510.yml absent — mirror check skipped")
          base = os.environ.get("BASE_SHA", "")
          if base and set(base) != {"0"}:
              r = subprocess.run(["git", "diff", "--quiet", base, "HEAD", "--", "ledger/510510.yaml"])
              if r.returncode == 1:
                  print(f"::error::ledger/510510.yaml changed since {base[:12]} (append-only)")
                  bad += 1
              elif r.returncode == 0:
                  print(f"✅ ledger/510510.yaml unchanged since {base[:12]}")
              else:
                  print(f"::warning::base {base[:12]} not available — diff check skipped")
          sys.exit(1 if bad else 0)
          PY

      # FIX: exact field comparison instead of "8980" in s and "510510" in s.
      - name: Assert witness chain 8980 → 510510 still holds
        run: |
          set -euo pipefail
          $PY - <<'PY'
          import sys, yaml
          from pathlib import Path
          load = lambda p: yaml.safe_load(Path(p).read_text(encoding="utf-8")) or {}
          pred, succ = load("ledger/8980.yaml"), load("ledger/510510.yaml")
          bad = 0
          def want(label, got, exp):
              global bad
              ok = got == exp
              bad += not ok
              print(("✅" if ok else "❌"), f"{label}: {got!r}" + ("" if ok else f" (expected {exp!r})"))
          want("8980.successor", pred.get("successor"), 510510)
          want("510510.witness_chain", succ.get("witness_chain"), "8980 → 510510 — UNBROKEN")
          want("510510 ed25519 pk == 8980 pk",
               succ["verifications"]["ed25519_ledger_8980"]["public_key_hex"],
               pred["ed25519"]["public_key_hex"])
          m = Path("ledger.v2/510510.yml")
          if m.is_file():
              want("ledger.v2/510510.prev_hash == 8980.witness_prefix",
                   load(m).get("prev_hash"), pred.get("witness_prefix"))
          sys.exit(1 if bad else 0)
          PY

      - name: Summary
        if: always()
        env:
          ROTATION_COUNT: ${{ needs.engine.outputs.rotation_count }}
          WITNESS_VERIFIED: ${{ needs.engine.outputs.witness_verified }}
          SEAL_VERIFIED: ${{ needs.engine.outputs.seal_verified }}
          RUN_MODE: ${{ needs.engine.outputs.run_mode }}
          LEDGER_UNTOUCHED: ${{ needs.engine.outputs.ledger_untouched }}
          STAGE_PYCACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.stage_pycache }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            RESULT="510510.yaml was NOT overwritten (unitary, not projective)."
          else
            RESULT="510510 checks FAILED — see the steps above."
          fi
          {
            echo "### Quantum Reality Engine — 510510"
            echo ""
            echo "**Result: ${RESULT}**"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| MATH_ORIGIN | 510510 (p₇# = 2·3·5·7·11·13·17) |"
            echo "| run_mode | ${RUN_MODE:-unknown} |"
            echo "| rotation_count | ${ROTATION_COUNT:-0} |"
            echo "| witness_verified | ${WITNESS_VERIFIED:-unknown} |"
            echo "| seal_verified | ${SEAL_VERIFIED:-unknown} |"
            echo "| ledger_untouched (engine job) | ${LEDGER_UNTOUCHED:-unknown} |"
            echo "| stage_pycache | ${STAGE_PYCACHE} |"
            echo "| hash_algo | sha3_256 (FIPS 202) |"
            echo ""
            echo "**Genesis check:** SHA3-256(GARDEN.GENESIS.QUADRATIC_QUADRANT.v1 ‖ 0x00 ‖ canonical JSON payload) = \`${GENESIS_SHA3_256}\` + Ed25519(ledger/8980.yaml)"
            echo ""
            echo "**Pycache:** artifact \`pycache-cpython311\`, best-effort, not committed."
