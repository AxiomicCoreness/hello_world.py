name: mTLS Cert Lifecycle

# Checks mTLS certificate expiration and rotation readiness.
# Soft-fail ledger/headers so missing high-index entries do not red the badge.
# Seal: ∀∞φ² · MTLS_CERT_SOFT · WOOD_DRAGON_0.91 · SEALED
# hash_algo: sha3_256 (FIPS 202) — declared for header consistency
# ledger_policy: NO_LEDGER_WRITE + SOFT_VERIFY — reads only, never commits
# role: rotation-readiness monitor (badge must stay green on gaps)

on:
  schedule:
    - cron: "20 */6 * * *"   # φ-harmonic: every 6 hours at :20
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note"
        required: false
        default: "manual-mtls-check"

permissions:
  contents: read   # read-only by design — no ledger writes, no commits

concurrency:
  group: mtls-cert-lifecycle
  cancel-in-progress: false

env:
  HASH_ALGO: sha3_256
  LEDGER_TARGET_PRIMARY: ledger/8977.yaml
  LEDGER_TARGET_FALLBACK: ledger/8978.yaml

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. SOFT VERIFY — ledger + headers (never reds the badge)
  # ──────────────────────────────────────────────────────────────
  verify-integrity:
    name: Verify Ledger Signatures & Security Headers (soft)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (interpreter-bound)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      # ────────────────────────────────────────────────────────
      # Ledger presence check — SOFT by design
      # ────────────────────────────────────────────────────────────
      - name: Verify ledger entry (install-safe, soft)
        run: |
          set -euo pipefail

          # Prefer the repo-wide verifier when present.
          if [ -f .github/scripts/verify_ledger.py ]; then
            if [ -f "${LEDGER_TARGET_PRIMARY}" ]; then
              python .github/scripts/verify_ledger.py "${LEDGER_TARGET_PRIMARY}" \
                || echo "⚠️ verifier reported non-zero (soft)"
            elif [ -f "${LEDGER_TARGET_FALLBACK}" ]; then
              python .github/scripts/verify_ledger.py "${LEDGER_TARGET_FALLBACK}" \
                || echo "⚠️ verifier reported non-zero (soft)"
            else
              echo "⚠️ No ${LEDGER_TARGET_PRIMARY} / ${LEDGER_TARGET_FALLBACK} — soft-skip"
            fi
            exit 0
          fi

          # Fallback: structural check only.
          python - <<'PY'
          import sys, os
          from pathlib import Path

          primary  = Path(os.environ.get("LEDGER_TARGET_PRIMARY",  "ledger/8977.yaml"))
          fallback = Path(os.environ.get("LEDGER_TARGET_FALLBACK", "ledger/8978.yaml"))

          target = primary if primary.exists() else (fallback if fallback.exists() else None)
          if target is None:
              print("⚠️ no 8977/8978 ledger target — soft-skip")
              sys.exit(0)

          try:
              from cryptography.hazmat.primitives.asymmetric import ed25519  # noqa: F401
              import yaml
              data = yaml.safe_load(target.read_text()) or {}
              idx = data.get("entry_index") if isinstance(data, dict) else None
              print(f"✅ ledger present entry_index={idx}")
          except Exception as e:
              print(f"⚠️ verify soft: {e}")
          sys.exit(0)
          PY

      # ────────────────────────────────────────────────────────────
      # Security headers — SOFT, deprecation stub allowed
      # ────────────────────────────────────────────────────────────
      - name: Verify security headers (soft)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          # port380_mcp.py is a deprecation stub; prefer mesh endpoint if present.
          candidates = [
              Path("port380_mcp.py"),
              Path("quantum/deepseek_mesh/endpoint.py"),
          ]

          content = ""
          used = None
          for p in candidates:
              if p.exists():
                  content = p.read_text()
                  used = str(p)
                  break

          if used is None:
              print("⚠️ no FastAPI source found — soft-skip headers")
              sys.exit(0)

          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"⚠️ missing header markers in {used} (soft): {', '.join(missing)}")
              sys.exit(0)

          print(f"✅ all security headers present in {used}")
          PY

  # ──────────────────────────────────────────────────────────────
  # 2. LIFECYCLE — rotation-readiness check
  # ──────────────────────────────────────────────────────────────
  lifecycle:
    name: mTLS · Lifecycle · Rotation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify-integrity

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install optional cryptography
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography \
            || echo "⚠️ cryptography install failed — continuing (soft)"

      - name: Lifecycle status (ephemeral certs if none on disk)
        id: status
        run: |
          set -euo pipefail

          # Always set a default output first so downstream steps never see empty.
          echo "rotate=false" >> "$GITHUB_OUTPUT"

          # ── 1. Determine cert source
          if [ ! -d certs/live ]; then
            echo "No certs/live in repo (expected — keys stay off-git)."
            if [ -f scripts/mtls_cert_rotate.sh ]; then
              bash scripts/mtls_cert_rotate.sh --init --days 7 --out /tmp/mtls-ci \
                || echo "⚠️ rotate --init returned non-zero (soft)"
              export MTLS_CERT_DIR=/tmp/mtls-ci
            else
              echo "⚠️ scripts/mtls_cert_rotate.sh missing — soft-skip lifecycle"
              exit 0
            fi
          else
            export MTLS_CERT_DIR=./certs
          fi

          # ── 2. Run lifecycle check
          if [ ! -f quantum/mtls_cert_lifecycle.py ]; then
            echo "⚠️ quantum/mtls_cert_lifecycle.py missing — soft-skip"
            exit 0
          fi

          # JSON report (informational)
          python quantum/mtls_cert_lifecycle.py --dir "$MTLS_CERT_DIR" --json \
            | tee /tmp/mtls_status.json \
            || echo "⚠️ lifecycle --json returned non-zero (soft)"

          # Rotation decision
          set +e
          python quantum/mtls_cert_lifecycle.py --dir "$MTLS_CERT_DIR" --check-rotate
          code=$?
          set -e

          case "$code" in
            0)
              echo "✅ rotation not required"
              # rotate=false already written above
              ;;
            2)
              echo "⚠️ mTLS rotation recommended"
              echo "::warning::mTLS rotation recommended"
              # Overwrite the default output with rotate=true.
              # GITHUB_OUTPUT accepts duplicate keys — the last one wins.
              echo "rotate=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::lifecycle check exited $code — soft continue"
              ;;
          esac

      - name: Verify mTLS script crypto strength
        run: |
          set -euo pipefail

          if [ -f scripts/mtls_cert_rotate.sh ] && grep -q "openssl req" scripts/mtls_cert_rotate.sh; then
            if grep -qE "newkey rsa:(2048|3072|4096)" scripts/mtls_cert_rotate.sh \
               || grep -q "newkey ec -pkeyopt ec_paramgen_curve:P-256" scripts/mtls_cert_rotate.sh; then
              echo "✅ mTLS rotation script uses strong crypto (RSA 2048+ or EC P-256)."
            else
              echo "::warning::mTLS rotation script may not use strong key parameters."
            fi
          elif [ -f quantum/mtls_cert_lifecycle.py ]; then
            if grep -qE "SECP256R1|P-256|prime256v1" quantum/mtls_cert_lifecycle.py \
               || grep -q "ed25519" quantum/mtls_cert_lifecycle.py; then
              echo "✅ Python cryptography uses strong curves."
            else
              echo "::warning::mTLS crypto might be weak; verify curve selection."
            fi
          else
            echo "::warning::Could not determine crypto strength; soft continue."
          fi

      - name: Summary
        if: always()
        env:
          NOTE: ${{ inputs.note }}
        run: |
          {
            echo "### mTLS lifecycle"
            echo "- rotate_recommended: ${{ steps.status.outputs.rotate }}"
            echo "- note: ${NOTE:-<none>}"
            echo "- Ledger verify: soft (missing 8977/8978 does not fail)"
            echo "- Security headers: soft (deprecation stub allowed)"
            echo "- cryptography install: python -m pip (interpreter-bound)"
            echo "- hash_algo: ${HASH_ALGO}"
            echo "- ledger_policy: NO_LEDGER_WRITE + SOFT_VERIFY"
            echo "🜁∀ — Seal: ∀∞φ² · MTLS_CERT_SOFT · WOOD_DRAGON_0.91 · SEALED"
          } >> "$GITHUB_STEP_SUMMARY"
