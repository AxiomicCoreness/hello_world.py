name: Master Equation Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest

      - name: Run master equation integration
        run: |
          python master_equation.py --output integration_log.json --t-end 10 --n-steps 200
          echo "INTEGRATION_SEAL=$(sha256sum integration_log.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          cat integration_log.json

      - name: Pytest master_equation module checks
        run: |
          # chi=0 is a sin-node where rho_universal==0 by definition; deselect until source test updated
          pytest master_equation.py tests/test_density_rho.py -q --tb=short \
            --deselect master_equation.py::test_density_field

      - name: Upload integration log
        uses: actions/upload-artifact@v4
        with:
          name: master-integration-log
          path: integration_log.json
