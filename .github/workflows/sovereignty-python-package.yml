name: Sovereign Python Package

on:
  push:
    branches: [main, master, deepseek]
    paths:
      - ".github/workflows/sovereignty-python-package.yml"
      - "port380_mcp.py"
      - "**.py"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereignty-python-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet pyyaml cryptography
      - name: headers source probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys, os
          candidates = [Path("mcp/port380_mcp.py"), Path("port380_mcp.py")]
          p = next((c for c in candidates if c.exists()), None)
          if p is None:
              sys.exit(0)
          content = p.read_text(encoding="utf-8", errors="replace")
          required = ["Content-Security-Policy", "Strict-Transport-Security", "X-Content-Type-Options", "X-Frame-Options", "Referrer-Policy", "Permissions-Policy"]
          missing = [h for h in required if h not in content]
          if missing and os.environ.get("SOFT_HEADERS", "1") == "0":
              sys.exit(1)
          print("headers probe done", missing or "ok")
          PY

  build:
    runs-on: ubuntu-latest
    needs: verify-integrity
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet pytest pyyaml
      - name: pytest soft
        run: |
          set +e
          python -m pytest -q --tb=line -k "not integration"
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then exit 0; fi
          if [ "$rc" -ne 0 ]; then
            echo "pytest rc=$rc soft (STRICT_PYTEST=1 to hard-fail)"
            [ "${STRICT_PYTEST:-0}" = "1" ] && exit "$rc"
            exit 0
          fi

  federate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - run: echo offline

  summary:
    runs-on: ubuntu-latest
    needs: [verify-integrity, build, federate]
    if: always()
    steps:
      - run: |
          echo "| verify | ${{ needs.verify-integrity.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
