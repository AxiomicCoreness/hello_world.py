name: iOS Pocket Simulator

# Unattended CI for ios/ClarkePocket on every pull request and every push to main.
# No signing secrets: everything runs with CODE_SIGNING_ALLOWED=NO.
#   simulator-tests  `xcodebuild test` of the PocketCore XCTest target
#                    (Tests/PocketCoreTests, from Package.swift) on an iOS Simulator.
#                    Fails unless at least MIN_TESTS tests actually ran.
#   app-build        XcodeGen + `xcodebuild build` of the ClarkePocket app for a generic
#                    iOS device, unsigned.
#   app-simulator    XcodeGen + the FULL ClarkePocket app (real llama.framework, Simulator slice)
#                    built for the iOS Simulator; `xcodebuild test` of the app-hosted tests
#                    (Tests/ClarkePocketAppTests, real llama calls on a missing path and a stub
#                    file, no weights) and the UI smoke test (Tests/ClarkePocketUITests, visits
#                    every tab); then `simctl install` + `simctl launch` of the built .app, a
#                    liveness check and a screenshot. Fails unless MIN_APP_TESTS passed and none
#                    failed or were skipped. Screenshots + .xcresult are uploaded as artifacts.
# The Simulator works because LlamaBinary/Package.swift now pins this repo's own universal
# llama.cpp b11960 xcframework (ios-arm64, ios-arm64_x86_64-simulator, macos-arm64_x86_64),
# built from source by .github/workflows/pocket-llama-xcframework.yml.
# Nothing here listens on a port. The app is launched with -ircAutoConnect NO and
# -ircResponderEnabled NO, so CI never dials the public IRC server.

on:
  pull_request:
    paths:
      - "ios/ClarkePocket/**"
      - ".github/workflows/ios-pocket-simulator.yml"
  push:
    branches: [main]
    paths:
      - "ios/ClarkePocket/**"
      - ".github/workflows/ios-pocket-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pocket-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: PocketCore tests on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MIN_TESTS: "62"
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          set -eu
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > devices.json
          udid=$(python3 - <<'PY'
          import json
          d = json.load(open("devices.json"))["devices"]
          best = None
          for runtime, devs in d.items():
              if ".iOS-" not in runtime:
                  continue
              ver = tuple(int(x) for x in runtime.rsplit(".iOS-", 1)[1].split("-") if x.isdigit())
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      key = (ver, dev["name"])
                      if best is None or key > best[0]:
                          best = (key, dev["udid"], dev["name"])
          if best is None:
              raise SystemExit("no available iPhone simulator")
          print(best[1])
          PY
          )
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: pick the package test scheme
        id: scheme
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          xcodebuild -list -json > ../../schemes.json
          scheme=$(python3 - <<'PY'
          import json
          s = json.load(open("../../schemes.json"))
          names = (s.get("workspace") or s.get("project") or {}).get("schemes", [])
          # Package.swift is named ClarkePocket; with no .xcodeproj present, Xcode exposes the
          # package scheme as "ClarkePocket" (or "<name>-Package" when there are several products).
          print(next((n for n in ("ClarkePocket-Package", "ClarkePocket", "PocketCore") if n in names), ""))
          PY
          )
          test -n "$scheme" || { echo "::error::no package scheme found"; cat ../../schemes.json; exit 1; }
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "scheme: $scheme"
      - name: xcodebuild test (iOS Simulator, unsigned)
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme '${{ steps.scheme.outputs.scheme }}' \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath build/dd-sim \
            -resultBundlePath build/PocketCoreTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-test.log
      - name: require that the tests really ran
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          grep -q '\*\* TEST SUCCEEDED \*\*' build-test.log
          ran=$(grep -Eo "Executed [0-9]+ tests?" build-test.log | awk '{print $2}' | sort -n | tail -1)
          echo "tests executed: ${ran:-0}"
          test "${ran:-0}" -ge "$MIN_TESTS" || { echo "::error::only ${ran:-0} tests ran (need >= $MIN_TESTS)"; exit 1; }
      - name: upload the test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketCoreTests-simulator-xcresult
          path: ios/ClarkePocket/build/PocketCoreTests.xcresult
          retention-days: 14
          if-no-files-found: warn

  app-build:
    name: ClarkePocket app build (generic iOS device, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        working-directory: ios/ClarkePocket
        run: |
          set -eu
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: xcodebuild build (no signing)
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClarkePocket.xcodeproj \
            -scheme ClarkePocket \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -f build/dd/Build/Products/Debug-iphoneos/ClarkePocket.app/Frameworks/llama.framework/llama

  app-simulator:
    name: ClarkePocket app on iOS Simulator (build, app + UI tests, install, launch, screenshot)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MIN_APP_TESTS: "7"
      BUNDLE_ID: io.github.axiomiccoreness.clarkepocket
      OUT: ${{ github.workspace }}/sim-out
    steps:
      - uses: actions/checkout@v4
      - name: toolchain + simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
          IFS=$'\t' read -r udid name runtime < <(python3 .github/ios-sim/pick-simulator.py)
          echo "simulator: $name ($runtime) $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: xcodegen
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          xcodegen generate
      - name: xcodebuild test (full app, iOS Simulator, unsigned)
        working-directory: ios/ClarkePocket
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ClarkePocket.xcodeproj \
            -scheme ClarkePocket \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/dd-app-sim \
            -resultBundlePath build/ClarkePocketApp.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-app-test.log
          grep -q '\*\* TEST SUCCEEDED \*\*' build-app-test.log
      - name: require that the app tests really ran
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path build/ClarkePocketApp.xcresult > summary.json
          cat summary.json
          python3 - <<'PY'
          import json, os, sys
          s = json.load(open("summary.json"))
          passed, failed, skipped = s.get("passedTests", 0), s.get("failedTests", 0), s.get("skippedTests", 0)
          need = int(os.environ["MIN_APP_TESTS"])
          print(f"passed={passed} failed={failed} skipped={skipped} need>={need}")
          if failed or skipped or passed < need:
              sys.exit(f"::error::app tests: passed={passed} failed={failed} skipped={skipped} (need >= {need} passed, 0 failed, 0 skipped)")
          PY
      - name: the app embeds the real llama.framework Simulator slice
        working-directory: ios/ClarkePocket
        run: |
          set -euo pipefail
          app=build/dd-app-sim/Build/Products/Debug-iphonesimulator/ClarkePocket.app
          bin="$app/Frameworks/llama.framework/llama"
          test -f "$bin"
          lipo -info "$bin"
          xcrun vtool -show-build "$bin" | tee vtool.txt
          grep -q 'IOSSIMULATOR' vtool.txt
      - name: install + launch + screenshot (no taps, no typing)
        working-directory: ios/ClarkePocket
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          app=build/dd-app-sim/Build/Products/Debug-iphonesimulator/ClarkePocket.app
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" || true
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" \
            -ircAutoConnect NO -ircResponderEnabled NO -selectedTab 0 | tee launch.txt
          pid=$(awk -F': ' '{print $2}' launch.txt | tr -dc '0-9')
          test -n "$pid"
          sleep 10
          xcrun simctl spawn "$UDID" launchctl list | grep -F "$BUNDLE_ID" | tee alive.txt
          awk '{print $1}' alive.txt | grep -qx "$pid" || { echo "::error::ClarkePocket (pid $pid) is not running 10 s after launch"; exit 1; }
          xcrun simctl io "$UDID" screenshot --type=png "$OUT/launch-model-tab.png"
          test -s "$OUT/launch-model-tab.png"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"
      - name: export UI test screenshots from the result bundle
        if: always()
        working-directory: ios/ClarkePocket
        run: |
          set -uo pipefail
          mkdir -p "$OUT/ui-test-attachments"
          xcrun xcresulttool export attachments --path build/ClarkePocketApp.xcresult \
            --output-path "$OUT/ui-test-attachments" || echo "::warning::could not export attachments"
          cp build-app-test.log "$OUT/" 2>/dev/null || true
          ls -la "$OUT" "$OUT/ui-test-attachments" || true
      - name: app log (last 5 min)
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "ClarkePocket"' > "$OUT/app.log" 2>&1 || true
          tail -n 40 "$OUT/app.log" || true
      - name: upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClarkePocket-simulator-screenshots
          path: sim-out
          retention-days: 14
          if-no-files-found: warn
      - name: upload the app test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClarkePocketApp-simulator-xcresult
          path: ios/ClarkePocket/build/ClarkePocketApp.xcresult
          retention-days: 14
          if-no-files-found: warn
