name: CD Combinator (Argo Rollout)

# Seal: ∀∞φ² · CD_COMBINATOR_8926 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8925 → 8926 — UNBROKEN
# cryptography: python -m pip + .github/scripts/verify_ledger.py
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries
# NOTE (audit 2026-10-19): CI no longer writes or commits ledger entries.
#   ledger/8926.yaml has never existed (8925 and 8927 are sealed; 8927
#   declares "8926 → 8927"), so the old step would have back-filled a gap
#   behind sealed entries without approval. Ledger entries are append-only
#   and approval-gated; this workflow uploads a CI run record as an artifact.
#   The 8925 check is the verifier's default soft mode (warns, never fails).

on:
  workflow_run:
    workflows: ["Master Equation Integration Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sync:
        description: "Force Argo CD live sync"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-combinator
  cancel-in-progress: false

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    name: Verify Ledger Signatures & Security Headers
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml

      - name: Verify ledger entry 8925 (soft — mismatch warns, does not fail)
        run: |
          set -euo pipefail
          if [ -f "ledger/8925.yaml" ]; then
            if [ -f .github/scripts/verify_ledger.py ]; then
              python .github/scripts/verify_ledger.py --soft ledger/8925.yaml
            else
              echo "verify_ledger.py absent — soft skip 8925 verification"
            fi
          else
            echo "ledger/8925.yaml not found — skipping verification"
          fi

      - name: Verify security headers in FastAPI middleware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          p = Path("port380_mcp.py")
          if not p.exists():
              print("port380_mcp.py missing — skip")
              sys.exit(0)

          content = p.read_text(encoding="utf-8", errors="replace")
          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"Missing headers: {missing}")
              sys.exit(1)
          print("All security header names present in source (string match; not a live check)")
          PY

  trigger-rollout:
    name: Trigger · Argo Rollout
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-integrity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig (OIDC / cloud CLI)
        continue-on-error: true
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"
          elif command -v gcloud >/dev/null 2>&1; then
            gcloud container clusters get-credentials "${{ secrets.GKE_CLUSTER_NAME }}" --region "${{ secrets.GKE_REGION }}"
          else
            echo "No cloud CLI — using existing kubeconfig"
          fi

      - name: Verify kubectl access
        run: |
          set -euo pipefail
          kubectl cluster-info --request-timeout=5s || echo "Cluster not reachable"
          kubectl get namespaces || true

      - name: Install Argo Rollouts kubectl plugin
        run: |
          set -euo pipefail
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Apply Rollout manifest (robust)
        run: |
          set -euo pipefail
          ROLLOUT_MANIFEST=""
          for candidate in \
            "argocd/rollout-sovereign-garden-gateway-multistage.yaml" \
            "argocd/rollout-sovereign-garden.yaml" \
            "argocd/rollout.yaml"; do
            if [ -f "$candidate" ]; then
              ROLLOUT_MANIFEST="$candidate"
              break
            fi
          done

          if [ -n "$ROLLOUT_MANIFEST" ]; then
            echo "Applying manifest: $ROLLOUT_MANIFEST"
            kubectl apply -f "$ROLLOUT_MANIFEST"
          else
            echo "No catalogued Rollout found — applying minimal fallback"
            MIN=/tmp/sovereign-garden-rollout-minimal.yaml
            cat > "$MIN" <<'YAML'
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata:
            name: sovereign-garden
            namespace: sovereign-garden
          spec:
            replicas: 1
            strategy:
              canary:
                steps:
                  - setWeight: 20
                  - pause: {duration: 30s}
                  - setWeight: 100
            selector:
              matchLabels:
                app: sovereign-garden
            template:
              metadata:
                labels:
                  app: sovereign-garden
              spec:
                containers:
                  - name: sovereign-garden
                    image: axiomic/sovereign-engine:latest
                    ports:
                      - containerPort: 8000
          YAML
            kubectl apply -f "$MIN"
          fi

      - name: Annotate Rollout (only if it exists)
        run: |
          set -euo pipefail
          if kubectl get rollout sovereign-garden -n sovereign-garden >/dev/null 2>&1; then
            kubectl annotate rollout sovereign-garden -n sovereign-garden \
              argocd.argoproj.io/sync-options=Prune=true,ApplyOutOfSyncOnly=true \
              argocd.argoproj.io/sync-wave=1 --overwrite
          else
            echo "Rollout 'sovereign-garden' not found — skipping annotation"
          fi

      - name: Argo CD live sync (safe)
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGO_APP: sovereign-garden
        run: |
          set -euo pipefail
          if [ -z "${ARGOCD_AUTH_TOKEN:-}" ] || [ -z "${ARGOCD_SERVER:-}" ]; then
            echo "ARGOCD secrets not set — sync skipped"
            exit 0
          fi
          if ! command -v argocd >/dev/null 2>&1; then
            curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /tmp/argocd
            sudo mv /tmp/argocd /usr/local/bin/argocd
          fi
          argocd app sync "$ARGO_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web --timeout 300 --prune --apply-out-of-sync-only
          argocd app wait "$ARGO_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web --health --timeout 300

      # Run record — ARTIFACT ONLY, never written to ledger/ or ledger.v2/.
      # No entry_index: CI does not pick ledger indices (append-only, approval-gated).
      - name: Write rollout run record (SHA3-256, artifact only)
        if: success()
        env:
          RECORD_DIR: ci-out
          ARGOCD_SYNC_CONFIGURED: ${{ secrets.ARGOCD_AUTH_TOKEN != '' && secrets.ARGOCD_SERVER != '' }}
        run: |
          set -euo pipefail
          mkdir -p "${RECORD_DIR}"
          python - <<'PY'
          import hashlib, json, os, yaml
          from datetime import datetime, timezone
          from pathlib import Path

          HASH_ALGO = "sha3_256"
          path = Path(os.environ["RECORD_DIR"]) / "cd_combinator_argo_rollout.yml"
          synced = os.environ.get("ARGOCD_SYNC_CONFIGURED") == "true"

          entry = {
              "document_kind": "ci-run-record (not a ledger entry; no entry_index)",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "event": "/cd_combinator_argo_rollout",
              "status": "SUCCESS",
              "workflow": "CD Combinator (Argo Rollout)",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "trigger": os.environ.get("GITHUB_EVENT_NAME", ""),
              "deployment": "sovereign-garden",
              "rollout_manifest_applied": "kubectl apply exited 0",
              "argocd_sync": "SYNCED_AND_HEALTHY" if synced else "SKIPPED (secrets not set)",
              "ledger_8925_check": "SOFT (verifier default; mismatch does not fail)",
              "security_headers_source": "PRESENT_IN_SOURCE",
              "hash_algo": HASH_ALGO,
              "seal": "∀∞φ² · CD_COMBINATOR_RUN_RECORD · WOOD_DRAGON_0.91",
          }
          # Same canonical form as .github/scripts/verify_ledger.py Regime A
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"),
                             ensure_ascii=False)
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h

          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True), encoding="utf-8")
          print(f"Run record written to {path} (artifact only).")
          print(f"{HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify run record (SHA3-256, hard)
        if: success()
        run: |
          set -euo pipefail
          python .github/scripts/verify_ledger.py --hard ci-out/cd_combinator_argo_rollout.yml

      - name: Confirm sealed ledger untouched
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- ledger ledger.v2
          if [ -n "$(git status --porcelain --untracked-files=all -- ledger ledger.v2)" ]; then
            git status --porcelain --untracked-files=all -- ledger ledger.v2
            echo "::error::untracked files appeared under ledger/ or ledger.v2/"
            exit 1
          fi
          echo "ledger/ and ledger.v2/ unchanged by this run"

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-combinator-run-record
          path: ci-out/cd_combinator_argo_rollout.yml
          retention-days: 14
          if-no-files-found: warn

      - name: Final summary
        if: always()
        run: |
          {
            echo "### CD Combinator"
            echo ""
            echo "- job status: ${{ job.status }}"
            echo "- hash_algo: sha3_256"
            echo "- run record: artifact cd-combinator-run-record (not written to the ledger)"
            echo "- ledger: no entry written or committed by CI"
          } >> "$GITHUB_STEP_SUMMARY"
