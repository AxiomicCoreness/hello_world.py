name: CD Combinator (Argo Rollout)

# Seal: ∀∞φ² · CD_COMBINATOR_8926 · WOOD_DRAGON_0.91 · SEALED
# Witness: 8925 → 8926 — UNBROKEN
# cryptography: python -m pip + .github/scripts/verify_ledger.py
# hash_algo: sha3_256 (FIPS 202) — mandatory for all ledger entries

on:
  workflow_run:
    workflows: ["Master Equation Integration Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sync:
        description: "Force Argo CD live sync"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: cd-combinator
  cancel-in-progress: false

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    name: Verify Ledger Signatures & Security Headers
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --quiet cryptography pyyaml
      - name: Verify ledger entry 8925 (soft-skip if missing)
        run: |
          set -euo pipefail
          if [ -f "ledger/8925.yaml" ]; then
            if [ -f .github/scripts/verify_ledger.py ]; then
              python .github/scripts/verify_ledger.py ledger/8925.yaml
            else
              echo "verify_ledger.py absent — soft skip 8925 verification"
            fi
          else
            echo "ledger/8925.yaml not found — skipping verification"
          fi
      - name: Verify security headers in FastAPI middleware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          p = Path("port380_mcp.py")
          if not p.exists():
              print("port380_mcp.py missing — skip")
              sys.exit(0)
          content = p.read_text(encoding="utf-8", errors="replace")
          required = [
              "CORSMiddleware",
              "SecurityHeadersMiddleware",
              "Content-Security-Policy",
              "Strict-Transport-Security",
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
          ]
          missing = [h for h in required if h not in content]
          if missing:
              print(f"Missing headers: {missing}")
              sys.exit(1)
          print("All security headers present")
          PY
  trigger-rollout:
    name: Trigger · Argo Rollout
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-integrity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Workflow gate (NOT DeepInfer MoE TopKGate): skip kubectl when cluster secrets empty.
      - name: Gate cluster credentials
        id: cluster
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
          GKE_REGION: ${{ secrets.GKE_REGION }}
        run: |
          set -euo pipefail
          if [ -n "${EKS_CLUSTER_NAME:-}" ] && [ -n "${AWS_REGION:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "provider=eks" >> "$GITHUB_OUTPUT"
            echo "EKS credentials present — deploy will proceed"
          elif [ -n "${GKE_CLUSTER_NAME:-}" ] && [ -n "${GKE_REGION:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "provider=gke" >> "$GITHUB_OUTPUT"
            echo "GKE credentials present — deploy will proceed"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "provider=none" >> "$GITHUB_OUTPUT"
            echo "EKS_CLUSTER_NAME/AWS_REGION (or GKE_*) empty — kubectl deploy skipped (neutral success)"
            echo "Refusing empty --name/--region and localhost:8080 apply failures"
          fi

      - name: Configure kubeconfig (OIDC / cloud CLI)
        if: steps.cluster.outputs.ready == 'true'
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
          GKE_REGION: ${{ secrets.GKE_REGION }}
          PROVIDER: ${{ steps.cluster.outputs.provider }}
        run: |
          set -euo pipefail
          if [ "$PROVIDER" = "eks" ]; then
            if ! command -v aws >/dev/null 2>&1; then
              echo "aws CLI missing but EKS secrets set — cannot configure kubeconfig"
              exit 1
            fi
            aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          elif [ "$PROVIDER" = "gke" ]; then
            if ! command -v gcloud >/dev/null 2>&1; then
              echo "gcloud missing but GKE secrets set — cannot configure kubeconfig"
              exit 1
            fi
            gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" --region "$GKE_REGION"
          else
            echo "Unexpected provider=$PROVIDER"
            exit 1
          fi

      - name: Verify kubectl access
        if: steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          kubectl cluster-info --request-timeout=5s
          kubectl get namespaces

      - name: Install Argo Rollouts kubectl plugin
        if: steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Apply Rollout manifest (robust)
        if: steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ROLLOUT_MANIFEST=""
          for candidate in \
            "argocd/rollout-sovereign-garden-gateway-multistage.yaml" \
            "argocd/rollout-sovereign-garden.yaml" \
            "argocd/rollout.yaml"; do
            if [ -f "$candidate" ]; then
              ROLLOUT_MANIFEST="$candidate"
              break
            fi
          done
          if [ -n "$ROLLOUT_MANIFEST" ]; then
            echo "Applying manifest: $ROLLOUT_MANIFEST"
            kubectl apply -f "$ROLLOUT_MANIFEST"
          else
            echo "No catalogued Rollout found — applying minimal fallback"
            MIN=/tmp/sovereign-garden-rollout-minimal.yaml
            cat > "$MIN" <<'YAML'
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata:
            name: sovereign-garden
            namespace: sovereign-garden
          spec:
            replicas: 1
            strategy:
              canary:
                steps:
                  - setWeight: 20
                  - pause: {duration: 30s}
                  - setWeight: 100
            selector:
              matchLabels:
                app: sovereign-garden
            template:
              metadata:
                labels:
                  app: sovereign-garden
              spec:
                containers:
                  - name: sovereign-garden
                    image: axiomic/sovereign-engine:latest
                    ports:
                      - containerPort: 8000
          YAML
            kubectl apply -f "$MIN"
          fi

      - name: Annotate Rollout (only if it exists)
        if: steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if kubectl get rollout sovereign-garden -n sovereign-garden >/dev/null 2>&1; then
            kubectl annotate rollout sovereign-garden -n sovereign-garden \
              argocd.argoproj.io/sync-options=Prune=true,ApplyOutOfSyncOnly=true \
              argocd.argoproj.io/sync-wave=1 --overwrite
          else
            echo "Rollout 'sovereign-garden' not found — skipping annotation"
          fi

      - name: Argo CD live sync (safe)
        if: steps.cluster.outputs.ready == 'true'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGO_APP: sovereign-garden
        run: |
          set -euo pipefail
          if [ -z "${ARGOCD_AUTH_TOKEN:-}" ] || [ -z "${ARGOCD_SERVER:-}" ]; then
            echo "ARGOCD secrets not set — sync skipped"
            exit 0
          fi
          if ! command -v argocd >/dev/null 2>&1; then
            curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /tmp/argocd
            sudo mv /tmp/argocd /usr/local/bin/argocd
          fi
          argocd app sync "$ARGO_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web --timeout 300 --prune --apply-out-of-sync-only
          argocd app wait "$ARGO_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web --health --timeout 300

      - name: Seal ledger entry 8926 (SHA3-256)
        if: success() && steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p ledger
          python - <<'PY'
          import hashlib, json, yaml
          from pathlib import Path
          from datetime import datetime, timezone
          HASH_ALGO = "sha3_256"
          path = Path("ledger/8926.yaml")
          entry = {
              "entry_index": 8926,
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "event": "/cd_combinator_argo_rollout",
              "status": "SUCCESS",
              "workflow": "CD Combinator (Argo Rollout)",
              "deployment": "sovereign-garden",
              "hash_algo": HASH_ALGO,
              "witness": "8925 -> 8926 -- UNBROKEN",
              "seal": "∀∞φ² · CD_COMBINATOR_8926 · WOOD_DRAGON_0.91 · SEALED",
          }
          body = {k: v for k, v in entry.items() if k != "seal"}
          canon = json.dumps(body, sort_keys=True, separators=(",", ":"))
          h = hashlib.new(HASH_ALGO, canon.encode("utf-8")).hexdigest()
          entry["seal"] = entry["seal"] + " · " + h
          path.write_text(yaml.dump(entry, sort_keys=False,
                                    default_flow_style=False,
                                    allow_unicode=True))
          print("Ledger entry 8926 written.")
          print(f"Sealed 8926 · {HASH_ALGO}:{h[:16]}...")
          PY

      - name: Verify ledger entry 8926 (SHA3-256)
        if: success() && steps.cluster.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -f .github/scripts/verify_ledger.py ]; then
            python .github/scripts/verify_ledger.py ledger/8926.yaml
          else
            echo "verify_ledger.py absent — soft skip"
          fi

      - name: Commit ledger entry if changed
        if: success() && steps.cluster.outputs.ready == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: seal CD Combinator entry 8926 (sha3_256)"
          file_pattern: ledger/8926.yaml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Final summary
        if: always()
        run: |
          {
            echo "### CD Combinator"
            echo ""
            if [ "${{ steps.cluster.outputs.ready }}" = "true" ]; then
              echo "- status: completed (deploy attempted)"
              echo "- provider: \`${{ steps.cluster.outputs.provider }}\`"
              echo "- seal: \`∀∞φ² · CD_COMBINATOR_8926 · WOOD_DRAGON_0.91 · SEALED\`"
              echo "- hash_algo: sha3_256"
              echo "- witness: 8925 -> 8926 -- UNBROKEN"
            else
              echo "- status: skipped (neutral success)"
              echo "- reason: EKS/GKE cluster secrets empty — no kubeconfig, no kubectl apply"
              echo "- note: DeepInfer MoE gate (TopKGate) is unrelated; this is a workflow credential gate"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
