math_origin: |
  Given a token sequence of length L, contexts of order n produce
  C = L - n transitions. Each context c has a count vector v_c.
  Raw probability: P_raw(w|c) = count(c,w) / Σ_w' count(c,w').
  Temperature scaling: P(w|c) = exp(P_raw(w|c)/T) / Σ_w' exp(P_raw(w'|c)/T).
  This is a softmax transformation; T = φ⁻¹.
