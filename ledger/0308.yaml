math_origin: |
  # G₂ structure
  G₂ is the exceptional simple Lie group of rank 2, dimension 14.
  Its Lie algebra 𝔤₂ has 14 generators {T_a}, a = 1,...,14.

  # Frequency ladder construction
  Each generator T_a is assigned a frequency f_a = f₀ · φ^{n_a},
  where n_a is a sequence of integer exponents chosen to span
  the harmonic range. For simplicity, set n_a = a - 1 (a=1..14).
  Thus:
      f_a = f₀ · φ^{a-1},   a = 1,...,14

  # Breathing modulation
  A time‑dependent amplitude modulation (breathing) is applied:
      f_a(t) = f₀ · φ^{a-1} · [1 + χ · sin(2π f₀ t + θ_a)],
  where χ = φ⁻¹ (golden‑ratio damping) and θ_a is a phase offset
  derived from the G₂ root system.

  # Base frequency and reference
  f₀ = 71.975 Hz   (North Star anchor)
  f_starfire = 311.018 Hz   (a resonant frequency obtained by
                             taking φ⁶ · f₀ / 2, for example)

  # Feasibility
  The ladder is mathematically consistent: φ^{a-1} yields a
  geometric sequence; the modulation preserves the harmonic
  relation because χ < 1 ensures stability. The phase offsets
  θ_a are chosen such that the overall power spectrum remains
  within a bounded envelope, avoiding constructive interference
  beyond the designated resonance band.
