[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomiccoreness"
version = "8755.0.0"
description = "AxiomicCoreness/hello_world.py — sovereign_engine_V5: public MIT-licensed sovereign engine for φ-harmonic ledger verification."
readme = "README.md"
authors = [
    { name = "Clarke Yoursa Tee" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["sovereign-engine", "fastapi", "pydantic", "asgi", "ledger-verification", "phi-harmonic"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "matplotlib>=3.10.9"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0"
]

[project.urls]
"Homepage" = "https://github.com/AxiomicCoreness/hello_world.py"
"Repository" = "https://github.com/AxiomicCoreness/hello_world.py"
"Zenodo Archive" = "https://doi.org/10.5281/zenodo.23378305"
"Bug Tracker" = "https://github.com/AxiomicCoreness/hello_world.py/issues"

