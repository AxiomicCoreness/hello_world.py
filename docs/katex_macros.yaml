# 📝∀ KaTeX macro set — strict domain tree.
# Domains under katex.macros: math | garden | physics.
# Stokes micro macros live ONLY in docs/katex_stokes_mandala_9300_micro.* (not here).
# Argument position is #1, #2. Arrays are [definition, numArgs].

katex:
  macros:
    # Domain: Core Quantum / Math (Kernel)
    math:
      "\\half": "\\tfrac{1}{2}"
      "\\third": "\\tfrac{1}{3}"
      "\\quarter": "\\tfrac{1}{4}"
      "\\ket": ["\\left|#1\\right\\rangle", 1]
      "\\bra": ["\\left\\langle#1\\right|", 1]
      "\\braket": ["\\left\\langle#1\\middle|#2\\right\\rangle", 2]
      "\\ketbra": ["\\left|#1\\right\\rangle\\!\\left\\langle#2\\right|", 2]
      "\\expect": ["\\left\\langle#1\\right\\rangle", 1]
      "\\Tr": "\\operatorname{Tr}"
      "\\Det": "\\operatorname{Det}"
      "\\Rank": "\\operatorname{Rank}"
      "\\diag": "\\operatorname{diag}"
      "\\vertex": "\\operatorname{vertex}"
      "\\Res": "\\operatorname{Res}"
      "\\spec": "\\operatorname{spec}"
      "\\Disc": "\\Delta"
      "\\psitwo": "\\psi_{2}"
      "\\phiv": "\\varphi"
      "\\phitwo": "\\varphi^{2}"
      "\\phithree": "\\varphi^{3}"
      "\\phifive": "\\varphi^{5}"
      "\\phieight": "\\varphi^{8}"
      "\\phinine": "\\varphi^{9}"
      "\\seedpoly": "x^{2} - x - 1 = 0"
      "\\seedeq": "\\Disc = b^{2} - 4ac = 5, \\quad x_{\\vertex} = -\\frac{b}{2a} = \\half"

    # Domain: Garden Specific (HHMI / Connectome)
    garden:
      "\\phiinv": "\\varphi^{-1}"
      "\\darktrace": "\\Tr(\\rho) = 1, \\quad \\Tr(\\rho^{2}) = 1"
      "\\darklambda": "\\lambda_{2} = 1"
      "\\darkeig": "H\\ket{\\psitwo} = 1 \\cdot \\ket{\\psitwo}"
      "\\darksv": "\\ket{\\psitwo} = \\frac{1}{\\sqrt{2}} \\begin{pmatrix} 1 \\\\ 0 \\\\ -1 \\end{pmatrix}"
      "\\trimerham": "H = \\begin{pmatrix} 1 & \\phiinv & 0 \\\\ \\phiinv & 2 & \\phiinv \\\\ 0 & \\phiinv & 1 \\end{pmatrix}"
      "\\eternalnow": "\\text{Eternal Now}"
      "\\wooddragon": "\\text{WOOD\\_DRAGON\\_0.91}"
      "\\connectome": "\\mathcal{C}"

    # Domain: Physics / Thermodynamics
    physics:
      "\\kB": "k_{\\mathrm{B}}"
      "\\hbar": "h\\!\\!\\!-\\!\\!\\!-"
      "\\entropy": "S_{\\text{sys}}"
