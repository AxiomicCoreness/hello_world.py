# ============================================================================
# AxiomicCoreness — unified canonical compose surface
# ============================================================================
# MERGED CONTEXT: 
#   - Core services: FastAPI (8000) + MCP Bridge (380) [New Context]
#   - Sidecars: app_main (8001/8012), hyperian (8080) [Old Context]
#   - Metrics: Prometheus (9090), Workload exporter (9095) [Old Context]
#   - Utilities & Daemons: Symplectic (oneshot), Gemini Daemon [Old Context]
#
# USAGE:
#   docker compose up -d                      # Starts core + sidecars
#   docker compose --profile status run ...   # Runs symplectic validation
#   docker compose --profile daemon up -d     # Starts Gemini daemon
# ============================================================================
version: "3.8"

# Shared environment for services built from the canonical image
x-common-env: &common-env
  GARDEN_SECRET: ${GARDEN_SECRET:?GARDEN_SECRET is required}
  BIND_HOST: 0.0.0.0
  SOVEREIGN_CP: /app/target/classes
  SOVEREIGN_TIMEOUT_S: 180
  SOVEREIGN_MODE: ${SOVEREIGN_MODE:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:

  # --------------------------------------------------------------------------
  # CORE: FastAPI app — app.main:app on port 8000
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: axiomic-coreness:latest
    container_name: axiomic-app
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      BIND_PORT: 8000
      PORT: 8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # CORE: port380 MCP restart bridge — port380_mcp.py on port 380
  # --------------------------------------------------------------------------
  mcp-bridge:
    image: axiomic-coreness:latest
    container_name: axiomic-mcp-bridge
    command: ["python3", "port380_mcp.py"]
    ports:
      - "380:380"
    environment:
      <<: *common-env
      PORT: 380
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SIDECAR: app_main (port 8001)
  # --------------------------------------------------------------------------
  app-main:
    image: axiomic-coreness:latest
    container_name: garden-app-main
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      PORT: 8001
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SIDECAR: Gravastar Trigger (port 8012)
  # --------------------------------------------------------------------------
  gravastar-trigger:
    image: axiomic-coreness:latest
    container_name: garden-gravastar
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8012"]
    ports:
      - "8012:8012"
    environment:
      <<: *common-env
      PORT: 8012
      GRAVASTAR_PORT: 8012
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SIDECAR: Hyperian JSON Server (port 8080)
  # --------------------------------------------------------------------------
  hyperian:
    image: axiomic-coreness:latest
    container_name: garden-hyperian
    command: ["python", "hyperian_json_server.py", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      PORT: 8080
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # METRICS: Prometheus Metrics Server (port 9090)
  # --------------------------------------------------------------------------
  metrics:
    image: axiomic-coreness:latest
    container_name: garden-metrics
    command: ["python", "-m", "prometheus.metrics_server", "--port", "9090"]
    ports:
      - "9090:9090"
    environment:
      <<: *common-env
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # METRICS: Sovereign Workload Exporter (port 9095)
  # --------------------------------------------------------------------------
  workload:
    image: axiomic-coreness:latest
    container_name: garden-workload
    command: ["python", "monitoring/sovereign_workload_exporter.py", "--port", "9095"]
    ports:
      - "9095:9095"
    environment:
      <<: *common-env
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # UTILITY: Symplectic dual-output generator (oneshot)
  # Profile: status
  # --------------------------------------------------------------------------
  symplectic-status:
    image: axiomic-coreness:latest
    container_name: garden-symplectic-status
    working_dir: /app
    command:
      - sh
      - -c
      - |
        pip install -q jsonschema &&
        python symplectic_status.py &&
        python -m jsonschema -i symplectic_status.json schemas/symplectic-status.json &&
        echo "ACK steps 1-9 complete" &&
        head -n 4 symplectic_status.agent.jsonl
    environment:
      <<: *common-env
    volumes:
      - ./:/app
    profiles:
      - status

  # --------------------------------------------------------------------------
  # DAEMON: Gemini Daemon (codespace health + optional handoff)
  # Profile: daemon, full
  # --------------------------------------------------------------------------
  gemini-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    image: garden-gemini-daemon:8953
    container_name: garden-gemini-daemon
    environment:
      - DAEMON_CHECK_INTERVAL=${DAEMON_CHECK_INTERVAL:-60}
      - CODESPACE_IDLE_TIMEOUT_MINUTES=${CODESPACE_IDLE_TIMEOUT_MINUTES:-30}
      - CODESPACE_WARNING_MIN=${CODESPACE_WARNING_MIN:-5}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_HANDOFF=${GEMINI_HANDOFF:-false}
      - GH_TOKEN=${GH_TOKEN:-${GITHUB_TOKEN:-}}
      - DAEMON_METRICS_PATH=/tmp/gemini_daemon.prom
    volumes:
      - gemini-daemon-metrics:/tmp
    restart: unless-stopped
    profiles:
      - daemon
      - full

volumes:
  gemini-daemon-metrics:
