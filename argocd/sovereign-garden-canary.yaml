apiVersion: v1
kind: Service
metadata:
  name: sovereign-garden-canary
  namespace: sovereign-garden
  labels:
    app: sovereign-garden
    role: canary
spec:
  selector:
    app: sovereign-garden
    role: canary
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: deepseek-get
      port: 8001
      targetPort: 8001
    - name: deepseek-post
      port: 8002
      targetPort: 8002
