apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sovereign-garden
  namespace: argocd
  annotations:
    garden.axiomic/entry: "8813"
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/AxiomicCoreness/hello_world.py.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: sovereign-garden
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Argo Rollouts uses Server-Side Apply to mutate HTTPRoutes during a canary.
      # This tells Argo CD to ignore mutations made by the Rollouts controller.
      managedFieldsManagers:
        - argo-rollouts
      # Fallback for the specific canary label (if managedFields isn't used)
      jsonPointers:
        - /metadata/labels/rollouts.argoproj.io~1gatewayapi-canary
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
