# Argo CD Application fragment — ignore live weight / header rules
# while Gateway API plugin owns the HTTPRoute during a canary.
#
# Merge the ignoreDifferences block into argocd/application-sovereign-garden.yaml
# (or set the equivalent annotation / ConfigMap customization).
#
# Entry 8813 · WOOD_DRAGON_GATE · 0.91

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sovereign-garden
  namespace: argocd
  annotations:
    # Alternative to ignoreDifferences: resource customization key
    # (see ConfigMap argocd-cm if using global jqPathExpressions)
    garden.axiomic/entry: "8813"
spec:
  project: default
  source:
    repoURL: https://github.com/AxiomicCoreness/hello_world.py.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: sovereign-garden
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # While the plugin stamps the in-progress label, do not let Argo CD
      # fight live backendRefs weights or injected header rules.
      jqPathExpressions:
        - select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress") | .spec.rules
        - select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress") | .metadata.labels
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
---
