apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: sovereign-health-check
  namespace: sovereign-garden
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  args:
  - name: service-name
  metrics:
  - name: health-check
    interval: 10s
    count: 6
    # FIX: Use JSONPath to extract the exact field, assuming the JSON is {"status": "healthy"}
    successCondition: result.status == "healthy"
    failureCondition: result.status == "unhealthy" || result.status == "error"
    failureLimit: 2
    provider:
      http:
        url: "http://{{args.service-name}}:8000/health"
        method: GET
        # Optional but highly recommended: Enforce timeout and headers
        timeoutSeconds: 5
        headers:
          - name: Accept
            value: application/json
